</style>

  html+='</div>';
 }else{
  html='<div class="answerline '+(answers[index]===o.correct?'good':'bad')+'">'+(answers[index]===o.correct?'DOĞRU TAHMİN.':'BEKLENEN CEVAP BU DEĞİLDİ.')+'</div>';
  html+='<p class="explain">'+escapeHTML(o.story)+'</p><div class="fact"><b>İŞİN GARİBİ</b>'+escapeHTML(o.fact)+'</div>';
  html+='<div class="source">KAYNAK: <a href="'+o.link+'" target="_blank" rel="noopener noreferrer">BİLİMSEL ARKA PLAN ↗</a><br>FOTOĞRAF: <a href="'+photoLink(o)+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(o.credit)+' ↗</a></div>';
  html+='<button class="choice correct" id="continue" style="justify-content:space-between;margin-top:15px;font-weight:700">SONRAKİ NESNE <span>→</span></button>';
 }
 qa.innerHTML=html;
 qa.querySelectorAll('[data-choice]').forEach(function(btn){btn.addEventListener('click',function(){choose(Number(btn.dataset.choice))})});
 var ct=$('continue');if(ct)ct.addEventListener('click',function(){if(index===objects.length-1)showSummary();else navigate(1)});
 $('result').textContent=c.total===objects.length?'SONUCU GÖR →':'SONUCU GÖR →';
 updatedCount();
}
function navigate(dir){if(summary)summary=false;index=(index+dir+objects.length)%objects.length;render()}
function showSummary(){
 summary=true;var c=counts();
 $('eyebrow').textContent='ENVANTER KAPANDI';
 $('title').textContent='İnceleme tamamlandı.';
 $('title').classList.remove('reveal');
 $('material').textContent='8 / GERÇEK NESNE';
 $('category').textContent='MALZEME BİLİMİ';
 $('status').textContent='KOLEKSİYON: TAMAMLANDI';
 qa.innerHTML='<div class="finish"><div class="eyebrow">BULGU RAPORU</div><h2>'+c.correct+' / '+objects.length+'</h2><p>'+ (c.total<objects.length?'Henüz '+(objects.length-c.total)+' nesneye bakmadın. ':'')+(c.correct>=7?'Garipliği tanımakta iyisin.':c.correct>=4?'Eşyalara biraz daha kuşkuyla bakabilirsin.':'Nesneler senden daha karmaşık çıktı.')+'</p><button type="button" class="btn" id="again">TEKRAR İNCELE ↗</button><button type="button" class="btn" id="share-result">SONUCU PAYLAŞ ↗</button></div>';
 $('again').onclick=function(){index=0;answers={};render()};
 $('share-result').onclick=share;
 updatedCount();
}
function share(){var c=counts(),s='8 garip nesneden '+c.correct+' tanesini bildim. Sen kaçını bilirsin?';var url=location.origin+location.pathname;if(navigator.share)navigator.share({title:'Ne İşe Yarıyor? — aynen.fun',text:s,url:url}).catch(function(){});else if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s+' '+url).then(function(){showToast('BAĞLANTI KOPYALANDI')}).catch(function(){showToast('PAYLAŞIM KULLANILAMIYOR')});else showToast('BAĞLANTI: '+url)}
$('prev').addEventListener('click',function(){navigate(-1)});
$('next').addEventListener('click',function(){navigate(1)});
$('shuffle').addEventListener('click',function(){var j=index;while(j===index)j=Math.floor(Math.random()*objects.length);index=j;render()});
$('share').addEventListener('click',share);
$('result').addEventListener('click',showSummary);
shell.addEventListener('click',function(){shell.classList.toggle('zoom')});
document.addEventListener('keydown',function(e){if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'){navigate(-1)}else if(e.key==='ArrowRight'){navigate(1)}else if(e.key==='Escape'){shell.classList.remove('zoom')}else if(e.key==='Enter'&&hasAnswer(index)&&!summary){if(index===objects.length-1)showSummary();else navigate(1)}else if(/^[123]$/.test(e.key)&&!summary)choose(Number(e.key)-1)});
render();
})();
</script>
</body>
</html>
