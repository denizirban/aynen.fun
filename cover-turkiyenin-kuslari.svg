<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Canlı kobalt mavi ve limon sarısı renkler önünde turkuaz ve turuncu yalıçapkını illüstrasyonu">
<defs>
 <linearGradient id="blue" x1="0" y1="0" x2=".97" y2="1"><stop stop-color="#2f5be7"/><stop offset="1" stop-color="#1d2f94"/></linearGradient>
 <linearGradient id="birdBlue" x1=".2" y1=".1" x2="1" y2="1"><stop stop-color="#74eddd"/><stop offset=".56" stop-color="#09a8bd"/><stop offset="1" stop-color="#085eab"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffd170"/><stop offset=".52" stop-color="#fc8855"/><stop offset="1" stop-color="#da4f54"/></linearGradient>
</defs>
<!-- Poster-like, high-contrast editorial artwork that reads at thumbnail scale -->
<rect x="8" y="8" width="304" height="204" rx="7" fill="url(#blue)"/>
<path d="M8 151Q81 131 131 159Q194 194 312 148V212H8Z" fill="#e4eb77"/>
<circle cx="197" cy="104" r="83" fill="#70e2c8"/>
<path d="M108 8Q78 31 63 72Q45 113 8 129V8Z" fill="#ff9c90"/>
<path d="M270 10Q287 49 312 64V8Z" fill="#f6b667"/>
<circle cx="73" cy="75" r="21" fill="#e7f187"/>
<circle cx="274" cy="174" r="25" fill="#fb8b80"/>
<!-- visual sound motif -->
<g fill="none" stroke="#193a9d" stroke-width="3.2" stroke-linecap="round">
 <path d="M35 100Q50 88 65 101"/><path d="M25 114Q48 93 74 116"/>
</g>
<!-- perch and dynamic diagonal -->
<path d="M44 190Q128 180 290 203" fill="none" stroke="#1d2855" stroke-width="8" stroke-linecap="round"/>
<path d="M99 187L77 170M252 201l20-13" fill="none" stroke="#1d2855" stroke-width="5" stroke-linecap="round"/>
<!-- elegant elongated tail, black rim with vivid blue feather splits -->
<path d="M130 143Q106 166 62 201Q109 193 156 173L162 153Z" fill="#174eaa" stroke="#193366" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M127 163Q105 178 80 190M142 168Q116 184 101 189" fill="none" stroke="#83ede2" stroke-width="4" stroke-linecap="round"/>
<!-- body, orange chest, teal mantle -->
<path d="M148 103Q184 94 204 124Q219 152 201 170Q177 191 146 172Q120 150 128 125Q132 112 148 103Z" fill="url(#orange)" stroke="#173d69" stroke-width="3.6" stroke-linejoin="round"/>
<path d="M144 112Q170 107 188 124Q202 142 184 163Q174 179 148 170Q133 161 130 140Q127 122 144 112Z" fill="url(#birdBlue)" stroke="#153d73" stroke-width="3.8"/>
<path d="M142 125Q160 118 177 129M137 139Q156 131 181 140M139 154Q153 150 174 152" stroke="#8aeadd" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>
<!-- white side patch, bold orange chest visible at small sizes -->
<path d="M182 129Q198 130 202 149Q204 164 189 168L179 167Q189 145 182 129Z" fill="#fbe8b1"/>
<!-- neck and head -->
<path d="M185 91Q184 65 211 55Q238 46 251 69Q264 91 246 108Q234 123 215 117L198 128Q187 114 185 91Z" fill="url(#birdBlue)" stroke="#173d69" stroke-width="3.6"/>
<path d="M198 69Q219 57 237 64M191 78Q220 65 247 76M198 90Q219 81 248 87" fill="none" stroke="#99f2d1" stroke-width="5" stroke-linecap="round"/>
<!-- cheek, throat -->
<path d="M208 100Q222 111 240 101Q236 117 219 122L206 116Z" fill="#ffb55f" stroke="#173d69" stroke-width="2"/>
<path d="M204 109Q215 115 222 114" stroke="#fcf3da" stroke-width="6" stroke-linecap="round"/>
<!-- distinctive long kingfisher bill -->
<path d="M244 79L306 87L244 98Q251 87 244 79Z" fill="#152956" stroke="#14234a" stroke-width="2" stroke-linejoin="round"/>
<path d="M250 86L301 88" stroke="#d7e1ac" stroke-width="2" stroke-linecap="round"/>
<!-- bright eye -->
<circle cx="236" cy="82" r="5.2" fill="#0b1b34"/><circle cx="237.7" cy="80" r="1.8" fill="#ffffff"/>
<!-- legs/feet -->
<path d="M170 168L163 184L153 189M189 165L192 186L182 192" stroke="#9b4e41" stroke-width="4.2" fill="none" stroke-linecap="round"/>
<path d="M152 189L143 189M152 189L157 192M183 192L173 194" stroke="#9b4e41" stroke-width="2.6" stroke-linecap="round" fill="none"/>
<!-- small poster dots -->
<circle cx="49" cy="153" r="3" fill="#1d429d"/><circle cx="287" cy="132" r="4" fill="#e4eb77"/>
</svg>