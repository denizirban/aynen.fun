.tack:disabled{opacity:.5}@media(max-width:520px){.hud p#point{max-width:46vw}} </style></head><body><canvas id="sea"></canvas><div class="hud"><h1>YELKEN</h1><p id="speed">0.0 knot</p><p id="point">Rüzgârı yakala.</p></div><div class="wind" id="wind">RÜZGÂR ↗<br>12 knot</div><a class="back" href="/">← aynen.fun</a><div class="tip" id="tip">Sert rüzgârda yelkeni boşla · Tramola için hızını koru</div><div class="controls"><div><div class="wheel" id="wheel"><span id="wheelIcon">┃</span></div><div class="control-label">İSTAKA</div></div><div class="right"><label class="sheet">YELKEN AÇISI<input id="sheet" aria-label="Yelken açıklığı" type="range" min="0" max="90" value="35"></label><div><button class="tack" id="tack">TRAMOLA ↶</button><div class="control-label">YÖN DEĞİŞTİR</div></div></div></div><script>
const c=document.getElementById('sea'),ctx=c.getContext('2d'),wheel=document.getElementById('wheel'),icon=document.getElementById('wheelIcon'),sheet=document.getElementById('sheet'),tack=document.getElementById('tack');let W,H,D,tm=0,last=0,heading=-.7,windDir=1.05,windTarget=1.05,windSpeed=12,speed=2.1,rudder=0,roll=0,boatX=0,boatY=0,dist=0,tacking=0,turnRate=0,heel=0,heelDeg=0,stress=0,stalled=0,gybeFlash=0,knockdown=0,lastRel=0,eventMsg='',eventEnd=0,score=0,goodSeconds=0,foam=[],clouds=[];const windNames=['YILDIZ','POYRAZ','GÜNDOĞUSU','KEŞİŞLEME','KIBLE','LODOS','GÜNBATISI','KARAYEL'];const pi=Math.PI,wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);boatX=W*.5;boatY=H*.51}addEventListener('resize',resize);resize();for(let i=0;i<100;i++)foam.push({x:Math.random()*2400-1200,y:Math.random()*2400-1200,r:Math.random()*2+.5});let start=null;function pointer(e){if(start===null)return;rudder=clamp((e.clientX-start)/65,-1,1);icon.style.transform='rotate('+Math.round(rudder*100)+'deg)'}wheel.addEventListener('pointerdown',e=>{wheel.setPointerCapture(e.pointerId);let r=wheel.getBoundingClientRect();start=e.clientX;pointer(e)});wheel.addEventListener('pointermove',pointer);function release(){start=null;rudder=0;icon.style.transform='rotate(0deg)'}wheel.addEventListener('pointerup',release);wheel.addEventListener('pointercancel',release);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')rudder=-1;if(e.key==='ArrowRight')rudder=1;if(e.key===' ') {e.preventDefault();doTack()}});addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))rudder=0});function doTack(){if(tacking||knockdown>0)return;if(speed<1.6){stalled=3;eventMsg='KÖRE KALDIN · İstakayı ortaya al, yelkeni biraz aç';eventEnd=tm+3;score=Math.max(0,score-5);return}tacking=2.2;tack.textContent='DÖNÜYOR…';setTimeout(()=>tack.textContent='TRAMOLA ↶',2000)}tack.addEventListener('click',doTack);function line(x1,y1,x2,y2,w,color){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function polygon(points,fill,stroke='#153d48',width=1.5){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke()}}function draw(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;tm+=dt;windTarget+=Math.sin(tm*.19)*dt*.13;if(Math.floor(tm/14)!==Math.floor((tm-dt)/14)){windTarget+=(Math.random()-.5)*.65;windSpeed=7+Math.random()*12}windDir+=wrap(windTarget-windDir)*dt*.12;let rel=wrap(windDir-heading),abs=Math.abs(rel),sail=+sheet.value*pi/180,optimal=clamp(abs*.72,.18,1.45),trim=clamp(1-Math.abs(sail-optimal)/1.5,.12,1),power=abs<.43?.04:Math.pow(Math.sin(abs*.5),.75)*trim;let target=clamp(windSpeed*power*.72,0,11.5);if(abs<.65)target*=Math.max(0,(abs-.30)/.35);if(stalled>0){stalled=Math.max(0,stalled-dt);target*=.15}speed+=(target-speed)*dt*.75;let heelTarget=clamp(Math.pow(Math.abs(Math.sin(rel)),1.4)*power*windSpeed*2.4,0,65);if(knockdown>0){knockdown=Math.max(0,knockdown-dt);heelTarget=Math.max(heelTarget,knockdown>2?72:knockdown*23);speed*=Math.max(.5,1-dt*1.4)}heelDeg+=(heelTarget-heelDeg)*Math.min(1,dt*1.2);if(speed>3&&heelDeg<28&&power>.4&&knockdown<=0){goodSeconds+=dt;score+=dt*speed*.35}if(heelDeg>43&&knockdown<=0){stress+=dt;if(stress>2.8){knockdown=5;stress=0;eventMsg='TEKNE SERTÇE YATTI · Yelkeni boşla!';eventEnd=tm+5;score=Math.max(0,score-20)}}else stress=Math.max(0,stress-dt*1.5);if(lastRel&&Math.abs(lastRel)>2.65&&Math.abs(rel)>2.65&&Math.sign(lastRel)!==Math.sign(rel)&&Math.abs(turnRate)>.13){gybeFlash=3;eventMsg='İSTEMSİZ KAVANÇA! Bumba karşı tarafa geçti';eventEnd=tm+3;speed*=.75;score=Math.max(0,score-15)}lastRel=rel;gybeFlash=Math.max(0,gybeFlash-dt);if(tacking>0){heading+=Math.sign(rel||1)*dt*1.65;tacking-=dt;speed*=1-dt*.6}else {turnRate+=((-rudder*(.3+speed*.075))-turnRate)*Math.min(1,dt*3);heading+=turnRate*dt;}roll+=(Math.sin(tm*2.1)*.018+Math.sign(rel||1)*heelDeg*pi/180-roll)*dt*1.35;heel+=(roll-heel)*Math.min(1,dt*1.4);dist+=speed*dt*6;let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a7dce2');g.addColorStop(1,'#6eb6c3');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let cx=W/2,cy=H*.48;ctx.save();ctx.translate(cx,cy);ctx.rotate(-heading);for(let i=0;i<foam.length;i++){let f=foam[i],x=((f.x-dist*Math.sin(heading)*.65+5000)%2400+2400)%2400-1200,y=((f.y+dist*Math.cos(heading)*.65+5000)%2400+2400)%2400-1200;line(x,y,x+9+f.r*5,y-2,.6+f.r*.3,'#e4f7f580')}ctx.restore();ctx.save();let horizon=H*.43+Math.sin(tm*.95)*3+heel*W*.08;let sea=ctx.createLinearGradient(0,horizon,0,H);sea.addColorStop(0,'#68aebb');sea.addColorStop(1,'#24758e');ctx.fillStyle=sea;ctx.fillRect(0,horizon,W,H-horizon);ctx.save();ctx.translate(W*.5,horizon);ctx.rotate(-heel*.22);ctx.translate(-W*.5,-horizon);for(let i=0;i<95;i++){let z=i/95,y=horizon+Math.pow(z,1.65)*(H-horizon)+Math.sin(tm*1.4+i*.8)*z*4,x=((i*179+dist*(.3+z*1.8))%(W+120))-60;line(x,y,x+10+z*85,y+Math.sin(tm*2+i)*z*2,.5+z,'#dcf6f688')}ctx.restore();ctx.translate(W/2,H*.79+Math.sin(tm*1.45)*4);ctx.rotate(heel*.9+Math.sin(tm*.85)*.008+(gybeFlash>0?Math.sin(tm*16)*.015:0));let sc=Math.max(.78,Math.min(W/420,1.4));ctx.scale(sc,sc);let h=H/sc;polygon([[-W/sc*.65,h*.3],[W/sc*.65,h*.3],[125,20],[85,-10],[-85,-10],[-125,20]],'#e9e5da','#35545e',3);polygon([[-82,4],[82,4],[103,36],[-103,36]],'#bcae95','#7c8079',2);for(let k=-2;k<=2;k++)line(k*26,14,k*30,h*.3,1,'#d2c7b5');line(-125,20,-96,-13,4,'#f5f6ef');line(125,20,96,-13,4,'#f5f6ef');line(-96,-13,96,-13,4,'#f5f6ef');ctx.save();ctx.translate(0,26);ctx.strokeStyle='#785e43';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(rudder*58,48);ctx.stroke();ctx.fillStyle='#b9a58c';ctx.beginPath();ctx.arc(rudder*58,48,7,0,pi*2);ctx.fill();ctx.restore();line(0,-15,0,-h*.75,7,'#b4bdc0');line(0,-15,0,-h*.75,2,'#f7f9f5');let side=Math.sign(rel)||1,flap=abs<.43?Math.sin(tm*19)*12:Math.sin(tm*5)*3*(1-power),belly=side*(10+power*38)+flap,boom=side*(22+sail*67);ctx.save();ctx.translate(0,-20);ctx.rotate(Math.sin(tm*.6)*.012);ctx.shadowColor='#123e4744';ctx.shadowBlur=9;polygon([[0,-h*.72],[boom*.12,-h*.55],[boom*.6+belly*.25,-h*.33],[boom+belly*.18,-30],[0,-30]],'#fffdf1','#9ca9a9',1.5);ctx.shadowBlur=0;line(0,-h*.72,boom+belly*.18,-30,1,'#a2b1af');for(let q=1;q<5;q++){let yy=-h*.72+q*(h*.72-30)/5;line(boom*q/6,yy,boom*q/6+belly*.15,yy+7,.7,'#d2d4c9')}ctx.restore();ctx.save();ctx.translate(0,-h*.36);let jib=side*(W/sc*.27+flap*.5);polygon([[0,-h*.32],[jib*.13,-h*.19],[jib,55],[0,75]],'#f7f6ea','#aeb9b9',1.4);line(0,-h*.32,jib,55,1,'#b9c5c3');ctx.restore();ctx.save();ctx.translate(0,-20);ctx.strokeStyle='#c4bca9';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(boom+belly*.18,-30);ctx.stroke();ctx.strokeStyle='#f9f6e8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(boom+belly*.18,-30);ctx.lineTo(side*85,16);ctx.stroke();ctx.restore();line(-85,0,-30,-h*.73,1,'#e6f1ee');line(85,0,14,-h*.73,1,'#e6f1ee');ctx.restore();let wx=W-51,wy=91;ctx.save();ctx.translate(wx,wy);ctx.rotate(rel+pi/2);line(-19,0,19,0,2,'#123e4b');polygon([[24,0],[9,-7],[9,7]],'#123e4b');ctx.restore();document.getElementById('speed').textContent=speed.toFixed(1)+' knot · YATIŞ '+Math.round(heelDeg)+'° · '+Math.floor(score)+' puan';document.getElementById('point').textContent=tm<eventEnd?eventMsg:heelDeg>42?'TEHLİKELİ YATIŞ · YELKENİ BOŞLA':heelDeg>27?'FAZLA YATIŞ · YELKENİ AÇ':abs<.43?'YELKEN BOŞTA · Rüzgârdan uzaklaş':tacking>0?'TRAMOLA · Yelken taraf değiştiriyor':power>.65?'YELKEN DOLU · İyi seyir':sail>optimal+.25?'İpi çek · Yelkeni topla':'İpi bırak · Yelkeni aç';let trueBearing=((windDir*180/pi+90)%360+360)%360,windName=windNames[Math.round(trueBearing/45)%8],pointOfSail=abs<.65?'KÖR BÖLGE':abs<1.05?'ORSA':abs<1.4?'DAR APAZ':abs<2.05?'APAZ':abs<2.75?'GENİŞ APAZ':'PUPA';document.getElementById('wind').innerHTML='<strong>'+windName+' ESİYOR</strong><br>'+Math.round(trueBearing)+'° · '+Math.round(windSpeed)+' knot<br><small>'+pointOfSail+' · Tekneye göre '+Math.round(Math.abs(rel)*180/pi)+'° '+(rel>=0?'sancak':'iskele')+'</small>';requestAnimationFrame(draw)}requestAnimationFrame(draw);
