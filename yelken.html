<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9ed5dd"><title>Yelken — aynen.fun</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#a9d9df;color:#102e38;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:max(16px,env(safe-area-inset-top));left:18px;z-index:2;pointer-events:none}.hud h1{font-size:14px;letter-spacing:.13em;margin:0 0 8px;font-weight:800}.hud p{font:11px/1.7 monospace;margin:0;opacity:.8}.wind{position:fixed;right:18px;top:max(18px,env(safe-area-inset-top));font:11px/1.5 monospace;text-align:right;pointer-events:none}.controls{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:0;width:100%;display:flex;align-items:end;justify-content:space-between;padding:0 24px;gap:20px;z-index:3}.wheel{width:112px;height:112px;border:2px solid #163d47;border-radius:50%;background:#ffffffb8;touch-action:none;position:relative;display:grid;place-items:center;box-shadow:0 5px 20px #16455322;user-select:none}.wheel:before{content:"";position:absolute;width:80px;height:80px;border:2px dashed #16455380;border-radius:50%}.wheel span{font-size:40px;line-height:1;transform:rotate(var(--wheel,0deg))}.control-label{font:10px monospace;letter-spacing:.09em;text-align:center;margin-top:8px}.right{display:flex;align-items:center;gap:12px}.tack{height:70px;min-width:105px;border:1.5px solid #163d47;background:#fffdf4;border-radius:5px;font:700 13px Arial;box-shadow:3px 4px 0 #163d4730;touch-action:manipulation}.tack:active{transform:translateY(2px);box-shadow:none}.sheet{height:70px;width:48px;border:1px solid #163d47;background:#ffffffb8;border-radius:5px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:10px monospace;gap:5px}.sheet input{height:110px;width:22px;transform:rotate(0deg);accent-color:#174c59;touch-action:auto}.back{position:fixed;left:18px;top:90px;font:11px monospace;color:#123b46;z-index:5;text-decoration:none}.tip{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);font:11px monospace;white-space:nowrap;opacity:.7;pointer-events:none}@media(max-width:520px){.wheel{width:96px;height:96px}.wheel:before{width:68px;height:68px}.controls{padding:0 18px}.tip{bottom:142px;font-size:10px}.tack{min-width:92px}}</style></head><body><canvas id="sea"></canvas><div class="hud"><h1>YELKEN</h1><p id="speed">0.0 knot</p><p id="point">Rüzgârı yakala.</p></div><div class="wind" id="wind">RÜZGÂR ↗<br>12 knot</div><a class="back" href="/">← aynen.fun</a><div class="tip" id="tip">Dümeni çevir. Rüzgâra göre yelkeni ayarla.</div><div class="controls"><div><div class="wheel" id="wheel"><span id="wheelIcon">✳</span></div><div class="control-label">DÜMEN</div></div><div class="right"><label class="sheet">YELKEN<input id="sheet" aria-label="Yelken açıklığı" type="range" min="0" max="90" value="35"></label><div><button class="tack" id="tack">TRAMOLA ↶</button><div class="control-label">YÖN DEĞİŞTİR</div></div></div></div><script>
const c=document.getElementById('sea'),ctx=c.getContext('2d'),wheel=document.getElementById('wheel'),icon=document.getElementById('wheelIcon'),sheet=document.getElementById('sheet'),tack=document.getElementById('tack');let W,H,D,tm=0,last=0,heading=-.7,windDir=1.05,windTarget=1.05,windSpeed=12,speed=2.1,rudder=0,roll=0,boatX=0,boatY=0,dist=0,tacking=0,foam=[],clouds=[];const pi=Math.PI,wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);boatX=W*.5;boatY=H*.51}addEventListener('resize',resize);resize();for(let i=0;i<100;i++)foam.push({x:Math.random()*2400-1200,y:Math.random()*2400-1200,r:Math.random()*2+.5});let start=null;function pointer(e){if(start===null)return;let r=wheel.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);let a=Math.atan2(y,x);rudder=clamp(wrap(a-start)*1.3,-1,1);icon.style.transform='rotate('+Math.round(rudder*100)+'deg)'}wheel.addEventListener('pointerdown',e=>{wheel.setPointerCapture(e.pointerId);let r=wheel.getBoundingClientRect();start=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);pointer(e)});wheel.addEventListener('pointermove',pointer);function release(){start=null;rudder=0;icon.style.transform='rotate(0deg)'}wheel.addEventListener('pointerup',release);wheel.addEventListener('pointercancel',release);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')rudder=-1;if(e.key==='ArrowRight')rudder=1;if(e.key===' ') {e.preventDefault();doTack()}});addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))rudder=0});function doTack(){if(tacking)return;tacking=1.2;tack.textContent='DÖNÜYOR…';setTimeout(()=>tack.textContent='TRAMOLA ↶',1300)}tack.addEventListener('click',doTack);function line(x1,y1,x2,y2,w,color){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function polygon(points,fill,stroke='#153d48',width=1.5){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke()}}function draw(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;tm+=dt;windTarget+=Math.sin(tm*.19)*dt*.13;if(Math.floor(tm/14)!==Math.floor((tm-dt)/14)){windTarget+=(Math.random()-.5)*1.15;windSpeed=7+Math.random()*12}windDir+=wrap(windTarget-windDir)*dt*.12;let rel=wrap(windDir-heading),abs=Math.abs(rel),sail=+sheet.value*pi/180,optimal=clamp(abs*.72,.18,1.45),trim=clamp(1-Math.abs(sail-optimal)/1.5,.12,1),power=abs<.43?.04:Math.pow(Math.sin(abs*.5),.75)*trim;let target=clamp(windSpeed*power*.72,0,11.5);speed+=(target-speed)*dt*.75;if(tacking>0){heading+=Math.sign(rel||1)*dt*2.45;tacking-=dt;speed*=1-dt*.35}else heading+=rudder*dt*(.36+speed*.055);roll+=(Math.sin(tm*2.1)*.018+Math.sin(rel)*power*.07-roll)*dt*1.8;dist+=speed*dt*6;let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a7dce2');g.addColorStop(1,'#6eb6c3');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let cx=W/2,cy=H*.48;ctx.save();ctx.translate(cx,cy);ctx.rotate(-heading);for(let i=0;i<foam.length;i++){let f=foam[i],x=((f.x-dist*Math.sin(heading)*.65+5000)%2400+2400)%2400-1200,y=((f.y+dist*Math.cos(heading)*.65+5000)%2400+2400)%2400-1200;line(x,y,x+9+f.r*5,y-2,.6+f.r*.3,'#e4f7f580')}ctx.restore();ctx.save();ctx.translate(cx,cy);ctx.rotate(heading+pi/2);ctx.scale(1+roll*.2,1-roll*.12);ctx.fillStyle='#ffffff66';ctx.beginPath();ctx.ellipse(-10,0,75,20,0,0,pi*2);ctx.fill();for(let j=0;j<12;j++){let x=-58-j*10;line(x,-10-j*.8,x-20-j*1.4,-12-j*.9,1.3,'#ffffffaa');line(x,10+j*.8,x-20-j*1.4,12+j*.9,1.3,'#ffffffaa')}polygon([[42,0],[26,-16],[-34,-18],[-60,-9],[-66,0],[-60,9],[-34,18],[26,16]],'#fffdf4','#194451',2);polygon([[32,0],[20,-11],[-38,-12],[-48,0],[-38,12],[20,11]],'#e7d6b7',null);line(-49,0,29,0,2,'#224852');ctx.save();ctx.translate(-6,0);ctx.rotate((rel>=0?1:-1)*sail*.8);polygon([[0,0],[-48,-3],[-32,-54]],'#fffef2','#173f49',1.4);line(0,0,-32,-54,1,'#173f49');ctx.restore();ctx.beginPath();ctx.arc(-6,0,4,0,pi*2);ctx.fillStyle='#254b56';ctx.fill();ctx.restore();let wx=W-51,wy=91;ctx.save();ctx.translate(wx,wy);ctx.rotate(windDir+pi/2);line(-19,0,19,0,2,'#123e4b');polygon([[24,0],[9,-7],[9,7]],'#123e4b');ctx.restore();document.getElementById('speed').textContent=speed.toFixed(1)+' knot';document.getElementById('point').textContent=abs<.43?'Rüzgâra karşı. İlerlemiyorsun.':power>.55?'Rüzgârı yakaladın.':'Yelkeni ayarla.';document.getElementById('wind').innerHTML='RÜZGÂR '+Math.round((windDir*180/pi+360)%360)+'°<br>'+Math.round(windSpeed)+' knot';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
