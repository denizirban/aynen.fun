<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f0"><title>Tarafını Seç — Yerli Üzümler | aynen.fun</title><meta name="description" content="Türkiye'nin yerel üzümleri karşı karşıya. Tarafını seç, kendi şampiyon üzümünü bul."><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#1d241d;background:#f7f6f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button{font:inherit;cursor:pointer}header{height:49px;border-bottom:1px solid #deded4;display:flex;justify-content:space-between;align-items:center;padding:0 22px;background:#f7f6f0}header a{color:inherit;text-decoration:none;font-weight:800;font-size:13px;letter-spacing:-.04em}header small{font-size:10px;color:#777;letter-spacing:.06em}main{max-width:1160px;margin:auto;padding:18px 22px 30px}h1{font-size:clamp(21px,3vw,32px);font-weight:700;letter-spacing:-.06em;margin:0} .sub{font-size:12px;color:#777;margin:4px 0 0}.heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;gap:15px}.counter{font-size:11px;color:#66705f;font-variant-numeric:tabular-nums;white-space:nowrap}.track{height:3px;background:#e4e4dc;width:100%;margin-bottom:17px;border-radius:5px;overflow:hidden}.bar{width:0;height:100%;background:#55664b;transition:width .4s}.arena{display:grid;grid-template-columns:1fr 70px 1fr;gap:12px;align-items:stretch;min-height:min(65vh,570px)}.grape-card{position:relative;isolation:isolate;overflow:hidden;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-radius:19px;border:1px solid #e0e0d5;padding:23px 16px 19px;background:var(--bg);transition:transform .16s,box-shadow .16s,border-color .16s;min-height:380px;text-align:center;color:#202920}.grape-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #29302214;border-color:#a5b49c}.grape-card:active{transform:scale(.985)}.grape-card:focus-visible{outline:3px solid #798a6f;outline-offset:2px}.grape-card.selected{outline:3px solid #3e634a;border-color:#3e634a}.grape-card.loser{opacity:.35;filter:grayscale(.6)}.label{font-size:10px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:#5d675a}.cluster{flex:1;width:100%;display:grid;place-items:center;min-height:210px;filter:drop-shadow(0 22px 15px #19251c26)}.cluster svg{width:min(100%,280px);height:min(38vh,330px);overflow:visible;transition:transform .5s;transform:rotate(var(--turn))}.grape-card:hover .cluster svg{transform:rotate(var(--turn)) scale(1.045)}.name{font-size:clamp(22px,3vw,39px);letter-spacing:-.065em;font-weight:750;line-height:1.03}.region{font-size:12px;color:#677063;margin-top:7px}.note{font-size:11px;opacity:.75;margin-top:10px}.cta{margin-top:17px;font-size:11px;font-weight:700;border:1px solid #849083;border-radius:100px;padding:8px 16px;background:#ffffffaa}.vs{display:grid;place-items:center;font-size:14px;font-weight:800;color:#889086;letter-spacing:-.06em}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px;font-size:11px;color:#737b70}.foot button,.restart,.share{border:1px solid #ccd2c5;padding:9px 14px;border-radius:100px;background:#fff;color:#304030;font-size:11px;font-weight:650}.foot button:hover,.restart:hover,.share:hover{background:#e8edde}.overlay{display:none;position:fixed;inset:0;background:#f7f6f0f7;z-index:5;overflow:auto;padding:35px 18px}.overlay.show{display:flex;align-items:center;justify-content:center}.result{width:min(520px,100%);text-align:center}.result .cluster{height:250px;min-height:210px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#65715e}.result h2{font-size:clamp(30px,6vw,55px);letter-spacing:-.07em;margin:8px 0}.result p{font-size:14px;color:#636e61}.result .actions{display:flex;justify-content:center;gap:10px;margin-top:19px}.result .desc{font-size:12px;line-height:1.5;max-width:360px;margin:10px auto}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#233326;color:#fff;border-radius:30px;padding:10px 16px;font-size:12px;display:none}.toast.show{display:block}@media(max-width:740px){header{padding:0 14px}main{padding:12px 10px}.heading{margin:3px 5px 12px}h1{font-size:21px}.arena{grid-template-columns:minmax(0,1fr) 29px minmax(0,1fr);gap:4px;min-height:calc(100dvh - 178px)}.grape-card{border-radius:13px;min-height:calc(100dvh - 184px);padding:12px 5px 13px}.name{font-size:clamp(17px,5vw,26px)}.cluster{min-height:180px}.cluster svg{width:100%;height:230px}.region{font-size:10px}.note{font-size:10px;min-height:28px}.label{font-size:9px}.cta{font-size:10px;padding:6px 9px;margin-top:10px}.vs{font-size:11px}.foot{font-size:10px;margin:12px 3px}.sub{font-size:11px}}@media(max-width:380px){.cluster svg{height:195px}.region{font-size:9px}.note{font-size:9px}}
.grape-card{background:#fff!important}.cluster{filter:none;min-height:180px}.cluster .real-grape{height:min(38vh,310px);max-width:100%;width:auto;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 8px 8px #00000012);border-radius:10px}.cluster .photo-missing{display:flex;align-items:center;justify-content:center;font-size:11px;color:#777;background:#f3f1ec;border-radius:9px;padding:12px;max-width:185px;min-height:160px;text-align:center}.grape-card .note{font-size:11px;line-height:1.45;color:#626a60}.grape-card .region{font-size:11px}.grape-card .cta{font-size:10px}.grape-card .label{color:#93958e}@media(max-width:740px){.cluster .real-grape{height:clamp(170px,29vh,245px)}.cluster .photo-missing{min-height:140px;max-width:140px}.grape-card .note{font-size:10px}} .funfact{font-size:11px;line-height:1.3;color:#515c51;max-width:240px;margin:9px auto 0;min-height:30px}.grape-card .cluster{min-height:185px}.grape-card .real-grape{max-width:95%;object-fit:contain;background:#fff;border-radius:3px}.grape-card .photo-missing{max-width:185px;font-size:11px}.grape-card .cta{margin-top:10px}@media(max-width:740px){.funfact{font-size:9px;margin-top:6px;min-height:38px;line-height:1.25}.grape-card .cluster{min-height:145px}.grape-card .real-grape{max-height:27vh}} </style></head><body><header><a href="/">aynen.fun</a><small>TÜRKİYE'NİN ÜZÜMLERİ</small></header><main><div class="heading"><div><h1>Tarafını seç.</h1><p class="sub">İki üzüm. Tek taraf. Yanlış cevap yok.</p></div><span class="counter" id="count">01 / 12</span></div><div class="track"><div class="bar" id="bar"></div></div><div class="arena"><button class="grape-card" id="left" aria-label="Soldaki üzümü seç"></button><div class="vs">VS</div><button class="grape-card" id="right" aria-label="Sağdaki üzümü seç"></button></div><div class="foot"><span id="hint">Birine dokun. Kazanan yoluna devam etsin.</span><button id="restartSmall">Baştan başla ↺</button></div></main><div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Şampiyon üzümün"><div class="result"><span class="eyebrow">12 KARŞILAŞMANIN KAZANANI</span><h2 id="winnerName"></h2><div class="cluster" id="winnerVisual"></div><p id="winnerRegion"></p><p class="desc" id="winnerNote"></p><div class="actions"><button class="share" id="share">Paylaş ↗</button><button class="restart" id="again">Tekrar oyna ↺</button></div></div></div><div id="toast" class="toast"></div><script>
const grapes=[["Öküzgözü","Elazığ","Canlı asit · meyvemsi","red","#65334d"],["Boğazkere","Diyarbakır","Güçlü tanen · koyu karakter","red","#422739"],["Kalecik Karası","Ankara / Kalecik","Zarif · kırmızı meyve","red","#9b5166"],["Papazkarası","Trakya","Baharatımsı · diri","red","#704055"],["Karalahna","Bozcaada","Dolgun · koyu meyve","red","#48283c"],["Adakarası","Avşa / Marmara","Meyvemsi · canlı","red","#934b64"],["Çalkarası","Denizli / Çal","Hafif · ferah","red","#b86475"],["Karasakız","Çanakkale","Canlı · zarif","red","#975469"],["Emir","Kapadokya","Mineral çağrışımlı · canlı","white","#bfc87a"],["Narince","Tokat","Dengeli · dokulu","white","#c7b46f"],["Bornova Misketi","İzmir","Çiçeksi · aromatik","white","#a4be74"],["Yapıncak","Trakya","Taze · canlı asit","white","#aebd7c"],["Hasandede","İç Anadolu","Yumuşak · beyaz meyve","white","#d0bd86"],["Vasilaki","Bozcaada","Aromatik · ada karakteri","white","#c2c884"],["Kabarcık","Güneydoğu Anadolu","Yerel · beyaz","white","#cfbf89"],["Barburi","Hatay","Yerli · kırmızı","red","#7d3c4f"]];const $=x=>document.getElementById(x);let pool=[],winner=null,round=0,busy=false;const total=12;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function illustration(g){let white=g[3]==='white',seed=g[4];let berries='';for(let row=0;row<6;row++){let n=6-row;for(let j=0;j<n;j++){const x=110+(j-(n-1)/2)*25+Math.sin(row*.8)*5;const y=88+row*31;berries+='<circle cx="'+x+'" cy="'+y+'" r="'+(13+row*.1)+'" fill="'+seed+'" stroke="'+(white?'#8d9959':'#372334')+'" stroke-width="1.1"/><ellipse cx="'+(x-4)+'" cy="'+(y-5)+'" rx="5" ry="3.4" fill="#fff" opacity=".24"/>'}}return '<svg viewBox="0 0 220 310" aria-hidden="true"><path d="M111 90Q110 47 126 24" fill="none" stroke="#6c7750" stroke-width="6" stroke-linecap="round"/><path d="M117 43Q67 -2 24 40Q59 77 111 57" fill="#6d8f65" stroke="#537449" stroke-width="2"/><path d="M127 42Q174 -1 205 42Q164 70 124 54" fill="#89a976" stroke="#5a814e" stroke-width="2"/>'+berries+'<path d="M110 275L99 295 121 295Z" fill="'+seed+'"/></svg>'}
const realPhotos={"Öküzgözü":"https://koctas-img.mncdn.com/mnpadding/600/600/ffffff/productimages/5002438296/5002438296_1_MC/9400826036274_1748869474827.jpg","Boğazkere":"https://www.e-fidancim.com/shop/hr/14/myassets/products/010/bogazkere-saraplik-uzum-fidani.jpg?revision=1697143329","Kalecik Karası":"https://www.kalecik.bel.tr/upload/icerikdosyalar/X8IKvMCdORb0EGq.jpg","Papazkarası":"https://turkishwineisfantastic.com/wp-content/uploads/2018/08/img_3495.jpg","Emir":"https://images.squarespace-cdn.com/content/v1/623e07ff3f5980785c3eeefb/1651000432307-HX1PL6YCBKTXFM65O8U9/KDERE_AVANOS_YNS_0572.jpg","Adakarası":"https://turkishwineisfantastic.com/wp-content/uploads/2018/10/img_4524.jpg?w=640","Çalkarası":"https://turkishwineisfantastic.com/wp-content/uploads/2018/10/img_4451.jpg?w=640","Bornova Misketi":"https://media.licdn.com/dms/image/v2/D4D22AQHSZHHhHwQVpA/feedshare-shrink_2048_1536/feedshare-shrink_2048_1536/0/1730388187441?e=2147483647&t=f2nXACPsIWkeHVZVjyoN2Fw4-ve2DspaHlkSFQbSAHw&v=beta","Narince":"https://www.reyonbahce.com/idea/hc/74/myassets/products/521/2-yas-asili-tokat-narince-uzum-fidani-saksida-744.jpeg?revision=1777051343","Yapıncak":"https://www.e-fidancim.com/shop/hr/14/myassets/products/896/yapincak-uzum-fidani.jpg?revision=1697143329","Hasandede":"https://www.e-fidancim.com/shop/hr/14/myassets/products/222/hasan-dede-uzum-fidani.jpg?revision=1741327825","Kabarcık":"https://ideacdn.net/idea/ks/07/myassets/products/385/u-kabarcik.jpg?revision=1697143329","Barburi":"https://antioche.com.tr/img/barburi.jpeg","Karasakız":"https://www.amathusdrinks.com/media/wysiwyg/karasakiz.png"};function grapePicture(g){const src=realPhotos[g[0]];return src?'<img class="real-grape" src="'+src+'" alt="'+g[0]+' üzüm salkımı" loading="eager" onerror="this.outerHTML=\'<span class=\\\"photo-missing\\\">Bu çeşidin fotoğrafı yüklenemedi</span>\'">':'<span class="photo-missing">Doğrulanmış üzüm fotoğrafı henüz yok</span>'}const funFacts={"Öküzgözü":"Adını iri, yuvarlak tanelerinden alır: öküz gözü kadar büyük.","Boğazkere":"İsmi bile uyarıyor: belirgin tanenleriyle ağızda güçlü bir his bırakabilir.","Kalecik Karası":"Ankara'nın Kalecik ilçesi, bu zarif kırmızının adını taşıyor.","Papazkarası":"Trakya'nın köklü yerel üzümlerinden; adı 'papazın karası' anlamına gelir.","Karalahna":"Bozcaada'nın dört geleneksel üzümünden biri.","Adakarası":"Avşa ve Marmara Adaları ile özdeşleşen ada üzümü.","Çalkarası":"Denizli'nin Çal yöresinden; roze şaraplarda da kullanılır.","Karasakız":"Bozcaada'da 'Kuntra' adıyla da bilinir.","Emir":"Kapadokya'nın yüksek rakımında yetişir; köpüklü şarap yapımında da kullanılır.","Narince":"Tokat'ta yaprakları sarma için de toplanır. Tek asma, iki ürün!","Bornova Misketi":"Adı İzmir'in Bornova ilçesinden geliyor; misket kokularıyla tanınır.","Yapıncak":"Trakya'nın yerli beyazlarından; uzun yıllar gölgede kaldıktan sonra yeniden ilgi görüyor.","Hasandede":"İç Anadolu'nun yerel beyazı; adını Kırıkkale'nin Hasandede yöresinden alır.","Vasilaki":"Bozcaada'da yetişen geleneksel beyaz çeşitlerden biri.","Kabarcık":"Güneydoğu Anadolu'da yetişen yerel beyaz çeşitlerden.","Barburi":"Hatay'ın yerel kırmızılarından; bölgedeki bağcılık geleneğinin parçası."};function card(el,g,side){el.style.setProperty('--bg',g[3]==='white'?'#f0f0db':'#f0e6e8');el.style.setProperty('--turn',side==='left'?'-7deg':'7deg');el.className='grape-card';el.innerHTML='<span class="label">'+(side==='left'?'SOL':'SAĞ')+' TARAF</span><div class="cluster">'+grapePicture(g)+'</div><div><div class="name">'+g[0]+'</div><div class="region">'+g[1]+'</div><div class="note">'+g[2]+'</div><div class="funfact">'+(funFacts[g[0]]||'Yerel bir bağcılık çeşidi.')+'</div><div class="cta">BU TARAF →</div></div>';el.disabled=false}
function draw(){if(round===total){finish();return}const challenger=pool[round];card($('left'),winner,'left');card($('right'),challenger,'right');$('count').textContent=String(round+1).padStart(2,'0')+' / '+total;$('bar').style.width=(round/total*100)+'%';$('hint').textContent='Kazanan kalır. Diğeri elenir.';busy=false}
function pick(side){if(busy||round>=total)return;busy=true;const left=$('left'),right=$('right');(side==='left'?left:right).classList.add('selected');(side==='left'?right:left).classList.add('loser');if(side==='right')winner=pool[round];round++;setTimeout(draw,380)}
function start(){pool=shuffle([...grapes]);winner=pool.shift();pool=pool.slice(0,total);round=0;busy=false;$('overlay').classList.remove('show');draw()}
function finish(){$('bar').style.width='100%';$('overlay').classList.add('show');$('winnerName').textContent=winner[0];$('winnerRegion').textContent=winner[1];$('winnerNote').textContent=(funFacts[winner[0]]||winner[2])+' Bu bir damak tadı sıralaması değil, senin seçimin.';$('winnerVisual').innerHTML=grapePicture(winner);try{localStorage.setItem('uzum-taraf-last',JSON.stringify({name:winner[0],date:new Date().toISOString()}))}catch{}}
function share(){const t='Benim tarafım: '+winner[0]+'. Seninki hangisi? '+location.href;if(navigator.share){navigator.share({title:'Tarafını Seç — Yerli Üzümler',text:'Benim tarafım: '+winner[0]+'. Seninki hangisi?',url:location.href}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('Bağlantı kopyalandı')).catch(()=>toast('Paylaşım kullanılamıyor'))}else{toast('Paylaşım kullanılamıyor')}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2000)}
$('left').onclick=()=>pick('left');$('right').onclick=()=>pick('right');$('again').onclick=start;$('restartSmall').onclick=start;$('share').onclick=share;document.addEventListener('keydown',e=>{if($('overlay').classList.contains('show'))return;if(e.key==='ArrowLeft'||e.key==='1')pick('left');if(e.key==='ArrowRight'||e.key==='2')pick('right')});start();
</script></body></html>
