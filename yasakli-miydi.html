<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yasaklı mıydı? — aynen.fun</title><style>*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#263128;font-family:Arial,sans-serif}a{color:inherit}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #467455;outline-offset:2px}.shell{width:min(780px,100%);padding:17px 18px 27px;margin:auto}.nav{display:flex;justify-content:space-between;color:#8b998c;font:11px monospace}.nav a{text-decoration:none;color:#263128}.header{margin:37px 0 23px}.header h1{font-size:clamp(35px,6vw,58px);letter-spacing:-.067em;line-height:1.04;margin:0 0 9px}.header p{font-size:12px;color:#819083;margin:0;line-height:1.6}.panel{border:1px solid #e1e8df;border-radius:8px;background:white;overflow:hidden}.meta{font:11px monospace;color:#7b8d80;padding:15px 17px;border-bottom:1px solid #e8ede7;display:flex;justify-content:space-between}.year{font-size:39px;letter-spacing:-.07em;font-weight:700;color:#324c38}.years{display:flex;justify-content:space-between;gap:5px;padding:11px 14px 6px}.years button{background:white;border:1px solid #e2eae0;border-radius:4px;font:11px monospace;padding:7px 8px;color:#7b8e7c}.years button.active{background:#355c42;color:white}.main{padding:18px 19px}.kicker{font:10px monospace;color:#829585}.main h2{font-size:28px;letter-spacing:-.05em;margin:9px 0}.main p{font-size:13px;color:#78867a;line-height:1.6;margin:10px 0 15px}.detail{font:11px/1.6 monospace;color:#758779}.detail a{color:#426e4c}.controls{display:flex;gap:7px;flex-wrap:wrap;padding:11px 17px;border-top:1px solid #e7ece5}.controls button{background:#f4f7f2;border:1px solid #e2e9e0;border-radius:5px;padding:9px 13px;font-size:12px}.controls button.active{background:#365c42;color:white}.art{height:154px;background:#eef2eb;display:grid;place-items:center;overflow:hidden;position:relative}.art svg{height:145px;width:min(100%,430px)}.stat{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:11px monospace}.pill{padding:5px 8px;border:1px solid #dce6dc;border-radius:4px;background:#f3f7f2}.foot{font:10px/1.6 monospace;color:#9ba99d;margin-top:15px}@media(max-width:600px){.shell{padding:13px 11px}.header{margin:27px 0 18px}.meta{padding:12px}.years{gap:3px;padding:10px 8px 5px}.years button{padding:7px 5px;font-size:10px}.main{padding:14px}.art{height:133px}.art svg{height:120px}}.guess{display:flex;gap:8px;margin:17px 0}.guess button{flex:1;border:1px solid #dce6dc;background:white;padding:14px;border-radius:6px;font-weight:700;font-size:12px}.guess button:hover{background:#edf4eb}.reveal{border-top:1px solid #e6ebe4;padding-top:17px}.reveal strong{display:block;font-size:23px;letter-spacing:-.04em}.next{background:#355d42;color:white;border:0;border-radius:5px;padding:12px 16px;margin-top:10px;font:11px monospace}.badge{font:11px monospace;color:#42654b;background:#eaf1e8;border:1px solid #c8dbc9;padding:6px 9px;border-radius:4px}.big{font-size:52px;letter-spacing:-.07em;font-weight:700;margin:20px 0 4px}.score{font:11px monospace;color:#8c9a90}</style></head><body><div class="shell"><nav class="nav"><a href="/">← aynen.fun</a><span>MEVZUAT / TARİH</span></nav><header class="header"><h1>Yasaklı mıydı?</h1><p>Bir şeyin yaygın olması, yasal olduğu anlamına gelir mi?</p></header><main class="panel"><div class="meta"><span>HUKUKİ STATÜ TESTİ</span><span id="progress">01 / 06</span></div><div class="main" id="game"></div></main><div class="foot">Gerçek tarihsel düzenlemelere dayanır. “Serbest” tüm koşulların kalktığı anlamına gelmez. Eğlence amaçlıdır, güncel hukuk danışmanlığı değildir.</div></div><script>(()=>{'use strict';const entries=[{"year":1980,"question":"Evde döviz tutmak","status":"KISITLI","desc":"1984 öncesinde döviz bulundurma ve işlemleri sıkı kambiyo denetimine tabiydi. Her tür döviz bulundurmanın mutlak yasak olduğu anlamına gelmez.","src":"https://www.sbb.gov.tr/wp-content/uploads/2022/08/24-Ocak-1980-ve-5-Nisan-1994-Istikrar-Programlari-Cercevesinde-Yapilan-Hukuki-ve-Kurumsal-Duzenlemelerin-Mukayeseli-Analizi_Salih-Kose.pdf"},{"year":1984,"question":"Bankada döviz hesabı açmak","status":"SERBESTLEŞTİ","desc":"1984 düzenlemeleriyle döviz bulundurma ve bankada döviz hesabı açma serbestleştirildi; koşullar ve bankacılık kuralları geçerliydi.","src":"https://www.sbb.gov.tr/wp-content/uploads/2022/08/24-Ocak-1980-ve-5-Nisan-1994-Istikrar-Programlari-Cercevesinde-Yapilan-Hukuki-ve-Kurumsal-Duzenlemelerin-Mukayeseli-Analizi_Salih-Kose.pdf"},{"year":1990,"question":"Özel televizyon kanalı açmak","status":"HUKUKİ DAYANAK YOK","desc":"Özel yayınlar fiilen başlamıştı fakat anayasal kamu tekeli ancak 1993’te kaldırıldı. “Tamamen yasak” demek bu fiilî durumu gizler.","src":"https://www.rtuk.gov.tr/hakkimizda/1749"},{"year":1993,"question":"Özel radyo ve TV yayıncılığı","status":"ANAYASAL YOL AÇILDI","desc":"Anayasa değişikliğiyle yayıncılıktaki kamu tekeli kaldırıldı; ayrıntılı kanun 1994’te geldi.","src":"https://www.rtuk.gov.tr/hakkimizda/1749"},{"year":1994,"question":"Özel radyo ve TV yayıncılığı","status":"KANUNLA DÜZENLENDİ","desc":"3984 sayılı kanun yürürlüğe girdi ve RTÜK kuruldu. Yayın yapmak lisans ve ilgili kurallara bağlıydı.","src":"https://www.rtuk.gov.tr/hakkimizda/1749"},{"year":1989,"question":"Döviz ve sermaye hareketleri","status":"YENİ REJİM","desc":"11 Ağustos 1989’da 32 sayılı karar yayımlandı. Döviz ve sermaye hareketlerinde yeni bir düzenleyici çerçeve oluştu.","src":"https://www.lexpera.com.tr/mevzuat/bakanlar-kurulu-kararlari/turk-parasi-kiymetini-koruma-hakkinda-karar-89-14391/12"}];let q=0,score=0;const el=document.getElementById('game'),progress=document.getElementById('progress');function render(){if(q>=entries.length){el.innerHTML='<span class="kicker">TARİHİ MEVZUAT SINAVI</span><div class="big">'+score+'/6</div><h2>'+(score>3?'Resmî Gazete’yi takip ediyorsun.':'Mevzuat senden hızlı değişiyor.')+'</h2><p>“Yasal” ve “yaygın” sandığından farklı şeyler.</p><button class="next" id="again">BİR DAHA →</button>';document.getElementById('again').onclick=()=>{q=0;score=0;render()};return}const x=entries[q];progress.textContent=String(q+1).padStart(2,'0')+' / 06';el.innerHTML='<span class="kicker">TÜRKİYE / '+x.year+'</span><h2>'+x.question+'</h2><p>O yıl durum neydi?</p><div class="guess"><button data-a="0">SERBEST</button><button data-a="1">KISITLI / DÜZENLENMİŞ</button></div><div class="score">SKOR '+score+'</div>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(+b.dataset.a))}function answer(a){const x=entries[q],correct=[1,0,1,0,1,1][q];if(a===correct)score++;el.innerHTML='<span class="kicker">DÖNEM / '+x.year+'</span><h2>'+x.question+'</h2><span class="badge">'+x.status+'</span><p>'+x.desc+'</p><div class="detail"><a href="'+x.src+'" target="_blank" rel="noopener">Belgeyi aç ↗</a></div><button class="next" id="next">'+(q===5?'SONUÇ →':'DEVAM →')+'</button>';document.getElementById('next').onclick=()=>{q++;render()}}render()})();</script></body></html>
