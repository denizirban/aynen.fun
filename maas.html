<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Maaşın Kaç Saniyede Biter? — aynen.fun</title>
<meta name="description" content="Maaşın hesabına yattı. Şimdi harca. Zaten kendi kendine de eksiliyor." />
<meta property="og:title" content="Maaşın Kaç Saniyede Biter? — aynen.fun" />
<meta property="og:description" content="Maaşın kaç saniye dayanabiliyor? Türkiye simülasyonu." />
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/maas-shop.css?v=1" />
<script defer src="/maas-shop.js?v=1"></script>
</head>
<body>
<main class="app" aria-label="Maaşın kaç saniyede biter?">
<section class="board" aria-label="Maaş ve süre">
<header class="sitebar">
  <a href="/" class="back" aria-label="aynen.fun ana sayfa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h14"/></svg>
    aynen.fun
  </a>
  <div class="salary-choices" aria-label="Maaş seç">
    <span class="salary-caption">MAAŞIN</span>
    <button type="button" class="preset" data-salary="35000" aria-pressed="false">35K</button>
    <button type="button" class="preset" data-salary="55000" aria-pressed="true">55K</button>
    <button type="button" class="preset" data-salary="85000" aria-pressed="false">85K</button>
    <button type="button" class="preset" data-salary="0" aria-pressed="false" aria-label="Özel maaş seç">✎</button>
  </div>
</header>
<div class="balance-head">
  <p class="balance-label">MAAŞINDAN KALAN</p>
  <div class="balance-number" id="balance" aria-live="off">₺55.000</div>
  <div class="summary"><span class="status-dot" aria-hidden="true"></span><span>Harcanan <strong id="spent">₺0</strong></span></div>
  <div class="drain-meter" role="progressbar" aria-label="Kalan maaş oranı" aria-valuemin="0" aria-valuemax="100"><div id="meter"></div></div>
</div>
<div class="cat-zone">
  <img src="/cat.webp" alt="Aynen'in ifadesiz kedi sticker'ı" width="420" height="390" fetchpriority="high" draggable="false" />
  <div class="cat-caption" id="catCaption" aria-live="polite">Maaş yattı. Kısa süreliğine.</div>
</div>
<div class="board-foot">
  <div class="foot-stat"><span>SÜRE</span><span id="elapsed">00:00.0</span></div>
  <div class="foot-stat"><span>GÜN</span><span id="day">01/30</span></div>
  <button class="reset" type="button" id="reset">YENİDEN ↻</button>
</div>
<section class="end" id="end" hidden aria-live="polite" aria-label="Oyun sonucu">
  <div class="end-inside">
    <div class="end-kicker" id="endKicker">MAAŞIN ÖMRÜ</div>
    <h2 id="endTitle">00:00.0</h2>
    <p id="endMessage">Maaş hesabına uğradı. Kalıcı değildi.</p>
    <div>
      <button type="button" class="end-button" id="again">TEKRAR DENE</button>
      <button type="button" class="end-button secondary" id="share">PAYLAŞ ↗</button>
    </div>
  </div>
</section>
</section>
<aside class="shop" aria-label="Harcama listesi">
  <header class="shop-head">
    <h1>Harca.</h1>
    <div style="display:flex;align-items:center;gap:13px">
      <span class="shop-count" id="shopCount">0 işlem</span>
      <button type="button" class="shop-reset" id="resetTop" aria-label="Oyunu sıfırla" title="Yeniden başlat">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none" aria-hidden="true"><path d="M20 5v6h-6M20 11a8 8 0 1 0 1 5"/></svg>
      </button>
    </div>
  </header>
  <div class="items" id="items" aria-label="Satın alınabilecek harcamalar"></div>
  <footer class="shop-footer">Temsilî fiyatlar. Günlük hayat otomatik tahsil edilir.</footer>
</aside>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
