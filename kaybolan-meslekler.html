ekiyor.","source":"RoboPilots — Careers","url":"https://www.robopilots.ai/careers"},{"n":"Yapay Zekâ Veri Etiketleyicisi","v":1,"kind":"VERİ","era":"GÜNÜMÜZ / AI","desc":"Görüntü, metin ve diğer verileri makine öğrenimi modellerinin anlayabileceği biçimde etiketleyen insanlar çalışıyor. AI'ın 'kendisi öğrendiği' şeylerin arkasında çoğu zaman insan emeği var.","source":"RoboPilots — Data Operations","url":"https://www.robopilots.ai/careers"},{"n":"Robot Hareket Eğiticisi","v":1,"kind":"ROBOT","era":"GÜNÜMÜZ / ROBOTİK","desc":"Bir insana robotu nasıl hareket ettireceğini göstermek için başta insanın kendisi robotu işletiyor ve örnekler kaydediyor. Çalışan robotun meslektaşı oluyor.","source":"RoboPilots — Teleoperation","url":"https://www.robopilots.ai/careers"},{"n":"Sanal Ay Trafik Polisi","v":0,"kind":"AY","era":"GELECEK / KURGU","desc":"Ay yüzeyindeki robot trafiğini yöneten biri gerekebilir. Ancak 'Sanal Ay Trafik Polisi' bu oyun için yazılmış bir meslek adı; bugün belgelenmiş yerleşik unvan değil.","source":null,"url":null},{"n":"Mars Emlak Komisyoncusu","v":0,"kind":"MARS","era":"GELECEK / KURGU","desc":"Mars'ta deniz manzaralı daire satmak şu an gerçek bir meslek değil. Bu unvan burada tamamen kurgusal bir gelecek senaryosu.","source":null,"url":null},{"n":"Robot Rüya Yorumcusu","v":0,"kind":"ROBOT","era":"GELECEK / KURGU","desc":"Robotlar veri işleyebilir; fakat gerçek insan rüyaları gördükleri gösterilmiş değil. 'Robot Rüya Yorumcusu' oyunun kurgusu.","source":null,"url":null},{"n":"Ay Tozu Şikâyet Memuru","v":0,"kind":"AY","era":"GELECEK / KURGU","desc":"Ay tozu araştırılan gerçek bir mühendislik sorunu. Ama tozla ilgili şikâyetleri kayıt altına alan böyle bir memur unvanını biz uydurduk.","source":null,"url":null},{"n":"Zaman Makinesi Sigortacısı","v":0,"kind":"UZAY","era":"GELECEK / KURGU","desc":"Geri dönen müşterilere hasar dosyası açan sigortacı şimdilik yalnızca bir bilimkurgu mesleği. Zaman makinesi kısmı henüz halledilemedi.","source":null,"url":nul  $('points').textContent='SKOR '+String(score).padStart(2,'0')+' / 10';$('bar').style.width=((at+1)*10)+'%';
 const truth=current.v?'GERÇEKTEN YAPILMIŞ':'OYUN İÇİN UYDURULMUŞ';
 $('card').innerHTML='<div class="feedback"><div class="badge '+(right?'yes':'no')+'">'+(right?'✓ DOĞRU TAHMİN':'✕ YANLIŞ TAHMİN')+'</div><div class="facttitle">'+truth+'.</div><div class="kicker" style="margin:0 0 12px;color:#1d2220">'+current.n+'</div><div class="factdesc">'+current.desc+'</div>'+(current.url?'<a class="source" target="_blank" rel="noopener noreferrer" href="'+current.url+'">TARİHÎ KAYIT / KAYNAK ↗</a>':'<div class="source" style="color:#8a908b">OYUN İÇİN KURGULANMIŞ ÜNVAN</div>')+'</div>';
 $('controls').innerHTML='<button id="next" class="next" style="grid-column:1/-1;max-width:none;margin:0">'+(at===9?'SONUCUMU GÖR →':'SONRAKİ MESLEK →')+'</button>';$('next').onclick=()=>{at++;if(at>=10)end();else showQuestion()};
}
function end(){phase='end';$('counter').textContent='İŞ PİYASASI / SONUÇ RAPORU';$('bar').style.width='100%';
 let label=score===10?'İK Departmanı senden korkuyor.':score>=8?'İş piyasası senden bir şey saklayamıyor.':score>=5?'Saçma sandığın şey birilerinin maaşlı işiydi.':'İş ilanlarına biraz uzak kalmışsın.';
 $('card').innerHTML='<div class="kicker">2026 / GERÇEKLİK KONTROLÜ</div><div class="score">'+score+'<small>/10</small></div><div class="statement">'+label+'</div><p class="sharetext">10 meslek gördün. '+score+' tanesinin gerçek mi gelecek senaryosu mu olduğunu doğru bildin. Bazı işler yüzyıl önce de yeterince tuhaftı.</p><div class="stats"><span>GERÇEKLERİ BULDUN: '+realHits+'/5</span><span>KURGULARI BULDUN: '+fictionHits+'/5</span></div><div class="endactions"><button type="button" id="again">YENİDEN OYNA ↻</button><button type="button" id="share">SONUCUMU PAYLAŞ ↗</button></div><a class="archive" href="/meslekler-arsiv.html">1923–2026: KAYBOLAN MESLEKLER ARŞİVİ ↗</a>';
 $('controls').innerHTML='';
 $('again').onclick=start;$('share').onclick=async()=>{const txt='Bu da İş mi? '+score+'/10. '+label+' Sence “İnsan Çalar Saat” gerçek iş miydi?';const url=location.href.split('?')[0];try{if(navigator.share)await navigator.share({title:'Bu da İş mi? — aynen.fun',text:txt,url});else if(navigator.clipboard){await navigator.clipboard.writeText(txt+' '+url);$('share').textContent='KOPYALANDI ✓';}else prompt('Paylaş:',txt+' '+url)}catch(e){}};
}
screenStart();
})();
</script></body></html>
