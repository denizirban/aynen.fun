vanı olmak zorunda değil.","src":"NASA — Space Food and Nutrition","url":"https://www.nasa.gov/pdf/143163main_Space.Food.and.Nutrition.pdf","art":"pot","status":"Tadım paneli görevi","id":29},{"n":"Mercan Üreme Ekoloğu","zone":"BUGÜN","era":"Mercan restorasyonu · Florida","task":"Mercanların üreme sırasında suya bıraktığı gametleri toplayıp laboratuvarda yetiştirmek","decoys":["Mercanların gece parıltısını fotoğraf için artırmak","Mercan iskeletindeki halkaları parlatıp mücevher üretmek"],"fact":"NOAA araştırmacıları geceleri mercanların üreme anını bekleyip suya bırakılan minik gamet paketlerini topluyor; larvalar restorasyon çalışmalarında kullanılıyor.","shift":"Bu, mercan biyologlarının belirli mevsimde yaptığı araştırma görevidir.","src":"NOAA AOML","url":"https://www.aoml.noaa.gov/coral-spawning-begins-on-florida-reef-tract/","art":"ice","status":"Deniz araştırması görevi","id":30},{"id":31,"n":"Karga Kovucu","zone":"GEÇMİŞ","era":"19. yy · Britanya","status":"Tarihî tarla işi","task":"Tarlada yürüyerek ve ses çıkararak kuşları ürkütüp ekini korumak","fact":"Karga kovucu, kimi zaman çocukların da üstlendiği ücretli bir işti. 1891 nüfus sayımında bu unvanı kullanan kişiler bulunuyor.","shift":"Tarımda görsel ve akustik caydırıcılar gelişti, fakat tarlada kuş kovmak tamamen kaybolmadı.","src":"Findmypast — Old Jobs","url":"https://www.findmypast.co.uk/blog/history/quirky-extinct-jobs","decoys":[],"art":"custom"},{"id":32,"n":"Knocker-Up","zone":"GEÇMİŞ","era":"19.–20. yy · Britanya","status":"Tarihî sabah hizmeti","task":"İşçilerin penceresine uzun sırıkla vurarak onları sabah işe kaldırmak","fact":"Ucuz alarm saatlerinden önce bazı sanayi kentlerinde insan uyandırıcılara ödeme yapılıyordu; kimi pencerelere sırıkla dokunuyordu.","shift":"Güvenilir ve ucuz çalar saatler işi büyük ölçüde bitirdi.","src":"Findmypast — Old Jobs","url":"https://www.findmypast.co.uk/blog/history/quirky-extinct-jobs","decoys":[],"art":"custom"},{"id":33,"n":"Human Computer","zone":"GEÇ st.co.uk/blog/history/quirky-extinct-jobs","decoys":[],"art":"custom"},{"id":37,"n":"Town Crier","zone":"GEÇMİŞ","era":"19.–20. yy · Britanya","status":"Tarihî kamusal duyuru","task":"Sokaklarda çan çalıp haberleri ve resmî duyuruları halka seslenerek bildirmek","fact":"Bazı kentlerde kamu duyurularını dolaşarak yapan tellallar vardı. 20. yüzyılda dahi görevini sürdüren örnekler belgelenmiş.","shift":"Kitle iletişimi geliştikçe asıl işlevi kayboldu; gösteri ve törenlerde sürüyor.","src":"Findmypast — Old Jobs","url":"https://www.findmypast.co.uk/blog/history/quirky-extinct-jobs","decoys":[],"art":"custom"},{"id":38,"n":"Powder Monkey","zone":"GEÇMİŞ","era":"18.–19. yy · Denizcilik","status":"Tarihî gemi görevi","task":"Yelkenli gemide barut deposundan topların bulunduğu güverteye barut taşımak","fact":"Çok genç tayfalar bazen top güvertesine barut taşıyan tehlikeli görevlerde çalıştırılıyordu; bunlara 'powder monkey' deniyordu.","shift":"Deniz silah teknolojisi ve çocuk işçiliğine ilişkin kurallar değişti.","src":"Royal Museums Greenwich","url":"https://www.rmg.co.uk/sites/default/files/import/media/pdf/SFTS_Objects24_GunpowderTin.pdf","decoys":[],"art":"custom"},{"id":39,"n":"Fosil Preparatörü","zone":"BUGÜN","era":"Doğa tarihi müzesi · Londra","status":"Müze ve laboratuvar uzmanlığı","task":"Fosili çevresindeki kayaçtan mikroskop ve ince aletlerle tek tek ayırmak","fact":"Müze preparatörleri, fosilin detaylarını ortaya çıkarırken kemikleri ve izleri zedelememeye çalışır. Bazen taşı mikroskop altında tanecik tanecik kaldırırlar.","shift":"Bu iş araştırma ve müze korumasında aktif bir uzmanlıktır.","src":"Natural History Museum — Fossil Preparation","url":"https://www.nhm.ac.uk/discover/fossil-preparation.html","decoys":[],"art":"custom"},{"id":40,"n":"Buz Çekirdeği Arşivcisi","zone":"BUGÜN","era":"İklim araştırmaları · ABD","status":"Bilimsel örnek koruma görevi","task":"Buzullardan çıkarılmış eski atmosfer katmanlarını soğuk arşivde korumak ve kaydetmek","fact":"B const P=[[221,39],[164,101],[289,76],[430,45],[540,28],[738,57],[796,72],[925,66],[802,120],[1010,170],[98,160],[240,165],[296,188],[168,204],[306,250],[29,281],[480,122],[664,222],[712,225],[760,228],[851,229],[890,224],[450,281],[592,287],[674,284],[810,276],[507,316],[928,378],[711,430],[547,445],[502,447],[382,414],[162,423],[146,484],[231,489],[375,509],[407,477],[449,495],[617,550],[1004,499]];
const $=s=>document.querySelector(s),allIDs=D.map(x=>x.id);
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const KEY='aynen-odd-jobs-seen-v2',lastKey='aynen-grass-atlas-intro';
let seen=new Set(),activeId=null,prevFocus=null,filter='all',searchTerm='',lastRandom=null,scenePage=0;
try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))seen=new Set(v.filter(id=>allIDs.includes(id)))}catch(e){}
function remember(){try{localStorage.setItem(KEY,JSON.stringify([...seen]))}catch(e){}}
function parkId(panel,point){return panel*40+point+1}
function position(point,panel){const [x,y]=P[point];return {x:x/1044*100,y:y/583*100}}
function refreshCount(){const x=$('#count');if(x)x.textContent=seen.size+' / '+D.length}
function render(){
 const deck=document.getElementById('meadows'),q=searchTerm.trim().toLocaleLowerCase('tr-TR');
 const panel=scenePage;
 const spots=Array.from({length:40},(_,index)=>{
  const id=parkId(panel,index),j=D[id-1],p=position(index,panel);
  const match=(filter==='all'||j.zone===filter)&&(!q||(j.n+' '+j.fact+' '+j.task+' '+j.era).toLocaleLowerCase('tr-TR').includes(q));
  return '<button type="button" class="spot'+(seen.has(id)?' seen':'')+(!match?' dim':'')+'" data-id="'+id+'" data-name="'+esc(j.n)+'" title="'+esc(j.n)+'" aria-label="'+esc(j.n)+' mesleğini keşfet" style="--x:'+p.x.toFixed(3)+'%;--y:'+p.y.toFixed(3)+'%" '+(!match?'tabindex="-1" aria-hidden="true"':'')+'><span class="dot"></span></button>';
 }).join('');
 deck.innerHTML='<section class="panorama" aria-label="İnsanları keşfet, meslek grubu '+(panel+1)+'"><div class="field"><div class="photo" role="img" aria-label="Çim üzerinde farklı noktalara dağılmış insanların tek fotoğraf kolajı"></div>'+spots+'<div class="chapter-mark"><strong>'+String(panel+1).padStart(2,'0')+' / 02</strong>İNSANLARA DOKUN</div></div></section>';
 deck.querySelectorAll('.spot:not(.dim)').forEach(btn=>btn.addEventListener('click',()=>openDetail(Number(btn.dataset.id))));
 $('#sceneButton').textContent='GRUP '+(panel+1)+' / 2 ↻';
 $('#sceneButton').setAttribute('aria-label','Diğer 40 mesleği aynı fotoğrafta göster. Şu an grup '+(panel+1));
 refreshCount();
}
function resultMatches(){
 const q=searchTerm.trim().toLocaleLowerCase('tr-TR');if(!q){$('#results').classList.remove('show');return}
 const list=D.filter(j=>(filter==='all'||j.zone===filter)&&(j.n+' '+j.fact+' '+j.task+' '+j.era).toLocaleLowerCase('tr-TR').includes(q)).slice(0,12);
 $('#results').innerHTML='<div class="results-head">'+list.length+(list.length===12?'+':'')+' EŞLEŞEN MESLEK</div>'+list.map(j=>'<button type="button" data-id="'+j.id+'">'+esc(j.n)+'<small>'+esc(j.era)+'</small></button>').join('');
 $('#results').classList.add('show');
 $('#results').querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',()=>{openDetail(Number(b.dataset.id));$('#results').classList.remove('show')}));
}
function fieldRow(title,body){return '<div class="fact"><b>'+esc(title)+'</b><p>'+body+'</p></div>'}
function related(j){const same=D.filter(x=>x.id!==j.id&&x.zone===j.zone);return same.slice((j.id*3)%Math.max(1,same.length),((j.id*3)%Math.max(1,same.length))+3)}
function placePopup(){
 if(activeId===null||window.matchMedia('(max-width:700px)').matches)return;
 const spot=document.querySelector('.spot[data-id="'+activeId+'"]'),panel=$('.drawer');
 if(!spot||!panel)return;
 const p=spot.getBoundingClientRect(),w=panel.offsetWidth||392,hh=panel.offsetHeight||420,padding=14;
 const rightSpace=window.innerWidth-p.right,leftSpace=p.left;
 const placeRight=rightSpace>=w+30||rightSpace>=leftSpace;
 const x=placeRight?p.right+17:p.left-w-17;
 const left=Math.max(padding,Math.min(window.innerWidth-w-padding,x));
 const top=Math.max(padding,Math.min(window.innerHeight-hh-padding,p.top+Math.min(25,hh*.18)-hh*.40));
 panel.style.left=left+'px';panel.style.top=top+'px';
 panel.style.setProperty('--arrow-y',Math.max(25,Math.min(hh-30,p.top+p.height/2-top))+'px');
 panel.dataset.side=placeRight?'right':'left';
}
function openDetail(id,cont=false,skipURL=false){
 const j=D.find(v=>v.id===id);if(!j)return;
 const requiredPage=Math.floor((id-1)/40);
 if(scenePage!==requiredPage){scenePage=requiredPage;render();}
 const prior=document.querySelector('.spot.active');
 if(prior)prior.classList.remove('active');
 if(activeId===null)prevFocus=document.activeElement;
 activeId=id;seen.add(id);remember();refreshCount();$('#hint').classList.add('hide');
 const b=document.querySelector('.spot[data-id="'+id+'"]');
 if(b){b.classList.add('seen','active');if(!cont||!b.getBoundingClientRect().width||b.getBoundingClientRect().right<0||b.getBoundingClientRect().left>window.innerWidth)b.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'})}
 if(!skipURL)history.replaceState(null,'',location.pathname+'?meslek='+id);
 $('#detailIndex').textContent='KAYIT '+String(id).padStart(2,'0')+' / '+D.length;
 $('#panelPos').textContent=id+' / '+D.length;
 const sourceLink=j.url?'<a href="'+esc(j.url)+'" target="_blank" rel="noopener noreferrer">'+esc(j.src||'Kaynağı aç')+' ↗</a>':'Kaynak bağlantısı bulunamadı';
 const moreFacts=[
  fieldRow('HİKÂYESİ',esc(j.fact)),
  j.odd?fieldRow('TUHAF AYRINTI',esc(j.odd)):'',
  j.tools?fieldRow('KULLANDIĞI ARAÇLAR',esc(j.tools)):'',
  fieldRow('NE OLDU?',esc(j.shift)),
  fieldRow('DURUMU',esc(j.status))
 ].filter(Boolean).join('');
 const sim=related(j);
 $('#detail').innerHTML='<div class="eyebrow">'+esc(j.zone)+' · İŞ ATLASI</div><h2 id="detailTitle">'+esc(j.n)+'</h2><p class="lead">'+esc(j.task)+'.</p>'+
  '<div class="preview-facts">'+fieldRow('DÖNEM',esc(j.era))+(j.tools?fieldRow('ARAÇLAR',esc(j.tools)):'')+fieldRow('KAYNAK',sourceLink)+'</div>'+
  '<details class="extended"><summary>HİKÂYESİNİ KEŞFET <span aria-hidden="true">＋</span></summary>'+moreFacts+'<div class="more"><h3>BAŞKA KİMLER VAR?</h3>'+sim.map(x=>'<button type="button" data-related="'+x.id+'">'+esc(x.n)+' ↗</button>').join('')+'</div><p class="note">Fotoğraftaki kişiler meslekleri temsil eder; gerçek kişilerin işleri hakkında bir iddia değildir. Bazı kayıtlar bağımsız kadro adı değil, belgelenmiş görevlerdir.</p></details>';
 $('#detail').querySelectorAll('button[data-related]').forEach(b=>b.addEventListener('click',()=>openDetail(Number(b.dataset.related),true)));
 $('#overlay').classList.add('open');$('#overlay').setAttribute('aria-hidden','false');
 if(window.matchMedia('(max-width:700px)').matches)document.body.classList.add('lock');else document.body.classList.remove('lock');
 $('#detail').scrollTop=0;
 requestAnimationFrame(placePopup);
 if(!cont)$('#close').focus();
}
function closeDetail(fromHistory=false){
 if(activeId===null)return;
 if(!fromHistory&&location.search.includes('meslek='))history.replaceState(null,'',location.pathname);
 const b=document.querySelector('.spot.active');if(b)b.classList.remove('active');
 activeId=null;$('#overlay').classList.remove('open');$('#overlay').setAttribute('aria-hidden','true');document.body.classList.remove('lock');$('.drawer').style.left='';$('.drawer').style.top='';
 if(prevFocus&&prevFocus.isConnected)prevFocus.focus();
}
function advance(amount){if(activeId===null)return;openDetail((activeId-1+amount+D.length)%D.length+1,true)}
function randomJob(){let pool=D.filter(j=>!seen.has(j.id));if(!pool.length)pool=D.filter(j=>j.id!==activeId&&j.id!==lastRandom);if(!pool.length)pool=D;const j=pool[Math.floor(Math.random()*pool.length)];lastRandom=j.id;openDetail(j.id,activeId!==null)}
async function share(){if(activeId===null)return;const j=D[activeId-1],url=location.origin+location.pathname+'?meslek='+j.id;try{if(navigator.share){await navigator.share({title:j.n+' — Bu da İş mi?',text:j.fact,url});return}if(navigator.clipboard){await navigator.clipboard.writeText(url);$('#share').textContent='KOPYALANDI ✓';return}}catch(e){}try{const v=document.createElement('textarea');v.value=url;document.body.appendChild(v);v.select();document.execCommand('copy');v.remove();$('#share').textContent='KOPYALANDI ✓'}catch(e){window.prompt('Bağlantı:',url)}}
$('#period').addEventListener('change',e=>{filter=e.target.value;render();resultMatches()});
$('#searchToggle').addEventListener('click',()=>{$('#searchBox').classList.toggle('show');const open=$('#searchBox').classList.contains('show');$('#searchToggle').setAttribute('aria-expanded',String(open));if(open)$('#searchInput').focus();else{$('#searchInput').value='';searchTerm='';render();$('#results').classList.remove('show')}});
$('#searchInput').addEventListener('input',e=>{searchTerm=e.target.value;render();resultMatches()});
$('#random').addEventListener('click',randomJob);$('#randomPanel').addEventListener('click',randomJob);
$('#sceneButton').addEventListener('click',()=>{if(activeId!==null)closeDetail();scenePage=1-scenePage;render();});
$('#prev').addEventListener('click',()=>advance(-1));$('#next').addEventListener('click',()=>advance(1));
$('#share').addEventListener('click',share);$('#close').addEventListener('click',()=>closeDetail());
$('#scrim').addEventListener('click',()=>closeDetail());
 document.addEventListener('pointerdown',e=>{if(activeId!==null&&!window.matchMedia('(max-width:700px)').matches&&!e.target.closest('.drawer,.spot,.hud'))closeDetail()});
 window.addEventListener('resize',placePopup,{passive:true});$('#meadows').addEventListener('scroll',placePopup,{passive:true});
document.addEventListener('keydown',e=>{
 if(activeId===null)return;
 if(e.key==='Escape'){closeDetail();return}
 if(e.key==='ArrowRight'&&!e.metaKey&&!e.altKey&&!e.ctrlKey){e.preventDefault();advance(1)}
 if(e.key==='ArrowLeft'&&!e.metaKey&&!e.altKey&&!e.ctrlKey){e.preventDefault();advance(-1)}
 if(e.key==='Tab'){const f=[...$('#overlay').querySelectorAll('button,a[href]')].filter(x=>!x.disabled);if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}
});
let touchY=null;
$('#handle').addEventListener('touchstart',e=>{if(e.touches.length===1)touchY=e.touches[0].clientY},{passive:true});
$('#handle').addEventListener('touchend',e=>{if(touchY!==null&&e.changedTouches[0].clientY-touchY>70)closeDetail();touchY=null},{passive:true});
window.addEventListener('popstate',()=>{const id=Number(new URLSearchParams(location.search).get('meslek'));if(allIDs.includes(id))openDetail(id,true,true);else closeDetail(true)});
render();
const initial=Number(new URLSearchParams(location.search).get('meslek'));if(allIDs.includes(initial))openDetail(initial,false,true);
})();
</script></body></html>
