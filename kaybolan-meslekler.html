function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function store(key,v){try{localStorage.setItem(VERSION+key,JSON.stringify(v))}catch(e){}}
function load(key,def){try{const v=JSON.parse(localStorage.getItem(VERSION+key));return v===null?def:v}catch(e){return def}}
function getRemaining(){let ids=load('-pool',[]);if(!Array.isArray(ids))ids=[];ids=ids.filter((v,i)=>Number.isInteger(v)&&D.some(d=>d.id===v)&&ids.indexOf(v)===i);return ids}

function art(j,index){return '<div class="art-panel"><div class="registry">KAYIT NO<strong>'+String(j.id).padStart(3,'0')+' / 030</strong></div><svg class="art" viewBox="0 0 215 185" role="img" aria-label="'+esc(j.n)+' için çizim">'+(icons[j.art]||icons.wood)+'</svg><span class="footprint">'+esc(j.zone)+' / '+String(index+1).padStart(2,'0')+'</span></div>'}
function stagehead(text,progress){return '<div class="stage-head"><span>'+text+'</span><span class="right">SKOR <strong>'+String(S.score).padStart(2,'0')+' / '+S.deck.length.toString().padStart(2,'0')+'</strong></span></div><div class="progress"><span style="width:'+progress+'%"></span></div>'}
function bottom(){return '<div class="stage-bottom"><span>30 GERÇEK MESLEK · KAYNAKLI KAYITLAR</span><a href="/meslekler-arsiv.html">MESLEK ARŞİVİ ↗</a></div>'}
function showIntro(){S.phase='intro';$('app').innerHTML=stagehead('İŞ TARİHİ / ETKİLEŞİMLİ ARŞİV',0)+'<div class="stage-body intro">'+art({id:0,n:'Zaman kapsülü',zone:'ARŞİV',art:'alarm'},0)+'<div class="content"><p class="introLabel">TARİH BİRAZ GARİP BİR İŞYERİ.</p><h2 class="introTitle">İnsanlar gerçekten <em>bunun için</em> maaş mı alıyordu?</h2><p class="introDesc">30 gerçek meslek. Bazıları yok oldu, bazıları hâlâ aramızda. İş unvanını gör, ne yaptığını tahmin et, sonra işin aslına bak. Uydurma meslek yok.</p><div class="instructions"><span>01 / MESLEĞİ OKU</span><span>02 / 3 SEÇENEK</span><span>03 / ARŞİVİ AÇ</span></div></div></div><div class="introActions"><small>HER TUR 10 KAYIT · TEKRARSIZ TUR SİSTEMİ</small><button id="go" class="primary">İŞE BAŞLA →</button></div>';
 $('go').onclick=start}
function start(){let pool=getRemaining();if(!pool.length)pool=shuffle(D.map(x=>x.id));const ids=pool.splice(0,ROUND);store('-pool',pool);S.deck=ids.map(id=>D.find(x=>x.id===id));S.i=0;S.score=0;S.answers=[];showQuestion()}
function showQuestion(){S.phase='guess';S.chosen=null;const j=S.deck[S.i];S.opts=shuffle([{txt:j.task,good:true},{txt:j.decoys[0],good:false},{txt:j.decoys[1],good:false}]);const opts=S.opts.map((x,i)=>'<button class="option" type="button" data-idx="'+i+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span class="opttext">'+esc(x.txt)+'</span></button>').join('');
 $('app').innerHTML=stagehead('DOSYA '+String(S.i+1).padStart(2,'0')+' / '+S.deck.length.toString().padStart(2,'0'),Math.round(S.i/S.deck.length*100))+'<div class="stage-body">'+art(j,S.i)+'<div class="content"><div class="tag">'+esc(j.zone)+' · '+esc(j.era)+'</div><h2 class="job">'+esc(j.n)+'</h2><p class="question">Bu kişi iş gününde ne yapıyordu?</p><div class="choices" role="group" aria-label="Üç cevap seçeneği">'+opts+'</div><div class="hint">KLAVYE: 1 · 2 · 3</div></div></div>'+bottom();
 document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(Number(b.dataset.idx)))}
function answer(idx){if(S.phase!=='guess')return;S.phase='reveal';const j=S.deck[S.i];const correct=!!S.opts[idx].good;S.answers.push({id:j.id,good:correct,n:j.n});if(correct)S.score++;showReveal(correct)}
function showReveal(correct){const j=S.deck[S.i];$('app').innerHTML=stagehead('KAYIT ÇÖZÜLDÜ / '+String(S.i+1).padStart(2,'0'),Math.round((S.i+1)/S.deck.length*100))+'<div class="stage-body">'+art(j,S.i)+'<div class="content"><div class="resultlabel '+(correct?'':'wrong')+'">'+(correct?'✓ DOĞRU BULDUN':'✕ BU DEĞİLDİ')+' <span style="color:#9ca29b">/ '+esc(j.era)+'</span></div><h2 class="job" style="font-size:clamp(28px,3.7vw,42px);margin-bottom:11px">'+esc(j.n)+'</h2><p class="resultTask">'+esc(j.task)+'.</p><p class="resultFact">'+esc(j.fact)+'</p><div class="shift"><b>NE OLDU?</b><span>'+esc(j.shift)+'</span><b>DURUM</b><span>'+esc(j.status)+'</span></div><a class="source" href="'+esc(j.url)+'" target="_blank" rel="noopener noreferrer">KAYNAĞI AÇ — '+esc(j.src)+' ↗</a></div></div><div class="stage-bottom reveal-bottom"><span>GERÇEK TARİHÎ KAYIT / '+String(j.id).padStart(3,'0')+'</span><button id="next" class="primary">'+(S.i===S.deck.length-1?'SONUCUMU GÖR':'SONRAKİ MESLEK')+' →</button></div>';
 $('next').onclick=next}
function next(){if(S.phase!=='reveal')return;S.i++;if(S.i>=S.deck.length)showEnd();else showQuestion()}
function showEnd(){S.phase='end';const best=Math.max(S.score,Number(load('-best',0))||0);store('-best',best);const remaining=getRemaining().length;let line=S.score===10?'İş tanımlarını sen yazmış olabilirsin.':S.score>=8?'Geçmişin İK departmanı seni işe alırdı.':S.score>=5?'Bazı meslekler gerçekten açıklama istiyor.':'İş ilanları senden çok şey saklamış.';const wrong=S.answers.filter(x=>!x.good).map(x=>x.n);const summary=wrong.length?'Şaşırtanlar: '+wrong.slice(0,3).join(' · ')+(wrong.length>3?'…':''):'Bu tur seni şaşırtan meslek kalmadı.';const dots=S.answers.map(a=>'<span class="dot '+(a.good?'yes':'no')+'" title="'+esc(a.n)+'"></span>').join('');
 $('app').innerHTML=stagehead('TUR BİTTİ / SONUÇ RAPORU',100)+'<div class="stage-body end">'+art({id:30,n:'Tarihî arşiv',zone:'SONUÇ',art:'math'},S.i)+'<div class="content"><div class="tag">PERSONEL DOSYASI / TUR SONU</div><div class="bigScore">'+S.score+'<small>/'+S.deck.length+'</small></div><h2 class="endTitle">'+esc(line)+'</h2><p class="endDesc">'+esc(summary)+'</p><div class="dots" aria-label="Cevapların sırasıyla doğru ve yanlış durumu">'+dots+'</div><div class="pill">EN İYİ TUR '+best+'/'+ROUND+' · KALAN YENİ KAYIT '+remaining+'</div><div class="actions" style="margin-top:18px"><button id="more" class="primary">'+(remaining?'10 YENİ MESLEK':'ARŞİVİ BAŞTAN AÇ')+' →</button><button id="share" class="secondary">SONUCUMU PAYLAŞ ↗</button></div></div></div>'+bottom();
 $('more').onclick=start;$('share').onclick=share}
async function share(){const txt='Bu da İş mi? — aynen.fun\n30 gerçek mesleğin içinden 10 tanesini denedim: '+S.score+'/10.\n'+(S.score===10?'İş tanımlarını ben yazmış olabilirim.':'Peki bir hallaç tam olarak ne iş yapar?')+'\nhttps://aynen.fun/kaybolan-meslekler.html';try{if(navigator.share){await navigator.share({title:'Bu da İş mi?',text:txt});return}if(navigator.clipboard){await navigator.clipboard.writeText(txt);$('share').textContent='KOPYALANDI ✓';return}}catch(e){}try{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();$('share').textContent='KOPYALANDI ✓'}catch(e){window.prompt('Paylaş:',txt)}}
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat||e.target.closest('button,a,input,textarea'))return;if(S.phase==='guess'&&/^[123]$/.test(e.key))answer(Number(e.key)-1);else if(S.phase==='reveal'&&e.key==='Enter')next()});
showIntro();
})();</script></body></html>
