const D=[{"n":"Pure Finder","zone":"GEÇMİŞ","era":"19. yy · Londra","task":"Sokaktaki köpek dışkısını toplayıp deri tabakhanelerine satmak","decoys":["Sokaktaki hayvan kemiklerini sabun ve tutkal imalathanelerine satmak","Kanalizasyondan ince kumu ayırıp cam atölyelerine satmak"],"fact":"Viktorya Londra'sında 'pure' denen köpek dışkısı deri işlemecileri için değerliydi. Toplayıcılar bunu kova kova tabakhanelere satıyordu.","shift":"Modern deri işleme süreçleriyle bu geçim yolu ortadan kalktı.","src":"Smithsonian / Henry Mayhew","url":"https://www.smithsonianmag.com/history/quite-likely-the-worst-job-ever-319843/","art":"basket","status":"Tarihî geçim işi","id":1},{"n":"Tosher","zone":"GEÇMİŞ","era":"19. yy · Londra","task":"Kanalizasyon tünellerine girip para, metal ve satılabilir eşya aramak","decoys":["Kömür depolarında yanmamış parçaları kırıntılardan ayırmak","Liman çamurundaki kabukları düğme yapımcılarına satmak"],"fact":"Tosher'lar lağım tünellerinde, zehirli gazlara ve çökme tehlikesine rağmen değerli eşya arardı. Henry Mayhew bu işi belgeledi.","shift":"Modern kanalizasyon altyapısı ve denetimiyle bu tür izinsiz geçim biçimi ortadan kalktı.","src":"Smithsonian / Henry Mayhew","url":"https://www.smithsonianmag.com/history/quite-likely-the-worst-job-ever-319843/","art":"rope","status":"Tarihî geçim işi","id":2},{"n":"Mudlark","zone":"GEÇMİŞ","era":"19. yy · Thames kıyısı","task":"Sular çekildiğinde nehir çamurundan satılabilecek şeyler bulmak","decoys":["Tuzlu suyu buharlaştırarak boya üretimine ham madde sağlamak","Nehirden kamış kesip barut paketlerini sarmak"],"fact":"Çoğu çocuk olan mudlark'lar Thames'in kirli kıyısında gelgitin çekilmesini bekleyip metal, kömür ve başka parçalar toplardı.","shift":"Geçim biçimi kayboldu; bugün mudlarking izin ve kuralları bulunan bir hobi olarak da yapılıyor.","src":"London Museum","url":"https://www.londonmuseum.org.uk/collections/london-stories/henry-mayhew-brings-victorian-london-life/","art":"ice","status":"Tarihî geçim işi","id":3},{"n":"Bone Grubber","zone":"GEÇMİŞ","era":"19. yy · Londra","task":"Çöpte kemik, bez ve hurda toplayıp geri dönüşüm tüccarlarına satmak","decoys":["Mezarlarda kemikleri ölçerek tıp fakültelerine rapor hazırlamak","Mezbaha kemiklerinden gösteri amaçlı iskelet kurmak"],"fact":"London Museum'da Henry Mayhew'un işçileri anlattığı yayından bir bone-grubber gravürü bile var. İsim meslek değil korku filmi gibi.","shift":"Atık toplama ve geri dönüşümün kurumsallaşması işi değiştirdi.","src":"London Museum — The Bone-Grubber","url":"https://www.londonmuseum.org.uk/collections/v/object-717505/the-bone-grubber/","art":"wool","status":"Tarihî geçim işi","id":4},{"n":"İzmaritçi (Cigar-End Finder)","zone":"GEÇMİŞ","era":"19. yy · Londra","task":"Yere atılmış puro izmaritlerini toplayıp satmak","decoys":["Tütün depolarında böceklenmiş yaprakları elle ayıklamak","Atılmış teneke tütün kutularını eritmek üzere toplamak"],"fact":"Mayhew, Londra sokaklarında geçimini izmarit arayarak sağlayanları 'cigar-end finders' diye ayrı bir kategori olarak kaydetmişti.","shift":"Toplama işinin biçimi değişti; böyle adlandırılan geçim faaliyeti tarihî kayıtlarda kaldı.","src":"London Museum — Mayhew","url":"https://www.londonmuseum.org.uk/collections/london-stories/henry-mayhew-brings-victorian-london-life/","art":"lamp","status":"Tarihî geçim işi","id":5},{"n":"Gong Farmer","zone":"GEÇMİŞ","era":"Tudor dönemi · İngiltere","task":"Gece tuvalet çukurlarındaki insan atığını boşaltmak","decoys":["Kilisenin çanlarını gün doğmadan yağlamak","Yük arabalarındaki hayvan gübresini gübrehanede kurutmak"],"fact":"Gong farmer'ın 'gong'u müzikle ilgili değil: insan dışkısı için kullanılan eski bir kelime. Historic England gece çalışan bu kişileri belgeliyor.","shift":"Kanalizasyon ve modern sanitasyon sistemleri bu işi dönüştürdü.","src":"Historic England","url":"https://historicengland.org.uk/images-books/photos/item/IC313/008","art":"pot","status":"Tarihî hizmet","id":6},{"n":"Leech Finder", function art(j,index){return '<div class="art-panel"><div class="registry">KAYIT NO<strong>'+String(j.id).padStart(3,'0')+' / 030</strong></div><svg class="art" viewBox="0 0 215 185" role="img" aria-label="'+esc(j.n)+' için çizim">'+(icons[j.art]||icons.wood)+'</svg><span class="footprint">'+esc(j.zone)+' / '+String(index+1).padStart(2,'0')+'</span></div>'}
function stagehead(text,progress){return '<div class="stage-head"><span>'+text+'</span><span class="right">SKOR <strong>'+String(S.score).padStart(2,'0')+' / '+S.deck.length.toString().padStart(2,'0')+'</strong></span></div><div class="progress"><span style="width:'+progress+'%"></span></div>'}
function bottom(){return '<div class="stage-bottom"><span>30 BELGELİ İŞ · TARİHÎ & GÜNCEL</span></div>'}
function showIntro(){S.phase='intro';$('app').innerHTML=stagehead('İŞ TARİHİ / ETKİLEŞİMLİ ARŞİV',0)+'<div class="stage-body intro">'+art({id:0,n:'Zaman kapsülü',zone:'ARŞİV',art:'alarm'},0)+'<div class="content"><p class="introLabel">İŞ PİYASASI HİÇ NORMAL OLMAMIŞ.</p><h2 class="introTitle">Birileri gerçekten <em>bunun için</em> para mı aldı?</h2><p class="introDesc">Kanalizasyonda hazine arayanlar, uzay için malzeme koklayanlar ve bir zenginin bahçesinde münzevi olmak için para alanlar. Bunların hepsi belgeli. Bazıları resmî unvan, bazıları gerçek bir işin çok özel görevi. İşini tahmin et.</p><div class="instructions"><span>01 / MESLEĞİ OKU</span><span>02 / 3 SEÇENEK</span><span>03 / ARŞİVİ AÇ</span></div></div></div><div class="introActions"><small>HER TUR 5 ESKİ + 5 GÜNCEL · TEKRARSIZ</small><button id="go" class="primary">İŞE BAŞLA →</button></div>';
 $('go').onclick=start}
function start(){let pool=getRemaining();if(!pool.length){const historic=shuffle(D.filter(x=>x.zone==='GEÇMİŞ'));const modern=shuffle(D.filter(x=>x.zone==='BUGÜN'));pool=[];for(let k=0;k<3;k++){pool.push(...shuffle([...historic.slice(k*5,k*5+5),...modern.slice(k*5,k*5+5)]).map(x=>x.id))}}const ids=pool.splice(0,ROUND);store('-pool',pool);S.deck=ids.map(id=>D.find(x=>x.id===id));S.i=0;S.score=0;S.answers=[];showQuestion()}
function showQuestion(){S.phase='guess';S.chosen=null;const j=S.deck[S.i];S.opts=shuffle([{txt:j.task,good:true},{txt:j.decoys[0],good:false},{txt:j.decoys[1],good:false}]);const opts=S.opts.map((x,i)=>'<button class="option" type="button" data-idx="'+i+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span class="opttext">'+esc(x.txt)+'</span></button>').join('');
 $('app').innerHTML=stagehead('DOSYA '+String(S.i+1).padStart(2,'0')+' / '+S.deck.length.toString().padStart(2,'0'),Math.round(S.i/S.deck.length*100))+'<div class="stage-body">'+art(j,S.i)+'<div class="content"><div class="tag">'+esc(j.zone)+' · '+esc(j.era)+'</div><h2 class="job">'+esc(j.n)+'</h2><p class="question">Bu kişinin gerçekten yaptığı iş hangisi?</p><div class="choices" role="group" aria-label="Üç cevap seçeneği">'+opts+'</div><div class="hint">KLAVYE: 1 · 2 · 3</div></div></div>'+bottom();
 document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(Number(b.dataset.idx)))}
function answer(idx){if(S.phase!=='guess')return;S.phase='reveal';const j=S.deck[S.i];const correct=!!S.opts[idx].good;S.answers.push({id:j.id,good:correct,n:j.n});if(correct)S.score++;showReveal(correct)}
function showReveal(correct){const j=S.deck[S.i];$('app').innerHTML=stagehead('KAYIT ÇÖZÜLDÜ / '+String(S.i+1).padStart(2,'0'),Math.round((S.i+1)/S.deck.length*100))+'<div class="stage-body">'+art(j,S.i)+'<div class="content"><div class="resultlabel '+(correct?'':'wrong')+'">'+(correct?'✓ DOĞRU BULDUN':'✕ BU DEĞİLDİ')+' <span style="color:#9ca29b">/ '+esc(j.era)+'</span></div><h2 class="job" style="font-size:clamp(28px,3.7vw,42px);margin-bottom:11px">'+esc(j.n)+'</h2><p class="resultTask">'+esc(j.task)+'.</p><p class="resultFact">'+esc(j.fact)+'</p><div class="shift"><b>NE OLDU?</b><span>'+esc(j.shift)+'</span><b>DURUM</b><span>'+esc(j.status)+'</span></div><a class="source" href="'+esc(j.url)+'" target="_blank" rel="noopener noreferrer">KAYNAĞI AÇ — '+esc(j.src)+' ↗</a></div></div><div class="stage-bottom reveal-bottom"><span>GERÇEK TARİHÎ KAYIT / '+String(j.id).padStart(3,'0')+'</span><button id="next" class="primary">'+(S.i===S.deck.length-1?'SONUCUMU GÖR':'SONRAKİ MESLEK')+' →</button></div>';
 $('next').onclick=next}
function next(){if(S.phase!=='reveal')return;S.i++;if(S.i>=S.deck.length)showEnd();else showQuestion()}
function showEnd(){S.phase='end';const best=Math.max(S.score,Number(load('-best',0))||0);store('-best',best);const remaining=getRemaining().length;let line=S.score===10?'İş tanımlarını sen yazmış olabilirsin.':S.score>=8?'Geçmişin İK departmanı seni işe alırdı.':S.score>=5?'Bazı meslekler gerçekten açıklama istiyor.':'İş ilanları senden çok şey saklamış.';const wrong=S.answers.filter(x=>!x.good).map(x=>x.n);const summary=wrong.length?'Şaşırtanlar: '+wrong.slice(0,3).join(' · ')+(wrong.length>3?'…':''):'Bu tur seni şaşırtan meslek kalmadı.';const dots=S.answers.map(a=>'<span class="dot '+(a.good?'yes':'no')+'" title="'+esc(a.n)+'"></span>').join('');
 $('app').innerHTML=stagehead('TUR BİTTİ / SONUÇ RAPORU',100)+'<div class="stage-body end">'+art({id:30,n:'Tarihî arşiv',zone:'SONUÇ',art:'math'},S.i)+'<div class="content"><div class="tag">PERSONEL DOSYASI / TUR SONU</div><div class="bigScore">'+S.score+'<small>/'+S.deck.length+'</small></div><h2 class="endTitle">'+esc(line)+'</h2><p class="endDesc">'+esc(summary)+'</p><div class="dots" aria-label="Cevapların sırasıyla doğru ve yanlış durumu">'+dots+'</div><div class="pill">EN İYİ TUR '+best+'/'+ROUND+' · KALAN YENİ KAYIT '+remaining+'</div><div class="actions" style="margin-top:18px"><button id="more" class="primary">'+(remaining?'10 YENİ MESLEK':'ARŞİVİ BAŞTAN AÇ')+' →</button><button id="share" class="secondary">SONUCUMU PAYLAŞ ↗</button></div></div></div>'+bottom();
 $('more').onclick=start;$('share').onclick=share}
async function share(){const txt='Bu da İş mi? — aynen.fun\n30 gerçek mesleğin içinden 10 tanesini denedim: '+S.score+'/10.\n'+(S.score===10?'İş tanımlarını ben yazmış olabilirim.':'Peki bir hallaç tam olarak ne iş yapar?')+'\nhttps://aynen.fun/kaybolan-meslekler.html';try{if(navigator.share){await navigator.share({title:'Bu da İş mi?',text:txt});return}if(navigator.clipboard){await navigator.clipboard.writeText(txt);$('share').textContent='KOPYALANDI ✓';return}}catch(e){}try{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();$('share').textContent='KOPYALANDI ✓'}catch(e){window.prompt('Paylaş:',txt)}}
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat||e.target.closest('button,a,input,textarea'))return;if(S.phase==='guess'&&/^[123]$/.test(e.key))answer(Number(e.key)-1);else if(S.phase==='reveal'&&e.key==='Enter')next()});
showIntro();
})();</script></body></html>
