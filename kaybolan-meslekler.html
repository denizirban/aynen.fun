<title>Bu da İş mi? — aynen.fun</title>
<style>
:root{--ink:#17191b;--bg:#f6f6f2;--line:#d8d9d4;--muted:#797e7e;--accent:#3156d2;--green:#137357;--red:#c34636}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}a{color:inherit}
.shell{max-width:970px;margin:0 auto;min-height:100dvh;padding:18px clamp(16px,3vw,38px) 22px;display:flex;flex-direction:column}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:0 0 14px;font:11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}
.nav a{text-decoration:none}.nav a:hover{text-decoration:underline}.nav span{color:var(--muted)}
.header{display:flex;justify-content:space-between;gap:20px;align-items:end;padding:22px 0 18px}
h1{font-size:clamp(38px,6.9vw,78px);letter-spacing:-.085em;line-height:.95;margin:0;font-weight:900}
.header p{font-size:12px;color:#666d6a;max-width:205px;margin:0;line-height:1.55}
.stage{border:1px solid var(--ink);position:relative;min-height:min(565px,calc(100dvh - 204px));background:#fff;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.track{border-bottom:1px solid var(--line);padding:15px 20px;display:flex;justify-content:space-between;gap:10px;font:11px ui-monospace,monospace}
.track strong{font-weight:700}.track .right{color:var(--muted)}
.bar{height:4px;background:#e5e7e4}.bar span{height:100%;width:0;background:var(--accent);display:block;transition:width .35s ease}
.card{display:flex;align-items:center;justify-content:center;flex-direction:column;padding:22px 18px 20px;text-align:center;position:relative}
.kicker{font:11px ui-monospace,monospace;letter-spacing:.04em;color:var(--accent);margin-bottom:17px}
.visual{height:112px;width:160px;display:grid;place-items:center;margin:0 auto 12px}
.visual svg{height:100%;width:100%;overflow:visible}
.job{font-size:clamp(30px,5.4vw,62px);letter-spacing:-.072em;line-height:1.03;margin:5px auto 17px;max-width:700px;text-wrap:balance;font-weight:900}
.question{margin:0;font-size:12px;color:#727673}.intro-big{font-size:clamp(27px,5.5vw,54px);letter-spacing:-.065em;line-height:1.1;font-weight:800;max-width:640px;margin:8px auto 17px}
.intro-big em{font-style:normal;color:var(--accent)}
.subtitle{font-size:13px;color:#757c77;line-height:1.55;max-width:420px;margin:0 auto 20px}

.choice{background:var(--ink);color:#fff;min-height:72px;text-align:left;padding:13px 17px;border:1px solid var(--ink);font-size:20px;font-weight:800;letter-spacing:-.045em;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:transform .12s,background .12s}
.choice:hover{background:#3344b9;transform:translateY(-2px)}.choice small{font:9px ui-monospace,monospace;opacity:.6;white-space:nowrap}
.choice.alt{background:#fff;color:var(--ink)}.choice.alt:hover{background:#ececff}
.choice:disabled{opacity:.5;cursor:default;transform:none}
.feedback{width:100%;max-width:690px;text-align:left;animation:rise .25s ease both}
.badge{font:11px ui-monospace,monospace;letter-spacing:.07em;margin-bottom:10px}
.badge.yes{color:var(--green)}.badge.no{color:var(--red)}
.facttitle{font-weight:900;font-size:clamp(25px,4.4vw,47px);line-height:1.03;letter-spacing:-.07em;margin:0 0 9px}
.factdesc{font-size:clamp(12px,1.6vw,15px);line-height:1.6;color:#4e5551;max-width:590px}
.source{display:inline-block;font:10px ui-monospace,monospace;color:var(--accent);margin:10px 0 0;text-underline-offset:4px}
.next{background:var(--accent);color:white;border:0;padding:16px 22px;min-height:52px;font-size:13px;font-weight:800;width:100%;max-width:690px;margin-top:19px}
.next:hover{background:#243d9d}
.foot{padding:14px 18px;font:10px/1.55 ui-monospace,monospace;color:#878e87;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.foot a{white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.score{font-size:clamp(75px,16vw,150px);letter-spacing:-.105em;line-height:1;font-weight:900;margin:0}.score small{font-size:.37em;color:#9a9f9c}
.statement{font-size:clamp(22px,4.1vw,43px);line-height:1.1;letter-spacing:-.06em;font-weight:850;max-width:680px;margin:13px auto}
.sharetext{font:12px/1.65 ui-monospace,monospace;color:#656d66;max-width:490px;margin:0 auto 12px}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:8px auto 18px}
.stats span{border:1px solid var(--line);font:10px ui-monospace,monospace;padding:8px 10px}
.endactions{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:min(520px,100%);margin:4px auto}
.endactions button{padding:16px 10px;border:1px solid var(--ink);font-weight:800;font-size:12px;background:#fff;color:var(--ink)}
.endactions button:first-child{background:var(--ink);color:#fff}
.archive{margin-top:14px;font:11px ui-monospace,monospace;color:#878d87;text-decoration:underline;text-underline-offset:3px}
.panelhidden{display:none!important}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:600px){
 .shell{padding:13px 11px 15px}.header{padding:22px 2px 15px;align-items:start;display:block}.header h1{font-size:49px}.header p{margin-top:10px;font-size:11px;max-width:none}
 .stage{min-height:calc(100dvh - 199px)}.track{padding:13px}.card{padding:16px 12px}.visual{height:88px;width:135px;margin-bottom:8px}.kicker{margin-bottom:12px}
 .job{font-size:clamp(29px,9vw,45px)}.controls{padding:0 12px 15px;gap:7px}.choice{font-size:15px;padding:12px 11px;min-height:67px}.choice small{font-size:8px}
 .foot{padding:11px 12px;font-size:9px}.facttitle{font-size:30px}.factdesc{font-size:12px}
 .endactions{gap:7px}.endactions button{padding:14px 5px}.score{font-size:99px}
}
@media(max-height:650px){.visual{height:62px;width:106px;margin-bottom:2px}.kicker{margin-bottom:5px}.job{margin:0 0 9px}.stage{min-height:480px}.card{padding:10px 12px}.header{padding-top:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>

<header class="header"><h1>Bu da İş mi?</h1><p>Gerçek iş ilanı mı, henüz kurulmamış bir geleceğin mesleği mi?</p></header>

<script>
(function(){
'use strict';
const D=[
{n:'Robot Teleoperatörü',v:1,kind:'ROBOT',desc:'Gerçek iş ilanlarında insanlar, humanoid robotların hareketlerini VR kontrol cihazlarıyla yönlendirip robot eğitimi için gösterim verisi topluyor.',source:'Revel Robotics — Junior Robot Teleoperator',url:'https://jobs.ashbyhq.com/revelrobotics/a7790ec1-b1af-4a43-b7c8-78b147d0e902'},
{n:'Ay Trafik Polisi',v:0,kind:'AY',desc:'Ay yüzeyinde trafik yönetimi bir gün gerekli olabilir. Ancak burada kullanılan “Ay Trafik Polisi” bugün doğrulanmış, yerleşik bir meslek unvanı değil; oyunun kurgusu.',source:null,url:null},
{n:'AI Red Team Araştırmacısı',v:1,kind:'AI',desc:'Gerçek: AI modellerinin güvenlik açıklarını ve başarısızlıklarını bulmak için saldırgan testler yapan uzmanlar işe alınıyor.',source:'Microsoft Research — Security Researcher, AI Red Team',url:'https://www.microsoft.com/en-us/research/careers/open-positions/'},
{n:'Mars Emlak Danışmanı',v:0,kind:'MARS',desc:'Mars’ta arazi satışı bilimkurguya yakışıyor ama burada anlatıldığı biçimde doğrulanmış bir Mars emlak piyasası ve mesleği yok.',source:null,url:null},
{n:'Uzay Çarpışma Önleme Mühendisi',v:1,kind:'YÖRÜNGE',desc:'Gerçek: Yörüngedeki uyduların birbirine veya uzay enkazına tehlikeli biçimde yaklaşmasını tahmin eden, kaçınma algoritmaları geliştiren mühendisler çalışıyor.',source:'OKAPI:Orbits — Space Situational Awareness Engineer',url:'https://okapiorbits.jobs.personio.com/job/2670444'},
{n:'Robot Rüya Yorumcusu',v:0,kind:'ROBOT',desc:'Robotların “rüyalarını” profesyonelce yorumlamak için yerleşmiş bir meslek yok. Makine öğreniminde üretilen simülasyonlar rüya değildir.',source:null,url:null},
{n:'Humanoid Robot Veri Toplayıcısı',v:1,kind:'ROBOT',desc:'Gerçek: Robotları çalıştırıp gündelik el becerilerine ait kayıtlar üreten görevliler var. İlanlarda veri toplama ve robot işlemleri birlikte geçiyor.',source:'Cortex AI — Robot Operator',url:'https://cortexrobot.ai/careers/robot-operator'},
{n:'Ay Habitatı Koku Tasarımcısı',v:0,kind:'AY',desc:'Kapalı uzay yaşam alanlarında hava kalitesi önemlidir. Fakat “Ay Habitatı Koku Tasarımcısı” bu oyun için uydurulmuş gelecek unvanıdır.',source:null,url:null},
{n:'Otonom Araç Uzaktan Operatörü',v:1,kind:'ARAÇ',desc:'Gerçek: Otonom araçların zorlu durumlarında uzaktan destek veren operatörler için iş ilanları bulunuyor.',source:'RoboPilots — Autonomous Vehicle Remote Operator',url:'https://www.robopilots.ai/careers'},
{n:'Yörünge Reklam Denetçisi',v:0,kind:'UZAY',desc:'Uydu çevresinde reklamcılık tartışılabilir. Fakat yörüngedeki reklamları denetleyen ayrı bir resmî meslek unvanı burada kurgusal olarak kullanılıyor.',source:null,url:null},
{n:'Yapay Zekâ Veri Etiketleyicisi',v:1,kind:'VERİ',desc:'Gerçek: Modelleri eğitmek ve değerlendirmek için görüntü, ses veya metinleri etiketleyen insanlar çalışıyor. Teknolojinin görünmeyen insan emeği.',source:'Revel Robotics — data review and labeling tasks',url:'https://jobs.ashbyhq.com/revelrobotics/a7790ec1-b1af-4a43-b7c8-78b147d0e902'},
{n:'Mars Saat Dilimi Danışmanı',v:0,kind:'MARS',desc:'Mars zamanını takip etmek gerçek görevlerde bir ihtiyaç olabilir. “Mars Saat Dilimi Danışmanı” ise burada hayal edilen bağımsız bir meslektir.',source:null,url:null}
];
const $=id=>document.getElementById(id);let deck=[],at=0,score=0,answered=0,realHits=0,fictionHits=0,phase='start',current=null;
const drawings={
'ROBOT':'<rect x="54" y="27" width="52" height="48" rx="11" fill="#dce2dc" stroke="#121717" stroke-width="4"/><rect x="66" y="44" width="10" height="8" fill="#3156d2"/><rect x="86" y="44" width="10" height="8" fill="#3156d2"/><path d="M69 65h21M80 17v10M48 81l-16 13m80-13 16 13" stroke="#121717" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="14" r="5" fill="#3156d2"/><rect x="60" y="78" width="40" height="16" rx="5" fill="#dce2dc" stroke="#121717" stroke-width="4"/>',
'AY':'<circle cx="80" cy="56" r="44" fill="#e4e5df" stroke="#17191b" stroke-width="3"/><circle cx="65" cy="44" r="10" fill="#bac2b8"/><circle cx="98" cy="68" r="15" fill="#c0c7be"/><circle cx="72" cy="78" r="7" fill="#b8beb5"/><path d="M18 93l17-12m90-51 16-8" stroke="#3156d2" stroke-width="3"/>',
'MARS':'<circle cx="80" cy="56" r="42" fill="#e6a17e" stroke="#1a1b1d" stroke-width="3"/><path d="M47 48q22 13 58 6M53 72q27-8 52 6M70 20q22 2 34 14" fill="none" stroke="#ab5545" stroke-width="9" opacity=".6"/>',
'AI':'<rect x="35" y="13" width="90" height="88" rx="14" fill="#e2e5f2" stroke="#17191b" stroke-width="4"/><path d="M62 48l-11 10 11 10M98 48l11 10-11 10M74 78l13-42" fill="none" stroke="#3156d2" stroke-width="5" stroke-linecap="round"/><circle cx="117" cy="18" r="9" fill="#d8483a"/>',
'YÖRÜNGE':'<circle cx="79" cy="53" r="25" fill="#b9d6e4" stroke="#17191b" stroke-width="3"/><ellipse cx="79" cy="53" rx="66" ry="19" fill="none" stroke="#3156d2" stroke-width="3" transform="rotate(-27 79 53)"/><rect x="115" y="13" width="20" height="14" fill="#121717"/><path d="M107 20h8m20 0h12" stroke="#17191b" stroke-width="5"/>',
'ARAÇ':'<path d="M27 69l13-31h78l16 31v23H27z" fill="#dce8f0" stroke="#17191b" stroke-width="4"/><rect x="48" y="45" width="57" height="21" fill="#c3ccdc"/><circle cx="48" cy="92" r="9" fill="#17191b"/><circle cx="113" cy="92" r="9" fill="#17191b"/><path d="M63 25q17-12 34 0M72 16q8-6 16 0" fill="none" stroke="#3156d2" stroke-width="3"/>',
'VERİ':'<rect x="37" y="16" width="86" height="83" rx="6" fill="#e2e2f1" stroke="#17191b" stroke-width="4"/><path d="M54 34h54M54 51h30M54 68h53M54 84h38" stroke="#3156d2" stroke-width="5"/><circle cx="100" cy="51" r="5" fill="#ec5b49"/>',
'UZAY':'<path d="M49 91l30-76 30 76-30-19z" fill="#e0e5ea" stroke="#17191b" stroke-width="4"/><circle cx="79" cy="49" r="11" fill="#3156d2"/><path d="M35 89L20 110M122 89l15 21" stroke="#17191b" stroke-width="3"/>'};
function icon(kind){return '<svg viewBox="0 0 160 115" role="img" aria-label="Meslek temalı çizim">'+(drawings[kind]||drawings.AI)+'</svg>'}
function shuffle(xs){return xs.map((v)=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.v)}
function buttons(left,right,fn1,fn2){$('controls').innerHTML='<button type="button" class="choice" id="left">'+left+'</button><button type="button" class="choice alt" id="right">'+right+'</button>';$('left').onclick=fn1;$('right').onclick=fn2}
function screenStart(){phase='start';$('counter').textContent='10 SORULUK GERÇEKLİK TESTİ';$('points').textContent='SKOR 00 / 10';$('bar').style.width='0%';
 $('card').innerHTML='<div class="visual">'+icon('ROBOT')+'</div><div class="kicker">İNANILMAZ İŞ İLANLARI DEPARTMANI</div><div class="intro-big">Bunu gerçekten <em>yaparak para</em> mı kazanıyorlar?</div><p class="subtitle">10 tuhaf meslek. Bazıları gerçek iş ilanlarında var. Bazılarını ise gelecekten uydurduk.</p>';
 $('controls').innerHTML='<button id="begin" class="next" style="max-width:none;margin:0;grid-column:1/-1">BAŞLA →</button>';$('begin').onclick=start;
}
function start(){deck=shuffle(D.filter(x=>x.v)).slice(0,5).concat(shuffle(D.filter(x=>!x.v)).slice(0,5));deck=shuffle(deck);at=0;score=0;answered=0;realHits=0;fictionHits=0;showQuestion()}
function showQuestion(){phase='guess';current=deck[at];$('counter').textContent='SORU '+String(at+1).padStart(2,'0')+' / 10';$('points').textContent='SKOR '+String(score).padStart(2,'0')+' / 10';$('bar').style.width=(at*10)+'%';
 $('card').innerHTML='<div class="kicker">İŞ UNVANI / '+String(at+1).padStart(2,'0')+'</div><div class="visual">'+icon(current.kind)+'</div><h2 class="job">'+current.n+'</h2><p class="question">Sence bu meslek bugün gerçekten var mı?</p>';
 buttons('GERÇEK İŞ <small>BUGÜN</small>','GELECEK <small>KURGU</small>',()=>answer(1),()=>answer(0))
}
function answer(v){if(phase!=='guess')return;phase='reveal';const right=v===current.v;answered++;if(right)score++;if(right&&v===1)realHits++;if(right&&v===0)fictionHits++;
 $('points').textContent='SKOR '+String(score).padStart(2,'0')+' / 10';$('bar').style.width=((at+1)*10)+'%';
 const truth=current.v?'GERÇEK İŞ':'GELECEK SENARYOSU';
 $('card').innerHTML='<div class="feedback"><div class="badge '+(right?'yes':'no')+'">'+(right?'✓ DOĞRU TAHMİN':'✕ YANLIŞ TAHMİN')+'</div><div class="facttitle">'+truth+'.</div><div class="kicker" style="margin:0 0 12px;color:#1d2220">'+current.n+'</div><div class="factdesc">'+current.desc+'</div>'+(current.url?'<a class="source" target="_blank" rel="noopener noreferrer" href="'+current.url+'">GERÇEK İLAN / KAYNAK ↗</a>':'<div class="source" style="color:#8a908b">OYUN İÇİN KURGULANMIŞ ÜNVAN</div>')+'</div>';
 $('controls').innerHTML='<button id="next" class="next" style="grid-column:1/-1;max-width:none;margin:0">'+(at===9?'SONUCUMU GÖR →':'SONRAKİ MESLEK →')+'</button>';$('next').onclick=()=>{at++;if(at>=10)end();else showQuestion()};
}
function end(){phase='end';$('counter').textContent='İŞ PİYASASI / SONUÇ RAPORU';$('bar').style.width='100%';
 let label=score===10?'İK Departmanı senden korkuyor.':score>=8?'İş piyasası senden bir şey saklayamıyor.':score>=5?'Gelecek sandığın şey çoktan başladı.':'İş ilanlarına biraz uzak kalmışsın.';
 $('card').innerHTML='<div class="kicker">2026 / GERÇEKLİK KONTROLÜ</div><div class="score">'+score+'<small>/10</small></div><div class="statement">'+label+'</div><p class="sharetext">10 meslek gördün. '+score+' tanesinin gerçek mi gelecek senaryosu mu olduğunu doğru bildin. Birinin işi robotu çamaşır katlatmak.</p><div class="stats"><span>GERÇEKLERİ BULDUN: '+realHits+'/5</span><span>KURGULARI BULDUN: '+fictionHits+'/5</span></div><div class="endactions"><button type="button" id="again">YENİDEN OYNA ↻</button><button type="button" id="share">SONUCUMU PAYLAŞ ↗</button></div><a class="archive" href="/meslekler-arsiv.html">1923–2026: KAYBOLAN MESLEKLER ARŞİVİ ↗</a>';
 $('controls').innerHTML='';
 $('again').onclick=start;$('share').onclick=async()=>{const txt='Bu da İş mi? '+score+'/10. '+label+' Sence “Robot Teleoperatörü” gerçek iş mi?';const url=location.href.split('?')[0];try{if(navigator.share)await navigator.share({title:'Bu da İş mi? — aynen.fun',text:txt,url});else if(navigator.clipboard){await navigator.clipboard.writeText(txt+' '+url);$('share').textContent='KOPYALANDI ✓';}else prompt('Paylaş:',txt+' '+url)}catch(e){}};
}
screenStart();
})();
</script></body></html>
