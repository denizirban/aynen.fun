<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafaf8"><title>Hesap Kimde? — aynen.fun</title><meta name="description" content="Herkes ben öderim diyor. Gerçekten kim ödeyecek?"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>

en{width:100%;height:35px;background:#cbe1bd;border-radius:3px;font:600 12px 'DM Mono',monospace;display:grid;place-items:center}.pos .keys{display:grid;grid-template-columns:repeat(3,11px);gap:5px}.pos .keys i{background:#7a9081;height:7px;border-radius:2px}.people{position:relative;z-index:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end;min-height:340px}.person{position:relative;align-self:end;display:flex;flex-direction:column;align-items:center;justify-content:end;height:220px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);padding:4px 3px 5px;touch-action:manipulation}.person:nth-child(2),.person:nth-child(3){align-self:start;height:177px}.person .speech{font:500 11px 'DM Mono',monospace;background:white;border:1px solid #d2ddd0;border-radius:8px;padding:8px 7px;min-height:35px;white-space:nowrap;box-shadow:0 3px 0 #e1e9df}.person .head{width:51px;height:51px;margin-top:9px;background:#e1c6a9;border:2px solid #8b755f;border-radius:50%;display:grid;place-items:center;font-size:19px}.person:nth-child(even) .head{background:#d0b08f}.person .name{font:500 11px 'DM Mono',monospace;margin-top:9px}.person .hand{display:block;font-size:37px;line-height:1;margin:7px 0 2px;transition:transform .16s}.person[data-kind="bluff"]:hover .hand,.person[data-kind="bluff"]:focus-visible .hand{transform:translateX(22px) rotate(26deg)}.person[data-kind="real"]:hover .hand,.person[data-kind="real"]:focus-visible .hand{transform:translateY(-20px) scale(1.12)}.person[data-kind="excuse"]:hover .hand,.person[data-kind="excuse"]:focus-visible .hand{transform:translateX(-18px) rotate(-20deg)}.person .card{display:inline-block;background:#688b77;color:white;font:500 9px 'DM Mono',monospace;letter-spacing:2px;border-radius:3px;padding:7px}.person[data-kind="bluff"] .card{transform:rotate(-14deg)}.person[data-kind="real"] .card{transform:translateY(-4px)}.person[data-kind="excuse"] .card{opacity:.6}.person.is-hovered .speech{border-color:#809d82;background:#fffdf3}.person[disabled]{opacity:.7}.foot{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font:400 10px 'DM Mono',monospace;color:#879488}.feedback{display:none;padding:18px 20px 22px;border-top:1px solid var(--line)}.feedback.on{display:block}.feedback strong{font-size:26px;letter-spacing:-.045em}.feedback p{margin:6px 0 15px;color:#798779;font-size:13px}.feedback button,.again{border:0;background:#314b36;color:white;border-radius:5px;padding:12px 18px;font:500 11px 'DM Mono',monospace}.end{text-align:center;padding:48px 18px}.end h2{font-size:clamp(35px,6vw,63px);letter-spacing:-.08em;margin:8px 0 13px}.end p{max-width:500px;margin:0 auto 25px;font-size:14px;color:#829082;line-height:1.6}.end .buttons{display:flex;justify-content:center;gap:9px}.bottom{margin-top:auto;padding-top:20px;font:400 10px 'DM Mono',monospace;color:#a3aea3}@media(max-width:650px){.wrap{padding:14px 12px}.hero{display:block;margin:32px 0 19px}.hero h1{font-size:clamp(47px,12vw,70px)}.hero p{margin:10px 0 0}.info{padding:13px}.table{min-height:360px;padding:12px 6px 20px}.tabletop{width:78%;height:47%;top:49%}.people{gap:0;min-height:325px}.person{height:210px;padding:2px 0}.person:nth-child(2),.person:nth-child(3){height:170px}.person .speech{font-size:9px;padding:7px 2px}.person .head{width:39px;height:39px;font-size:16px}.person .hand{font-size:29px}.person .name{font-size:10px}.pos{width:61px;height:89px;top:49%}.pos .screen{font-size:9px;height:28px}.foot{padding:13px;font-size:9px}.feedback{padding:15px}.counter{font-size:9px}}
</style></head><body><div class="wrap"><nav class="top"><a href="/">← aynen.fun</a><span>SOSYAL DENEY / TÜRKİYE</span></nav><header class="hero"><h1>Hesap<br>kimde?</h1><p>Herkes “bende” diyor.<br>Birinin gerçekten kartı var.</p></header><main id="app" class="game"></main><footer class="bottom">KURGUSAL OYUN · GERÇEK HAYATTAN ESİNLENEN BAHANELER · AYNI MASADA BULUŞMAK ÜCRETSİZDİR.</footer></div><script>(()=>{'use strict';
const app=document.getElementById('app');
const scenes=[
{place:'ÇAY BAHÇESİ',sum:860,names:['Serkan','Mert','Cem','Oğuz'],talk:['Bende abi!','Ver bakayım.','Hallederiz.','Ben kaçtım.'],win:2,types:['bluff','excuse','real','bluff'],real:'Cem sessizce kartını uzattı.',miss:'“Bende abi” diyen elini tam POS’a yaklaşınca çekti.'},
{place:'ESNAF LOKANTASI',sum:1240,names:['İsmail','Mehmet','Erdal','Selçuk'],talk:['Esnafız sonuçta.','Yaz hesabı.','Bir dakika.','Bende!'],win:1,types:['bluff','real','excuse','bluff'],real:'Mehmet masadan kalkmadan hesabı kapattı.',miss:'Birisi cüzdanı ararken masadan küllük çıktı.'},
{place:'AİLE YEMEĞİ',sum:3860,names:['Amca','Dayı','Enişte','Baba'],talk:['Otur oğlum!','Elini indir.','Çek o kartı!','Ben öderim.'],win:0,types:['real','bluff','bluff','excuse'],real:'Amca kasaya senden önce yetişti.',miss:'Enişte kartı çıkardı ama temassız kapalıymış.'},
{place:'DOĞUM GÜNÜ',sum:2180,names:['Ece','Burcu','Bora','Pelin'],talk:['Pasta benden.','Ben salata yedim.','IBAN atarsın.','Çözeriz.'],win:0,types:['real','excuse','bluff','bluff'],real:'Ece pastayı önceden ödemiş. Geri kalanını da kapattı.',miss:'IBAN isteyen kişi grupta hâlâ yazıyor…'},
{place:'YAN MASADAKİ ABİ',sum:4890,names:['Sen','Kasiyer','Garson','Abi'],talk:['Ödeyeceğim!','Ödendi bile.','Ben karışmam.','Afiyet olsun.'],win:3,types:['bluff','excuse','bluff','real'],real:'Yan masadaki abi hesabı çoktan kapatmış.',miss:'Kartlar havada çarpışırken kasiyer fişi kesti: ÖDENDİ.'}
];
let at=0,correct=0,hover=-1,locked=false;
const money=n=>'₺'+new Intl.NumberFormat('tr-TR').format(n);
function draw(){locked=false;hover=-1;const s=scenes[at];app.innerHTML='<div class="info"><div><span class="tag">'+s.place+' / MASA '+String(at+1).padStart(2,'0')+'</span><div class="bill">'+money(s.sum)+'</div></div><div class="counter">'+(at+1)+' / '+scenes.length+'<br><br>'+correct+' DOĞRU</div></div><div class="table"><div class="tabletop"><span>HESAP MASASI</span></div><div class="pos"><div class="screen">POS</div><div class="keys">'+Array(9).fill('<i></i>').join('')+'</div></div><div class="people">'+s.names.map((name,i)=>'<button class="person" data-i="'+i+'" data-kind="'+s.types[i]+'" type="button"><span class="speech">'+s.talk[i]+'</span><span class="head">'+['🙂','😐','😏','😶'][i]+'</span><span class="hand">✋</span><span class="card">KART</span><span class="name">'+name+'</span></button>').join('')+'</div></div><div class="foot"><span>FAREYLE YAKLAŞ · MOBİLDE DOKUN</span><span>GERÇEK NİYETİ BUL</span></div><div class="feedback" id="feedback" aria-live="polite"></div>';
app.querySelectorAll('.person').forEach(el=>{const i=Number(el.dataset.i);el.addEventListener('pointerenter',()=>peek(el,i));el.addEventListener('focus',()=>peek(el,i));el.addEventListener('click',()=>choose(i))});
}
function peek(el,i){if(locked||hover===i)return;hover=i;app.querySelectorAll('.person').forEach(b=>b.classList.remove('is-hovered'));el.classList.add('is-hovered');const s=scenes[at],sp=el.querySelector('.speech');sp.textContent=s.types[i]==='real'?'Kart bende.':s.types[i]==='excuse'?'Bir saniye...':'Dur bi, acele etme.'}
function choose(i){if(locked)return;locked=true;const s=scenes[at],hit=i===s.win;if(hit)correct++;app.querySelectorAll('.person').forEach(b=>b.disabled=true);const f=document.getElementById('feedback');f.classList.add('on');f.innerHTML='<strong>'+(hit?'BU SEFER GERÇEKTEN ÖDEDİ.':'ELİ CEBİNE GİTTİ. SONRA GERİ GELDİ.')+'</strong><p>'+(hit?s.real:s.miss)+'<br>Hesabı kapatan: <b>'+s.names[s.win]+'</b>.</p><button id="continue">'+(at===scenes.length-1?'SONUCU GÖR':'SONRAKİ MASA →')+'</button>';document.getElementById('continue').onclick=()=>{at++;at===scenes.length?finish():draw()}}
function finish(){const title=correct>=4?'Mahallenin hesap sezgicisi':correct>=2?'Cüzdan dedektifi':'Bir dahakine hesabı sen iste';const desc=correct>=4?'Birinin “Bende” demesi yetmiyor, el hareketini okuyorsun. Türkiye’de bu yetenek CV’ye yazılır.':correct>=2?'Gerçek ödeyenle “ben hallederimci” arasında çoğu zaman yarım saniye var. Az kaldı.':'Herkesin samimiyetine inandın. Bir POS cihazı kadar şüpheci olmayı öğrenmen lazım.';app.innerHTML='<section class="end"><div class="tag">BEŞ MASALIK SOSYAL RAPOR</div><h2>'+title+'</h2><p>'+correct+'/5 hesap doğru bulundu.<br>'+desc+'<br><br>Final notu: “Ben öderim” demek ücretsizdir.</p><div class="buttons"><button id="again" class="again">TEKRAR OYNA</button><button id="share" class="again">PAYLAŞ ↗</button></div></section>';document.getElementById('again').onclick=()=>{at=0;correct=0;draw()};document.getElementById('share').onclick=async()=>{let text='Hesap Kimde? '+correct+'/5. '+title+'. https://aynen.fun/hesapkimde.html';try{if(navigator.share)await navigator.share({text,url:'https://aynen.fun/hesapkimde.html'});else{await navigator.clipboard.writeText(text);document.getElementById('share').textContent='KOPYALANDI ✓'}}catch(_){}}}
draw();
})();</script></body></html>
