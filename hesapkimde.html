<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafaf8"><meta name="description" content="Hesap kimde? Cebini ve itibarını aynı anda kurtarmaya çalış."><title>Hesap Kimde? — aynen.fun</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#fafaf8;--ink:#263027;--dim:#809083;--edge:#e1e7df;--pine:#385940}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #76a27d;outline-offset:3px}.shell{max-width:960px;margin:auto;min-height:100svh;padding:20px 24px 24px;display:flex;flex-direction:column}.nav{display:flex;justify-content:space-between;gap:10px;font:500 11px 'DM Mono',monospace}.nav span{color:#8f9e93}.header{margin:43px 0 22px;display:flex;align-items:end;justify-content:space-between;gap:18px}.header h1{font-size:clamp(51px,8vw,87px);line-height:.92;letter-spacing:-.09em;margin:0}.header p{font-size:12px;max-width:240px;color:var(--dim);line-height:1.7;margin:0}.board{border:1px solid var(--edge);background:white;border-radius:12px;overflow:hidden}.status{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--edge);padding:17px 21px}.mono{font:500 10px 'DM Mono',monospace;color:var(--dim)}.price{font-weight:700;font-size:clamp(29px,4vw,47px);letter-spacing:-.065em;margin-top:4px}.metrics{display:flex;align-items:center;gap:20px}.metric{min-width:110px}.metric b{display:block;font-size:21px;letter-spacing:-.06em;margin-top:6px}.track{height:4px;background:#e8eee6;border-radius:4px;margin-top:8px;overflow:hidden}.track i{display:block;height:100%;width:70%;background:#577c5c;transition:width .3s}.track.money i{background:#a89977}.scene{background:#f1f4ef;padding:19px 23px 22px}.scene-info{display:flex;justify-content:space-between;gap:10px;color:#829082;font:500 10px 'DM Mono',monospace}.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 0}.person{padding:16px 7px 12px;min-height:119px;background:#fff;border:1px solid #e1e8df;border-radius:8px;text-align:center;display:flex;flex- x}.person{padding:10px 3px 8px;min-height:124px}.person .avatar{width:35px;height:35px;font-size:17px}.person strong{font-size:11px}.person small{font-size:9px}.prompt{padding:18px 13px}.prompt h2{margin-bottom:16px}.actions{gap:7px}.action{padding:11px 9px;gap:6px;min-height:74px}.action .txt{font-size:11px}.result{padding:24px 15px}}
</style></head><body><div class="shell"><nav class="nav"><a href="/">← aynen.fun</a><span>TÜRK USULÜ SOSYAL STRATEJİ</span></nav><header class="header"><h1>Hesap<br>kimde?</h1><p>Cebini kurtar.<br>Kimseye pinti görünme.<br>İkisi birden mümkün mü?</p></header><main class="board" id="app"></main><footer class="foot">BU BİR SOSYAL SİMÜLASYON PARODİSİDİR. MASADAKİ GERÇEK KİŞİLERLE BENZERLİK TAMAMEN MUHTEMELDİR.</footer></div><script>(()=>{'use strict';
const app=document.getElementById('app'),fmt=n=>new Intl.NumberFormat('tr-TR').format(n),clamp=n=>Math.min(100,Math.max(0,n));
const scenes=[
{place:'ÇAY BAHÇESİ',bill:640,people:[['Murat','“Ben çağırdım.”'],['Cem','“Ver abi.”'],['Ece','“Böldük mü?”'],['Oğuz','“İban var mı?”']],lead:'Murat hesabı kendine yazdırmış.',reactions:[
{quote:'“Otur ya, ayıp ediyorsun.”',detail:'Murat seni misafir saydı. Para cebinde, ama teklifinin tanıkları var.',pay:0,rep:12},
{quote:'“Kasa şurada ama hesabı ben kapattım.”',detail:'Cem senden hızlı davrandı. Senin kasaya yürüyüşün sadece güzel bir jest oldu.',pay:0,rep:19},
{quote:'“Altı yüz kırk liralık çayı da mı bölüyoruz?”',detail:'Murat şaşırdı. Ece sana hak verdi. Masa hafif gerildi.',pay:160,rep:-13},
{quote:'“Sen ne ara sessizleştin?”',detail:'Hesap kapandı ama Oğuz seni gözden kaçırmadı.',pay:0,rep:-24}
]},
{place:'ESNAF LOKANTASI',bill:1180,people:[['İsmail','“Abi dükkân benim.”'],['Nihat','“Çorba güzeldi.”'],['Serkan','“Hesap kaç?”'],['Fikret','“Çayı tazele.”']],lead:'İsmail bu sefer çok ısrarcı.',reactions:[
{quote:'“Bizim mahallede misafirden para mı alınır?”',detail:'İsmail bozuldu. Bir tabak tatlı da söyledi. Teklif pahalıya patlamadı, itibarına patladı.',pay:0,rep:-10},
{quote:'“Fişi kestik abi.”',detail:'Kasaya yetiştin. İsmail seni durduramadı; hesabın yarısı sana yazıldı.',pay:590,rep:22},
{quote:'“Yarım yarım ne demek, ayıp ediyorsun.”',detail:'İsmail hesabı üstlendi. Nihat seni masada savundu ama ortam soğudu.',pay:0,rep:-23},
{quote:'“Bayağı rahat ettin sen.”',detail:'Hesap İsmail’de kaldı. Fikret bu cümleyi üç gün sonra da hatırlatacak.',pay:0,rep:-18}
]},
{place:'AİLE YEMEĞİ',bill:3240,people:[['Baba','“Verme oğlum.”'],['Dayı','“Çek şunu!”'],['Enişte','“Kart bende.”'],['Teyze','“Tatlı söyleyin.”']],lead:'Aile büyükleri kasaya yakın.',reactions:[
{quote:'“Baba dur, o benim görevim.”',detail:'İki kuşaklık hesabı ödeme töreni başladı. Sonunda hesabın üçte birini ödedin.',pay:1080,rep:10},
{quote:'“Hesap çoktan kapandı.”',detail:'Dayı seni izliyormuş. Sonradan aldığın baklava sayesinde itibar kaybını önledin.',pay:360,rep:15},
{quote:'“Bu sofrada para konuşulmaz.”',detail:'Baba resmen veto verdi. Enişte sessizce seni destekliyor.',pay:0,rep:-28},
{quote:'“Yemek bittiğinde ortada yoktun.”',detail:'Bir hafta boyunca aile grubunda bu konuya dönülecek.',pay:0,rep:-39}
]},
{place:'DOĞUM GÜNÜ',bill:2160,people:[['Pelin','“Pastayı ben aldım.”'],['Bora','“Paylaşalım.”'],['Derya','“Az yedim.”'],['Ece','“Foto çekin.”']],lead:'Hesapta doğum günü pastası da var.',reactions:[
{quote:'“Kanka bütün masayı niye üstleniyorsun?”',detail:'Herkes teşekkür etti. Ertesi sene davet sayın muhtemelen artacak.',pay:2160,rep:28},
{quote:'“Kasada tanımıyorlar, kimse ödememiş.”',detail:'Tek hamlede hesabın yarısını kapattın. Gerisi IBAN bekliyor.',pay:1080,rep:22},
{quote:'“Evet, herkes kendi yediğini ödesin.”',detail:'Derya sevindi. Pelin pastaya neden ortak olunmadığını sorguluyor.',pay:540,rep:-7},
{quote:'“Sen sadece pasta keserken vardın.”',detail:'Masa herkesin payını hesapladı. Seninki sonradan IBAN’la geldi.',pay:540,rep:-26}
]},
{place:'YAN MASADAKİ ABİ',bill:4890,people:[['Abi','“Afiyet olsun.”'],['Garson','“Bir saniye.”'],['Murat','“Ben halledeceğim.”'],['Sen','“Ne oluyor?”']],lead:'Garson fişi getiriyor. Yan masadan biri kalktı.',reactions:[
{quote:'“Kardeşim, sen misafirsin.”',detail:'Yan masadaki abi ödeme kavgasını kazandı. Sana yalnızca teşekkür etmek kaldı.',pay:0,rep:13},
{quote:'“Abi hesap zaten ödendi.”',detail:'Kasaya vardığında fişin üzerinde ÖDENDİ yazıyordu. Sosyal jestin boşa gitmedi.',pay:0,rep:19},
{quote:'“Bunu dörde bölecek kasa yok.”',detail:'Yan masadaki abi bakışını kaldırdı. Garsonun gözleri doldu.',pay:0,rep:-21},
{quote:'“Bu masada ödeme kavgasına bile katılmadın.”',detail:'Yan masadaki abi seni tanımıyor ama Murat unutmayacak.',pay:0,rep:-37}
]}];
const actions=['Ben ödeyeyim.','Kasaya gizlice git.','Bölüşelim de.','Hiç karışma.'];
let round=0,cash=6500,rep=65,history=[],phase='play';
function status(s){return '<div class="status"><div><div class="mono">'+s.place+' · MASA '+String(round+1).padStart(2,'0')+'</div><div class="price">₺'+fmt(s.bill)+'</div></div><div class="metrics"><div class="metric"><span class="mono">CEBİNDE</span><b>₺'+fmt(cash)+'</b><div class="track money"><i style="width:'+(cash/6500*100)+'%"></i></div></div><div class="metric"><span class="mono">İTİBAR</span><b>%'+rep+'</b><div class="track"><i style="width:'+rep+'%"></i></div></div></div></div>'}
function scene(s){return '<div class="scene"><div class="scene-info"><span>MASADAKİLER</span><span>'+String(round+1).padStart(2,'0')+' / '+scenes.length+'</span></div><div class="people">'+s.people.map((p,i)=>'<div class="person"><span class="avatar">'+['◡','•','⌣','◠'][i]+'</span><strong>'+p[0]+'</strong><small>'+p[1]+'</small></div>').join('')+'</div></div>'}
function draw(){let s=scenes[round];phase='play';app.innerHTML=status(s)+scene(s)+'<section class="prompt"><div class="mono">DURUM / '+s.lead+'</div><h2>Ne yapıyorsun?</h2><div class="actions">'+actions.map((x,i)=>'<button class="action" data-act="'+i+'"><span class="num">0'+(i+1)+'</span><span class="txt">'+x+'</span></button>').join('')+'</div></section>';app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.act)))}
function choose(i){if(phase!=='play')return;phase='result';const s=scenes[round],r=s.reactions[i];cash=Math.max(0,cash-r.pay);rep=clamp(rep+r.rep);history.push({i,pay:r.pay,rep:r.rep});app.innerHTML=status(s)+scene(s)+'<section class="result"><div class="mono">MASANIN TEPKİSİ</div><div class="quote">'+r.quote+'</div><p>'+r.detail+'</p><div class="delta"><span>ÖDEDİĞİN: ₺'+fmt(r.pay)+'</span><span>İTİBAR: '+(r.rep>0?'+':'')+r.rep+'</span></div><button id="next">'+(round===scenes.length-1?'SONUCU GÖR →':'SONRAKİ MASA →')+'</button></section>';document.getElementById('next').onclick=()=>{round++;if(round===scenes.length)finish();else draw()}}
function finish(){phase='end';const spent=6500-cash;let title,desc;if(spent<900&&rep>=65){title='Bedavacı değil, diplomatik misafir.';desc='Beş masadan cebini çok yormadan çıktın. Üstelik kimse seni terslemedi. Bu bir sosyal mühendislik başarısı olabilir.'}else if(spent<900&&rep<65){title='Hesap sana kalmadı. Lafı kaldı.';desc='Para cebinde. Ama birileri hâlâ o “Ben zaten ödeyecektim” anını anlatıyor.'}else if(spent>3500){title='Masa seni sevdi. Banka düşünceli.';desc='Bir daha buluşurken herkese “sen zaten ödersin” rahatlığı geldi. Geçmiş olsun.'}else if(rep<45){title='Bir çaydan fazlasını kaybettin.';desc='Ekonomik olarak fena değilsin. Sosyal olarak bir sonraki davet belirsiz.'}else{title='Ne şiş yandı ne kebap.';desc='Biraz hesap ödedin, biraz gönül aldın. Türk masasında nadir görülen dengeli kapanış.'}app.innerHTML='<section class="end"><div class="mono">BEŞ MASALIK GAYRİRESMÎ RAPOR</div><div class="stamp">₺</div><h2>'+title+'</h2><p>Toplam ödediğin: <b>₺'+fmt(spent)+'</b> · Kalan itibar: <b>%'+rep+'</b><br><br>'+desc+'<br><br>Bir masada “ben ödeyeyim” demek kolay. Sonrası masaya bağlı.</p><div class="buttons"><button id="again">BİR DAHA OYNA</button><button id="share">PAYLAŞ ↗</button></div></section>';document.getElementById('again').onclick=()=>{round=0;cash=6500;rep=65;history=[];draw()};document.getElementById('share').onclick=async()=>{const t='Hesap Kimde? '+title+' Toplam ₺'+fmt(spent)+' ödedim. https://aynen.fun/hesapkimde.html';try{if(navigator.share)await navigator.share({text:t,url:'https://aynen.fun/hesapkimde.html'});else{await navigator.clipboard.writeText(t);document.getElementById('share').textContent='KOPYALANDI ✓'}}catch(_){}}}
draw();
})();</script></body></html>
