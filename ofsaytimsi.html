/* Match setup and decisions */
.setup-screen{padding:26px 22px 29px}
.setup-screen h2{font-size:clamp(31px,5.5vw,52px);margin:7px 0 5px}
.setup-screen p{margin:0 auto 12px;max-width:510px}
.team-section{max-width:805px;margin:20px auto 0;text-align:left}
.team-label{font:500 10px 'DM Mono',monospace;color:#7d8c7b;letter-spacing:.045em;display:flex;justify-content:space-between;gap:8px}
.team-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:9px}
.team-choice{display:flex;align-items:center;gap:9px;min-width:0;min-height:47px;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:500 11px/1.25 'DM Mono',monospace;text-align:left}

.team-choice .team-mark{width:12px;height:21px;border:1px solid #c3cfc2;border-radius:2px;display:inline-block;flex:none}
.start-row{margin-top:25px}
.main-start{border:0;border-radius:6px;background:#294c31;color:white;padding:14px 27px;font:500 12px 'DM Mono',monospace}
.main-start:hover{background:#1b3822}
.scorebar .club{min-width:0;flex:1}
.scorebar .club .k{overflow-wrap:anywhere}
.scorebar .club.right{justify-content:flex-end;text-align:right}
.scorebar .club i{flex:none}
.scorebar .center{flex:0 0 auto;line-height:1.65}

.attack-note .attack-dot{height:9px;width:9px;border-radius:50%;display:inline-block}

.verdict .rule-note{font-size:12px;line-height:1.6;color:#677767}
.verdict .rule-note strong{color:#2a4330}
.verdict .decision-bad{color:#a3633b}
.result-score{font-size:clamp(39px,7vw,70px);font-weight:700;letter-spacing:-.075em;line-height:1.12;margin:13px 0 2px}
.result-score small{font-size:.42em;letter-spacing:-.04em;vertical-align:middle;color:#96a193}
.result-names{font:500 11px 'DM Mono',monospace;color:#778777;margin-bottom:18px}

.touchline{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px 14px 12px}.manager{min-width:0;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 10px;border:1px solid #d9e4d8;background:#f9fbf7;border-radius:6px}.manager.other{flex-direction:row-reverse;text-align:right}.coach{flex:none;height:43px}.coach-label{font:500 9px 'DM Mono',monospace;color:#879286;margin-bottom:3px}.coach-line{font:500 11px/1.35 'Space Grotesk',sans-serif;color:#37493a}.manager[data-mood=joy]{background:#e4f0e2;border-color:#afd0ae}.manager[data-mood=angry]{background:#f8efe9;border-color:#dfc5b5}.manager[data-mood=joy] .coach{animation:coachUp .45s ease-in-out 3}.manager[data-mood=angry] .coach{animation:coachNo .26s ease-in-out 4}

</style></head><body><div class="page"><nav class="nav"><a href="/">← aynen.fun</a><span>FUTBOL / HAKEM AKADEMİSİ</span></nav><header class="intro"><h1>Ofsaytımsı.</h1><p>Maç biter. Tartışma bitmez.</p></header><main id="app" class="shell"></main><div class="below"><span>Oyun kurgusaldır. Kural bölümü gerçek ofsayt prensiplerine dayanır.</span><span>AYNEN.FUN</span></div><footer class="footer">KARARINIZ İNCELENMEKTEDİR. / SONSUZA KADAR</footer></div>
<script>(function game() {
  'use strict';
  const app=document.getElementById('app');
  const clubs=[
    {id:'GS',name:'Galatasaray',kit:'linear-gradient(90deg,#f4cd37 50%,#ad293a 50%)',ink:'#a6293b'},
    {id:'FB',name:'Fenerbahçe',kit:'linear-gradient(90deg,#f3d52f 50%,#202e62 50%)',ink:'#1b397a'},
    {id:'BJK',name:'Beşiktaş',kit:'linear-gradient(90deg,#111 50%,#fff 50%)',ink:'#242424'},
    {id:'TS',name:'Trabzonspor',kit:'linear-gradient(90deg,#7c273c 50%,#67a9ca 50%)',ink:'#77334e'},
    {id:'BS',name:'Bursaspor',kit:'linear-gradient(90deg,#26754b 50%,#fff 50%)',ink:'#27684b'},
    {id:'GZ',name:'Göztepe',kit:'linear-gradient(90deg,#c82f3b 50%,#f2cb45 50%)',ink:'#b82d3c'},
    {id:'KON',name:'Konyaspor',kit:'linear-gradient(90deg,#287c50 50%,#fff 50%)',ink:'#25744a'}
  ];
  const times=['08','19','31','45+2','58','70','83','90+4'];
  const attackOrder=[0,1,1,0,1,0,0,1];
  const cases=[
    {def:68,attack:74,ball:29,tip:'Topun oynandığı an önemli.',quip:'Stüdyoda üç farklı çizgi çizildi.'},
    {def:76,attack:60,ball:32,tip:'Sondan ikinci rakibe bak.',quip:'Pozisyonun 11 farklı açıdan fotoğrafı paylaşıldı.'},
    {def:53,attack:49,ball:31,tip:'Kendi yarı sahanda ofsayt olmaz.',quip:'Yarı saha çizgisi açıklama yayınladı.'},
    {def:62,attack:67,ball:38,tip:'Hücumcuyu sağa veya sola sürükle.',quip:'Bir spor programı bu pozisyona üç saat ayırdı.'},
    {def:73,attack:78,ball:46,tip:'Ofsayt çizgisini kontrol et.',quip:'Çizginin kalınlığına itiraz edildi.'},
    {def:61,attack:59,ball:35,tip:'Pas anındaki konumuna bak.',quip:'İki kulüp de kamuoyunu aydınlattı.'},
    {def:82,attack:86,ball:87,tip:'Top da ofsayt sınırını belirler.',quip:'Psikolojik üstünlük güncellendi.'},
    {def:69,attack:74,ball:44,keeperForward:true,tip:'Kaleci ilerideyse sondan ikinci rakip kim?',quip:'Son pozisyon. Tartışma yeni başladı.'}
  ];
  const N=cases.length;
  let activeCases=cases.slice(),previewing=false,guideOpen=false,previewTimer=null,fxTimer=null,linesUsed=0,incidentGoals=[0,1],story='',frameRAF=null,currentFrame=55;
  let home='GS',away='FB',round=0,correct=0,wrong=0,score=[0,0],fair=[0,0],selectedX=65,answered=false,scenario=null,dragging=false;
  const findClub=(id)=>clubs.find(c=>c.id===id);
  const side=(i)=>findClub(i===0?home:away);
  const attackingSide=()=>attackOrder[round];
  const X=(v)=>35+v*8.3;
  function pickClub(which,id){
    if(which==='home'){
      if(id===away){away=home;}home=id;
    }else{
      if(id===home){home=away;}away=id;
    }
    intro();
  }
  function clubButton(club,which){
    const active=(which==='home'?home:away)===club.id;
    return `<button type="button" class="team-choice" data-${which}="${club.id}" aria-pressed="${active}"><i class="team-mark" style="background:${club.kit}" aria-hidden="true"></i><span>${club.name}</span></button>`;
  }
  function intro(){
   cancelFx();document.body.classList.remove("in-match");document.onkeydown=null;
   app.innerHTML=`<section class="stage-screen setup-screen"><div class="micro">FUTBOL / İNTERAKTİF VAR SİMÜLASYONU</div>
   <h2>Maçı sen yönet.</h2><p>İki takım seç. Maçı izle, görüntüyü geri sar, pas anını bul ve karar ver. Tribünlerin gözü sende.</p>
   <div class="team-section"><div class="team-label"><span>01 / SENİN TAKIMIN</span><span>${findClub(home).name.toUpperCase()}</span></div><div class="team-grid">${clubs.map(c=>clubButton(c,'home')).join('')}</div></div>
   <div class="team-section"><div class="team-label"><span>02 / RAKİBİN</span><span>${findClub(away).name.toUpperCase()}</span></div><div class="team-grid">${clubs.map(c=>clubButton(c,'away')).join('')}</div></div>
   <div class="start-row"><button class="main-start" id="kickoff">MAÇI BAŞLAT →</button><div class="micro">8 POZİSYON · 2 VAR ÇİZGİSİ HAKKI · RÖVANŞ</div></div></section>`;
   app.querySelectorAll("[data-home]").forEach(b=>b.onclick=()=>pickClub("home",b.dataset.home));
   app.querySelectorAll("[data-away]").forEach(b=>b.onclick=()=>pickClub("away",b.dataset.away));
   document.getElementById("kickoff").onclick=start;
  }
  function start(){
   cancelFx();round=0;correct=0;wrong=0;score=[0,0];fair=[0,0];linesUsed=0;
   activeCases=cases.slice();
   for(let i=activeCases.length-2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[activeCases[i],activeCases[j]]=[activeCases[j],activeCases[i]];}
   if(Math.random()<.5)attackOrder.reverse();
   incidentGoals=[Math.floor(Math.random()*2),Math.floor(Math.random()*2)];
   next();
  }
  function opponents(){
    const line=scenario.def;
    return scenario.keeperForward?[
      {x:line+16,y:145,role:'SAVUNMACI'},
      {x:line,y:240,role:'KALECİ'},
      {x:line-16,y:310,role:'SAVUNMACI'}
    ]:[
      {x:Math.min(97,line+19),y:210,role:'KALECİ'},
      {x:line,y:145,role:'SAVUNMACI'},
      {x:Math.max(5,line-16),y:305,role:'SAVUNMACI'}
    ];
  }
  function offsideLine(){return opponents().map(p=>p.x).sort((a,b)=>b-a)[1];}
  function isOffside(){return selectedX>50&&selectedX>Math.max(offsideLine(),scenario.ball);}
  function pitch(){
    const ax=X(selectedX),bx=X(scenario.ball),atk=side(attackingSide()),def=side(1-attackingSide()),dx=X(offsideLine());
    function person(id,x,y,shirt,number,keeper=false){
      return `<g class="footballer" id="${id}" data-px="${x}" data-py="${y}" transform="translate(${x} ${y})">
        <ellipse class="player-shadow" cx="2" cy="16" rx="14" ry="5" fill="#0c2417" opacity=".34"/>
        <path d="M-6 9l-5 12M6 9l8 12" stroke="${keeper?'#242521':'#e2e6e3'}" stroke-width="5" stroke-linecap="round"/>
        <path d="M-10-3l-9 8M10-3l9 8" stroke="#c89f83" stroke-width="4.6" stroke-linecap="round"/>
        <path d="M-8-9l16 0l4 18h-24Z" fill="${keeper?'#e2ad48':shirt}" stroke="#f6f3ea" stroke-width="1.5"/>
        <path d="M-6 7h12" stroke="${keeper?'#b88228':'#ffffff'}" stroke-width="3.5"/>
        <circle cy="-13" r="6.5" fill="#d7ac8a" stroke="#9c7b62" stroke-width="1"/>
        <path d="M-6-15q5-8 12 0" fill="#33291f"/>
        <text y="3" fill="#fff" text-anchor="middle" font-size="9" font-weight="700">${number}</text>
      </g>`;
    }
    const defenders=opponents().map((p,i)=>person("def-"+i,X(p.x),p.y,def.ink,p.role==='KALECİ'?"1":[4,5,6][i],p.role==='KALECİ')).join("");
    const support=[
      person("support-0",X(Math.max(23,scenario.ball-13)),118,atk.ink,8),
      person("support-1",X(Math.max(25,scenario.ball-6)),340,atk.ink,11),
      person("support-2",X(Math.min(91,scenario.def+7)),348,def.ink,3),
      person("support-3",X(Math.max(10,scenario.def-25)),230,def.ink,8),
      person("support-4",X(Math.max(12,scenario.ball-23)),185,atk.ink,7)
    ].join("");
    return `<svg id="pitch" class="pitch" viewBox="0 0 900 440" preserveAspectRatio="xMaxYMid slice" role="img" aria-label="Yayın kamerası açısında ofsayt pozisyonu. Kaydırma çubuğundan pas anına geri dön.">
      <defs>
       <linearGradient id="pitchLight" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#80a868"/><stop offset=".5" stop-color="#54894d"/><stop offset="1" stop-color="#3e7645"/></linearGradient>
       <pattern id="stripes" width="120" height="440" patternUnits="userSpaceOnUse"><rect width="120" height="440" fill="url(#pitchLight)"/><rect width="60" height="440" fill="#1e4a24" opacity=".12"/></pattern>
       <pattern id="grassDust" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M2 2l1 2M9 7l-1 2M5 12l1-2" stroke="#ffffff" stroke-opacity=".12" stroke-width=".7"/></pattern>
       <radialGradient id="lighting"><stop stop-color="#e4f5c5" stop-opacity=".13"/><stop offset="1" stop-color="#001409" stop-opacity=".25"/></radialGradient>
       <pattern id="net" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M9 0H0V9" stroke="#e9f0e8" stroke-opacity=".55" fill="none" stroke-width=".8"/></pattern>
       <filter id="floorShadow" x="-10%" y="-10%" width="125%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
      </defs>
      <rect width="900" height="440" fill="#142c19"/>
      <rect x="0" y="0" width="900" height="440" fill="url(#stripes)"/>
      <rect width="900" height="440" fill="url(#grassDust)"/>
      <rect width="900" height="440" fill="url(#lighting)"/>
      <g fill="none" stroke="#eaf3dc" stroke-width="2.5" opacity=".83">
        <path d="M20 15H880V425H20Z M450 15V425"/><circle cx="450" cy="220" r="65"/>
        <path d="M755 116H880V324H755Z M825 161H880V279H825Z"/>
        <path d="M20 116H145V324H20Z M20 161H75V279H20Z"/>
        <path d="M755 157A65 65 0 0 0 755 283"/>
      </g>
      <g class="goal-net"><rect x="878" y="175" width="21" height="90" fill="url(#net)" stroke="#f3f3e9" stroke-width="2.5"/><rect x="0" y="175" width="20" height="90" fill="url(#net)" stroke="#f3f3e9" stroke-width="2.5"/></g>
      <path d="M${dx} 18V422" stroke="#234f35" stroke-width="1" opacity=".16"/>
      <g id="varGuide" class="${guideOpen?'':'hide-guide'}">
         <rect x="${dx}" y="16" width="${880-dx}" height="408" fill="#acd3b2" opacity=".1"/>
         <line x1="${dx}" y1="16" x2="${dx}" y2="425" stroke="#dff2a3" stroke-width="3" stroke-dasharray="10 5"/>
         <line x1="${ax}" y1="15" x2="${ax}" y2="424" stroke="#e66b53" stroke-width="2" stroke-dasharray="6 6"/>
         <text x="${Math.min(dx+10,738)}" y="36" fill="#fff" font-size="12" font-weight="700" stroke="#1b3b29" stroke-width="3" paint-order="stroke">VAR OFSAYT ÇİZGİSİ</text>
      </g>
      ${support}${defenders}
      ${person("passer",bx,236,atk.ink,10)}
      ${person("attacker",ax,160,atk.ink,9)}
      <ellipse id="ballShadow" cx="${bx+15}" cy="258" rx="8" ry="3" fill="#0a2818" opacity=".5"/>
      <g id="ball" transform="translate(${bx+15} 256)"><circle r="7" fill="#f8f9f4" stroke="#283a2a" stroke-width="1.5"/><path d="M-2-3l5 1 1 4-4 2-3-3Z" fill="#28332c"/></g>
      <g id="momentMark" opacity=".85"><path d="M${bx+10} 218v-25" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${bx-28}" y="185" fill="white" font-size="11" stroke="#1c3921" stroke-width="3" paint-order="stroke">PAS</text></g>
      <rect width="900" height="440" fill="url(#lighting)" pointer-events="none"/>
    </svg>`;
  }
  function next(){
   cancelFx();answered=false;dragging=false;guideOpen=false;currentFrame=55;
   if(round===1)story="22′ · KALECİ ÇIKARDI · OYUN DEVAM EDİYOR";
   else if(round===3){const i=incidentGoals[0];score[i]++;fair[i]++;story=`38′ · GOL! ${side(i).name.toUpperCase()} · MAÇ DEVAM EDİYOR`;}
   else if(round===5)story="64′ · TOP DİREKTEN DÖNDÜ · TRİBÜNLER AYAKTA";
   else if(round===7){const i=incidentGoals[1];score[i]++;fair[i]++;story=`88′ · GOL! ${side(i).name.toUpperCase()} · SON DAKİKALAR`;}
   else story=`${times[round]}′ · ${side(attackingSide()).name.toUpperCase()} HÜCUMDA`;
   scenario=activeCases[round];selectedX=scenario.attack;paint();runAttack();
  }
  function scoreClub(i){
    const c=side(i);
    return `<div class="club ${i===1?'right':''}">${i===1?`<div><div class="k">${c.name.toUpperCase()}</div><strong id="score-${i}">${score[i]}</strong></div><i style="background:${c.kit}" aria-hidden="true"></i>`:`<i style="background:${c.kit}" aria-hidden="true"></i><div><div class="k">${c.name.toUpperCase()}</div><strong id="score-${i}">${score[i]}</strong></div>`}</div>`;
  }
  function paint(){
   const atk=side(attackingSide());
   document.body.classList.add("in-match");
   app.innerHTML=`<section class="match-layout" aria-label="Ofsaytımsı maç simülasyonu">
      <header class="scorebar broadcast-score" id="scoreboard">
         ${scoreClub(0)}
         <div class="broadcast-clock"><span class="live-symbol">● CANLI</span><strong>${times[round]}'</strong><small>${round+1}/${N} POZİSYON</small></div>
         ${scoreClub(1)}
         <button class="view-full" id="screen" type="button" title="Tam ekranı aç veya kapat" aria-label="Tam ekran">⛶</button>
      </header>
      <div class="match-ticker"><span class="live-label">MAÇ AKIŞI</span><span id="ticker" aria-live="polite">${story}</span><span class="timeline"><i style="width:${Math.round((round+1)/N*100)}%"></i></span></div>
      <div class="stadium">
        <div class="stands">
          <div class="stand" id="stand-0" style="--shirt:${side(0).ink}"><div class="fans" aria-hidden="true"></div><span id="fans-0">${side(0).id} TRİBÜNÜ</span></div>
          <div class="stand-clock"><span>OFSAYTIMSI</span></div>
          <div class="stand" id="stand-1" style="--shirt:${side(1).ink}"><div class="fans" aria-hidden="true"></div><span id="fans-1">${side(1).id} TRİBÜNÜ</span></div>
        </div>
        <div class="pitch-wrap"><div class="field-frame">${pitch()}</div>
          <div class="field-vignette"></div>
          <div class="pitch-hud"><span class="camera-indicator">● KAMERA 01 / TAKTİK AÇI</span><span class="field-hint" id="fieldHint">POZİSYON HAZIRLANIYOR</span></div>
          <div class="scene-overlay" id="sceneOverlay" aria-hidden="true"><strong>ATAK!</strong><small>${atk.name.toUpperCase()} HÜCUMDA</small></div>
        </div>
        <div class="touchline">
          ${[0,1].map(i=>`<div class="manager ${i===1?'other':''}" id="manager-${i}" data-mood="neutral" style="--shirt:${side(i).ink}">
            <span class="coach" aria-hidden="true">${coachFigure()}</span>
            <div class="manager-copy"><div class="coach-label">${side(i).name.toUpperCase()} · TEKNİK DİREKTÖR</div><div class="coach-line" id="coach-${i}">${i===attackingSide()?'Atağı takip ediyor.':'Savunmayı uyarıyor.'}</div></div>
          </div>`).join('')}
        </div>
      </div>
      <div class="decision-hub" id="hub">
        <div id="decisionPanel">
          <div class="review-heading"><div><strong>VAR İNCELEMESİ</strong><span id="phaseHint">Hücum oynatılıyor...</span></div>
          <div class="review-top-tools"><button id="replay" type="button" disabled aria-label="Pozisyonu tekrar oynat">↻ <span>TEKRAR</span></button>
          <button id="line" type="button" disabled>VAR ÇİZGİSİ <small id="lineCount">${2-linesUsed} HAK</small></button></div></div>
          <div class="scrub-row"><button type="button" id="backFrame" aria-label="Görüntüyü geri al" disabled>−</button>
            <label class="scrub-wrap"><span class="visually-hidden">Pozisyon görüntüsünü ileri geri sar</span><input id="scrub" type="range" min="0" max="100" value="55" step="1" disabled aria-label="Video zaman çizelgesi"/><span class="pas-marker" style="left:55%"></span></label>
            <button id="aheadFrame" type="button" aria-label="Görüntüyü ileri al" disabled>+</button><button id="passFrame" class="pass-frame" type="button" disabled>PAS ANI</button>
          </div>
          <div class="decision-row"><div class="decision-question"><strong>Ofsayt mı?</strong><span id="decisionHelp">Pas anını bekle...</span></div>
          <div class="decisions"><button id="off" disabled>OFSAYT</button><button id="on" disabled>DEVAM</button></div></div>
        </div>
        <div id="verdict" class="verdict" aria-live="polite"></div>
      </div>
    </section>`;
   document.getElementById("off").onclick=()=>judge(true);
   document.getElementById("on").onclick=()=>judge(false);
   document.getElementById("replay").onclick=runAttack;
   document.getElementById("backFrame").onclick=()=>setFrame(currentFrame-5);
   document.getElementById("aheadFrame").onclick=()=>setFrame(currentFrame+5);
   document.getElementById("passFrame").onclick=()=>setFrame(55);
   document.getElementById("scrub").addEventListener("input",e=>setFrame(+e.target.value));
   document.getElementById("line").onclick=()=>{
     if(previewing||answered||guideOpen||linesUsed>=2)return;
     setFrame(55);linesUsed++;guideOpen=true;
     document.getElementById("varGuide").classList.remove("hide-guide");
     document.getElementById("line").disabled=true;document.getElementById("lineCount").textContent=(2-linesUsed)+" HAK";
   };
   document.getElementById("screen").onclick=async()=>{
     try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch(_){}
   };
   document.onkeydown=e=>{
     if(!document.body.classList.contains('in-match')||answered||previewing)return;
     if(e.key==='ArrowLeft'){e.preventDefault();setFrame(currentFrame-5);}
     if(e.key==='ArrowRight'){e.preventDefault();setFrame(currentFrame+5);}
     if(e.key===' '){e.preventDefault();runAttack();}
     if(e.key==='1'&&!document.getElementById('off').disabled)judge(true);
     if(e.key==='2'&&!document.getElementById('on').disabled)judge(false);
   };
  }
  function updateAttacker(){
    const s=document.getElementById('pitch'),attacker=document.getElementById('attacker'),lbl=document.getElementById('playerLabel');
    attacker.setAttribute('cx',X(selectedX));lbl.setAttribute('x',X(selectedX)-29);
    document.getElementById('passLine').setAttribute('d',`M${X(scenario.ball)+18} 233L${X(selectedX)-10} 175`);
  }
  function move(e){
    const s=document.getElementById('pitch'),r=s.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width*900-35)/8.3;
    selectedX=Math.max(0,Math.min(100,Math.round(x)));updateAttacker();
  }
  function judge(whistle){
   if(answered||previewing||Math.abs(currentFrame-55)>5)return;
   answered=true;cancelFx();
   const real=isOffside(),correctDecision=whistle===real,index=attackingSide(),club=side(index);
   if(correctDecision)correct++;else wrong++;
   if(!whistle)score[index]++;
   if(!real)fair[index]++;
   document.getElementById("score-0").textContent=score[0];
   document.getElementById("score-1").textContent=score[1];
   document.getElementById("varGuide").classList.remove("hide-guide");
   document.getElementById("scoreboard").classList.add("score-flash");
   const action=whistle?"GOL İPTAL!":"GOOOL!";
   const overlay=document.getElementById("sceneOverlay");
   overlay.className="scene-overlay visible "+(whistle?"no-goal":"goal");
   overlay.innerHTML=`<strong>${action}</strong><small>${correctDecision?'DOĞRU KARAR':'HAKEM HATASI'}</small>`;
   document.getElementById("ticker").textContent=`${times[round]}' · ${club.name.toUpperCase()} · ${action} · ${score[0]}–${score[1]}`;
   crowdReact(whistle,correctDecision);
   fxTimer=setTimeout(()=>{overlay.classList.remove('visible');document.getElementById('scoreboard')?.classList.remove('score-flash');},1450);
   const reason=real?'Pas anında hücumcu, rakip yarı sahada toptan ve sondan ikinci rakipten ileride. Pası alarak aktif oyuna katılıyor.':'Hücumcu pas anında ofsayt konumunun üç koşulunu aynı anda taşımıyor.';
   const box=document.getElementById("verdict");
   document.getElementById("hub").classList.add("done");
   box.classList.add("on");
   box.innerHTML=`<div class="verdict-main"><div><span class="verdict-kicker">${correctDecision?'DOĞRU KARAR':'YANLIŞ KARAR'} · ${times[round]}'</span><b>${action}</b><p>${club.name} · ${whistle?'Gol geçerli değil.':'Gol geçerli.'} ${reason}</p></div>
     <div class="verdict-actions"><button id="continue">${round===N-1?'MAÇ SONUCU':'SONRAKİ ATAK →'}</button><button id="details" type="button">KURAL</button></div></div><div class="verdict-details" id="ruleDetails">${scenario.tip}</div>`;
   document.getElementById("continue").onclick=()=>{round++;round===N?finish():next();};
   document.getElementById("details").onclick=()=>document.getElementById("ruleDetails").classList.toggle("open");
  }
  function finish(){
   cancelFx();document.body.classList.remove("in-match");document.onkeydown=null;
   const diff=score[0]-score[1],outcome=diff>0?'KAZANDIN.':diff<0?'KAYBETTİN.':'BERABERE.';
   const fairDiff=fair[0]-fair[1],fairOutcome=fairDiff>0?'Takımın kazanıyordu.':fairDiff<0?'Rakibin kazanıyordu.':'Maç berabere bitiyordu.';
   const altered=score[0]!==fair[0]||score[1]!==fair[1];
   app.innerHTML=`<section class="stage-screen result-screen"><div class="micro">MAÇ SONU / HAKEM RAPORU</div>
     <h2>${outcome}</h2><div class="result-score">${score[0]} <small>–</small> ${score[1]}</div>
     <div class="result-names">${side(0).name.toUpperCase()} / ${side(1).name.toUpperCase()}</div>
     <div class="result-compare"><div><div class="micro">SENİN KARARLARINLA</div><strong>${score[0]} – ${score[1]}</strong><div class="micro">${correct}/${N} DOĞRU KARAR</div></div>
      <div><div class="micro">KURALA GÖRE</div><strong>${fair[0]} – ${fair[1]}</strong><div class="micro">${wrong} HATALI KARAR</div></div></div>
     <p class="result-caption">${altered?`Kurallar uygulansaydı: ${fairOutcome} Skor değişti, tartışma başladı.`:'İki skor da aynı. Maç sonrası programı yine uzadı.'}</p>
     <div class="bottom-actions"><button id="again">RÖVANŞ</button><button id="teams">TAKIMLARI DEĞİŞTİR</button><button id="share">PAYLAŞ ↗</button></div></section>`;
   document.getElementById("again").onclick=start;document.getElementById("teams").onclick=intro;
   document.getElementById("share").onclick=async()=>{
     const url="https://aynen.fun/ofsaytimsi.html";
     const msg=`Ofsaytımsı: ${side(0).name} ${score[0]}–${score[1]} ${side(1).name}. Kurala göre ${fair[0]}–${fair[1]}. ${correct}/${N} doğru karar. ${url}`;
     try{if(navigator.share)await navigator.share({title:"Ofsaytımsı",text:msg,url});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);document.getElementById("share").textContent="KOPYALANDI ✓";}else window.prompt("Sonucu kopyala:",msg);}catch(_){}
   };
  }
  function runAttack(){
   if(answered)return;
   cancelAnimationFrame(frameRAF);previewing=true;
   const ov=document.getElementById("sceneOverlay");
   ov.className="scene-overlay visible";ov.innerHTML=`<strong>ATAK!</strong><small>${side(attackingSide()).name.toUpperCase()} HÜCUMDA</small>`;
   setReviewEnabled(false);document.getElementById("phaseHint").textContent="Hücum oynatılıyor...";
   const stamp=performance.now(),duration=2150;
   const animate=now=>{
     if(!previewing)return;
     const fraction=Math.min(1,(now-stamp)/duration);
     setFrame(Math.round(fraction*100),true);
     if(fraction<1){frameRAF=requestAnimationFrame(animate);}else{
       frameRAF=null;previewing=false;setFrame(55,true);ov.classList.remove("visible");setReviewEnabled(true);
       document.getElementById("phaseHint").textContent="Görüntü durdu · Pas anı";
       document.getElementById("decisionHelp").textContent="Kaydırarak pozisyonu incele. Karar senin.";
       document.getElementById("fieldHint").textContent="PAS ANI / 00:01.2";
     }
   };
   frameRAF=requestAnimationFrame(animate);
  }
  function cancelFx(){
   clearTimeout(previewTimer);clearTimeout(fxTimer);
   if(frameRAF!==null){cancelAnimationFrame(frameRAF);frameRAF=null;}
   previewing=false;
  }
  function coachFigure(){
   return `<svg viewBox="0 0 42 52" width="35" height="43" focusable="false">
   <circle cx="20" cy="10" r="7" fill="#d9c4a9" stroke="#443f38" stroke-width="1.3"/>
   <path d="M13 8Q17 -1 24 4Q29 6 27 11L24 7L14 9Z" fill="#343c3c"/>
   <path d="M13 21L27 21L32 43L10 43Z" fill="var(--shirt)" stroke="#37463b" stroke-width="1.3"/>
   <path d="M13 25L4 37M27 25L36 33" stroke="#42433e" stroke-width="4" stroke-linecap="round"/>
   <path d="M16 43L15 50M26 43L28 50" stroke="#434741" stroke-width="4" stroke-linecap="round"/></svg>`;
  }
  function crowdReact(whistle,hit){
   const attacker=attackingSide();
   for(let i=0;i<2;i++){
     const isAttacking=i===attacker,joy=whistle?!isAttacking:isAttacking;
     document.getElementById('manager-'+i).dataset.mood=joy?'joy':'angry';
     const line=joy?(whistle?'Kulübe rahatladı. Eli havada.':'Kulübe sahaya fırladı.'):(whistle?'Gol iptal. Çizgiye itiraz ediyor.':'Dördüncü hakeme itiraz ediyor.');
     document.getElementById('coach-'+i).textContent=!hit&&!joy?'VAR ekranını işaret ediyor.':line;
     document.getElementById('stand-'+i).dataset.mood=joy?'joy':'angry';
     document.getElementById('fans-'+i).textContent=joy?(whistle?'ALKIŞ!':'GOOOL!'):(whistle?'İTİRAZ!':'ISLIKLAR');
   }
  }
  function setFrame(n,fromAnimation=false){
   const t=Math.max(0,Math.min(100,Number(n)||0)),offset=t-55;
   currentFrame=t;
   const input=document.getElementById("scrub");
   if(input){input.value=String(t);input.style.setProperty("--progress",t+"%");}
   const move=(id,x,y)=>{const obj=document.getElementById(id);if(obj)obj.setAttribute("transform",`translate(${x.toFixed(1)} ${y.toFixed(1)})`);};
   const ax=X(selectedX),bx=X(scenario.ball);
   move("attacker",ax+offset*1.12,160-offset*.22);
   move("passer",bx+offset*.35,236+offset*.25);
   opponents().forEach((p,i)=>move("def-"+i,X(p.x)+offset*(i===0?.32:.15),p.y+offset*(i===1?.10:-.06)));
   const supports=[
    {x:X(Math.max(23,scenario.ball-13)),y:118,s:.38},
    {x:X(Math.max(25,scenario.ball-6)),y:340,s:.30},
    {x:X(Math.min(91,scenario.def+7)),y:348,s:.18},
    {x:X(Math.max(10,scenario.def-25)),y:230,s:.25},
    {x:X(Math.max(12,scenario.ball-23)),y:185,s:.34}
   ];
   supports.forEach((p,i)=>move("support-"+i,p.x+offset*p.s,p.y+Math.sin(t/24+i)*8));
   const passStart=bx+15,flight=Math.min(1,Math.max(0,(t-55)/35));
   const ballX=(bx+offset*.35)+15+(ax-bx-15)*flight;
   const ballY=256+offset*.25+(-96)*flight-24*Math.sin(Math.PI*flight);
   move("ball",ballX,ballY);
   const shadow=document.getElementById("ballShadow");
   if(shadow){shadow.setAttribute("cx",ballX);shadow.setAttribute("cy",Math.max(160,ballY+9));}
   if(!fromAnimation){
     const atPass=Math.abs(t-55)<=5,help=document.getElementById("decisionHelp");
     if(help)help.textContent=atPass?"Pas anı. Karar verebilirsin.":"Pas anını bul veya PAS ANI düğmesine bas.";
     const label=document.getElementById("fieldHint");
     if(label)label.textContent=atPass?"PAS ANI / DONDURULDU":"YAVAŞ TEKRAR / "+String((t*.023).toFixed(1))+" SN";
     updateChoiceButtons(atPass);
   }
  }
  function setReviewEnabled(on){
   ["replay","backFrame","aheadFrame","passFrame","scrub"].forEach(id=>{const e=document.getElementById(id);if(e)e.disabled=!on;});
   const line=document.getElementById("line");
   if(line)line.disabled=!on||linesUsed>=2||guideOpen;
   if(on)updateChoiceButtons(Math.abs(currentFrame-55)<=5);
  }
  function updateChoiceButtons(ready){
   ["off","on"].forEach(id=>{const e=document.getElementById(id);if(e)e.disabled=previewing||answered||!ready;});
  }
  intro();
})();</script></body></html><script src="/share-kit.js?v=1" defer></script>
