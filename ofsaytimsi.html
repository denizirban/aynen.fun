<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafaf8"><meta name="description" content="Ofsaytımsı. Pozisyonu sen çiz, kararını ver. Türk futbolunun en tarafsız oyunu."><title>Ofsaytımsı — aynen.fun</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#242823;--muted:#889287;--line:#dfe5db;--paper:#fafaf8;--pitch:#e4ecdf;--dark:#385b3b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',Arial,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #719b76;outline-offset:3px}button:disabled{cursor:default;opacity:.42}.page{max-width:1020px;margin:auto;padding:19px 24px 24px;min-height:100svh;display:flex;flex-direction:column}.nav{display:flex;align-items:center;justify-content:space-between;font:500 11px 'DM Mono',monospace}.nav a{color:inherit;text-decoration:none}.nav span{color:#95a095}.intro{margin:32px 0 22px}.intro h1{font-size:clamp(49px,8vw,87px);line-height:.98;letter-spacing:-.095em;margin:0}.intro p{color:#828d80;margin:12px 0 0;font-size:13px}.shell{border:1px solid var(--line);background:white;border-radius:12px;overflow:hidden}.scorebar{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 20px;border-bottom:1px solid var(--line)}.scorebar .k{font:500 10px 'DM Mono',monospace;color:#879387}.scorebar strong{font-size:23px;letter-spacing:-.05em}.club{display:flex;align-items:center;gap:8px}.club i{display:inline-block;width:10px;height:22px;border-radius:2px;background:linear-gradient(90deg,#ffd33d 50%,#ad2533 50%)}.club.fb i{background:linear-gradient(90deg,#f6d835 50%,#182c60 50%)}.center{font:500 10px 'DM Mono',monospace;color:#879387;text-align:center}.pitch-wrap{padding:13px 18px 0}.pitch{display:block;width:100%;max-height:415px;aspect-ratio:900/420;touch-action:none;user-select:none;cursor:crosshair;border-radius:7px;background:var(--pitch)}.pitch text{pointer-events:none;font-family:'DM Mono',monospace}.hint{display:flex;justify-content:space-between;gap:10px;padding:10px 19px;color:#8b988a;font:400 10px 'DM Mono',monospace}.controls{border-top:1px solid var(--line);padding:20px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:15px}.question{font-size:clamp(18px,2.9vw,29px);font-weight:650;letter-spacing:-.04em;line-height:1.18}.micro{font:400 10px/1.5 'DM Mono',monospace;color:#8b978b;margin-top:8px}.decisions{display:flex;gap:8px}.decisions button,.bottom-actions button,.sidebtn{padding:13px 16px;border:1px solid #d9e1d6;background:white;color:#334d38;border-radius:6px;font:500 11px 'DM Mono',monospace;white-space:nowrap}.decisions button:first-child{background:#28472e;color:#fff;border-color:#28472e}.verdict{display:none;padding:16px 20px 20px;border-top:1px solid var(--line)}.verdict.on{display:block}.verdict b{font-size:clamp(21px,3vw,30px);letter-spacing:-.045em}.verdict p{font-size:13px;color:#758374;line-height:1.5;margin:7px 0 13px}.verdict button{border:0;background:#2c4731;color:white;border-radius:5px;padding:11px 16px;font:500 11px 'DM Mono',monospace}.below{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;color:#94a092;font:400 10px/1.6 'DM Mono',monospace}.stage-screen{padding:34px 25px;text-align:center}.stage-screen h2{font-size:clamp(34px,6vw,58px);letter-spacing:-.07em;margin:10px 0}.stage-screen p{font-size:13px;line-height:1.65;color:#758473;max-width:440px;margin:0 auto 25px}.choose{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choose button{font:500 12px 'DM Mono',monospace;background:white;border:1px solid var(--line);border-radius:7px;padding:15px 21px;min-width:150px}.choose button:hover{background:#eef4e9}.bottom-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.footer{margin-top:auto;padding-top:24px;font:400 10px 'DM Mono',monospace;color:#a3aca2}@media(max-width:620px){.page{padding:14px 12px 20px}.intro{margin:28px 0 17px}.intro h1{font-size:clamp(48px,13vw,68px)}.intro p{font-size:12px}.scorebar{padding:12px 13px}.scorebar strong{font-size:20px}.pitch-wrap{padding:8px 8px 0}.pitch{aspect-ratio:900/510;max-height:none}.hint{padding:8px 11px;font-size:9px}.controls{padding:16px 13px;grid-template-columns:1fr}.decisions button{flex:1;padding:14px 7px}.below{font-size:9px}.verdict{padding:14px}.scorebar .k{font-size:9px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div class="page"><nav class="nav"><a href="/">← aynen.fun</a><span>FUTBOL / HAKEM AKADEMİSİ</span></nav><header class="intro"><h1>Ofsaytımsı.</h1><p>Pozisyonu sen belirle. Tartışmayı biz hallederiz.</p></header><main id="app" class="shell"></main><div class="below"><span>Oyun kurgusaldır. Kural bölümü gerçek ofsayt prensiplerine dayanır.</span><span>AYNEN.FUN</span></div><footer class="footer">KARARINIZ İNCELENMEKTEDİR. / SONSUZA KADAR</footer></div>
<script>(()=>{'use strict';
const app=document.getElementById('app');let team='GS',round=0,correct=0,selectedX=65,answered=false,scenario=null,dragging=false;
const N=8, cases=[
{def:68,attack:74,ball:29,tip:'Topun oynandığı an.',quip:'VAR odasından birinin akrabası aradı.'},
{def:76,attack:60,ball:32,tip:'Savunma çizgisine bak.',quip:'Pozisyonun 11 farklı açıdan fotoğrafı paylaşıldı.'},
{def:53,attack:49,ball:31,tip:'Kendi yarı sahanı unutma.',quip:'Yarı saha çizgisi açıklama yayınladı.'},
{def:62,attack:67,ball:38,tip:'Omuz mu? Ayak mı? Tartışma hazır.',quip:'Bir spor programı bu pozisyona üç saat ayırdı.'},
{def:73,attack:78,ball:46,tip:'Çizgiler paralel. Muhtemelen.',quip:'Çizginin kalınlığına itiraz edildi.'},
{def:61,attack:59,ball:35,tip:'Futbolcu kendi takım arkadaşından pas alıyor.',quip:'İki kulüp de kamuoyunu aydınlattı.'},
{def:82,attack:86,ball:55,tip:'Top çizginin önünde olabilir.',quip:'Psikolojik üstünlük güncellendi.'},
{def:69,attack:64,ball:44,tip:'Son pozisyon. Ülke seni bekliyor.',quip:'Maç bitti. Program yeni başladı.'}
];
function intro(){app.innerHTML='<section class="stage-screen"><div class="micro">TARAFSIZLIK TESTİ / 00</div><h2>Hangi taraf?</h2><p>Bir derbi, sekiz pozisyon, bir hakem. Önce futbolcuyu sürükle. Sonra düdüğü çal. İtiraz etmek serbest.</p><div class="choose"><button data-team="GS">🟡🔴 GALATASARAY</button><button data-team="FB">🟡🔵 FENERBAHÇE</button></div></section>';app.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{team=b.dataset.team;round=0;correct=0;next()})}
function X(v){return 35+v*8.3}function model(){return {off:selectedX>50&&selectedX>Math.max(scenario.def,scenario.ball)}}function pitch(){let dx=X(scenario.def),ax=X(selectedX),bx=X(scenario.ball);return `<svg class="pitch" id="pitch" viewBox="0 0 900 420" role="img" aria-label="Futbol sahası. Hücum oyuncusunu yatay sürükle."><rect width="900" height="420" fill="#e5eee2"/><g stroke="#f8faf6" stroke-width="2" fill="none"><rect x="18" y="17" width="864" height="386" rx="2"/><path d="M450 17V403"/><circle cx="450" cy="210" r="62"/><rect x="18" y="113" width="115" height="193"/><rect x="767" y="113" width="115" height="193"/><rect x="18" y="153" width="52" height="113"/><rect x="830" y="153" width="52" height="113"/></g><rect x="${dx}" y="17" width="${882-dx}" height="386" fill="#c0d4bd" opacity=".23"/><line x1="${dx}" y1="17" x2="${dx}" y2="403" stroke="#728e70" stroke-width="2" stroke-dasharray="7 7"/><g fill="#d9e2d3" stroke="#62796e" stroke-width="3"><circle cx="${dx}" cy="145" r="16"/><circle cx="${Math.min(dx+70,854)}" cy="245" r="16"/><circle cx="850" cy="210" r="16"/></g><g fill="${team==='GS'?'#ad2d39':'#17316b'}" stroke="#fff" stroke-width="3"><circle cx="${bx}" cy="236" r="17"/><circle id="attacker" cx="${ax}" cy="160" r="20"/></g><circle cx="${bx+15}" cy="256" r="8" fill="white" stroke="#252525" stroke-width="2"/><g fill="#37463d" font-size="11"><text x="${bx-17}" y="280">PAS</text><text id="playerLabel" x="${ax-29}" y="124">SÜRÜKLE ↔</text><text x="${dx+7}" y="33">SONDAN 2. RAKİP</text></g><path d="M${bx+18} 233L${ax-10} 175" stroke="#7d9980" stroke-width="1.8" stroke-dasharray="5 6" fill="none"/><text x="44" y="38" fill="#8ba089" font-size="11">HÜCUM →</text></svg>`}
function next(){answered=false;scenario=cases[round];selectedX=scenario.attack;paint()}
function paint(){let opponent=team==='GS'?'FB':'GS',left=team==='GS'?'GS':'FB',right=team==='GS'?'FB':'GS';app.innerHTML=`<div class="scorebar"><div class="club"><i></i><div><div class="k">${left}</div><strong>0</strong></div></div><div class="center">DERBİ / POZİSYON ${round+1}/${N}<br><br>90+${String(round+1).padStart(2,'0')}</div><div class="club fb"><div><div class="k">${right}</div><strong>0</strong></div><i></i></div></div><div class="pitch-wrap">${pitch()}</div><div class="hint"><span>● TOPUN OYNANDIĞI AN</span><span>HÜCUM SAĞA →</span></div><section class="controls"><div><div class="question">Ofsayt mı?</div><div class="micro">${scenario.tip} · Oyuncuyu sürükleyebilirsin.</div></div><div class="decisions"><button id="off">OFSAYT</button><button id="on">DEVAM</button></div></section><div id="verdict" class="verdict" aria-live="polite"></div>`;const svg=document.getElementById('pitch');svg.addEventListener('pointerdown',e=>{if(answered)return;dragging=true;svg.setPointerCapture(e.pointerId);move(e)});svg.addEventListener('pointermove',e=>{if(dragging)move(e)});svg.addEventListener('pointerup',()=>dragging=false);svg.addEventListener('pointercancel',()=>dragging=false);document.getElementById('off').onclick=()=>judge(true);document.getElementById('on').onclick=()=>judge(false)}
function move(e){const s=document.getElementById('pitch'),r=s.getBoundingClientRect();const min=Math.max(0,Math.min(100,((e.clientX-r.left)/r.width*900-35)/8.3));selectedX=Math.round(min);const attacker=document.getElementById('attacker'),lbl=document.getElementById('playerLabel');attacker.setAttribute('cx',X(selectedX));lbl.setAttribute('x',X(selectedX)-29);const path=s.querySelector('path[stroke="#7d9980"]');if(path)path.setAttribute('d','M'+(X(scenario.ball)+18)+' 233L'+(X(selectedX)-10)+' 175')}
function judge(choice){if(answered)return;answered=true;const {off}=model(),hit=choice===off;if(hit)correct++;const box=document.getElementById('verdict');box.classList.add('on');document.getElementById('off').disabled=document.getElementById('on').disabled=true;let reason=!off?'Oyuncu, topun ve sondan ikinci rakibin önünde değil (veya kendi yarı sahasında).':'Oyuncu rakip yarı sahada, toptan ve sondan ikinci rakipten ileride. Pası aldığı varsayımıyla ofsayt.';const absurd=round>=3?'<br><span class="micro">STÜDYO: '+scenario.quip+'</span>':'';box.innerHTML='<b>'+(hit?'DOĞRU KARAR.':'TARTIŞMALI KARAR.')+'</b><p>Gerçek kural: <strong>'+(off?'OFSAYT':'DEVAM')+'</strong>. '+reason+absurd+'</p><button id="continue">'+(round===N-1?'MAÇI BİTİR':'SONRAKİ POZİSYON →')+'</button>';document.getElementById('continue').onclick=()=>{round++;round===N?finish():next()}}
function finish(){const phrase=correct===N?'VAR odası sana iş başvurusu attı.':correct>=5?'Kararların iyi. Yine de kimse memnun değil.':'Tebrikler, yorumcu olmaya hazırsın.';app.innerHTML='<section class="stage-screen"><div class="micro">MAÇ SONU / RESMÎ OLMAYAN RAPOR</div><h2>'+correct+' / '+N+' doğru.</h2><p>'+phrase+'<br>İki kulüp de açıklama hazırlıyor.</p><div class="bottom-actions"><button id="again">BİR DAHA</button><button id="share">PAYLAŞ ↗</button></div></section>';document.getElementById('again').onclick=intro;document.getElementById('share').onclick=async()=>{const text='Ofsaytımsı: '+correct+'/8 doğru karar. Maç bitti, tartışma bitmedi. https://aynen.fun/ofsaytimsi.html';try{if(navigator.share)await navigator.share({text,url:'https://aynen.fun/ofsaytimsi.html'});else{await navigator.clipboard.writeText(text);document.getElementById('share').textContent='KOPYALANDI ✓'}}catch(_){}}}
intro();
})();</script></body></html>
