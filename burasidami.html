<div class="actions">
<button class="btn" id="next" type="button">Biraz bekle</button>
<button class="btn alt" id="complain" type="button">Şikâyet et</button>
</div>
<p class="notice" id="notice" role="status" aria-live="polite">Burası böyle kalsın istiyorsun.</p>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const stages=[
['Boş arsa.','Güzel yer aslında.'],
['Ölçüm yapıyorlar.','Bi bakıp çıkacaklarmış.'],
['Kazmaya başladılar.','Ne ara?'],
['Dört kat oldu.','İki kat demişlerdi.'],
['Yan bina da gitti.','O daha yeniydi.'],
['Yol kapandı.','İki haftaya açılır.'],
['Orman Life.','Orman yok.'],
['Oyun alanı da kapandı.','Burada da çalışma var.']
];
const replies=['Talebiniz alındı.','İlgili birime ilettik.','Tekrar ilettik.','İlgili birim yine ilgili.','Bir daha ilettik.','Arkadaşlar biliyor.','Not aldık.'];
let phase=0,complaints=0,started=performance.now(),toastTimer=0;
const scene=$('stage'),next=$('next'),complain=$('complain'),notice=$('notice');
function render(){
const final=phase===stages.length-1;
scene.dataset.phase=String(phase);
scene.querySelectorAll('[data-show]').forEach(el=>el.classList.toggle('visible',phase>=Number(el.dataset.show)));
scene.querySelectorAll('[data-hide]').forEach(el=>el.classList.toggle('hidden',phase>=Number(el.dataset.hide)));
$('line').textContent=stages[phase][0];$('aside').textContent=stages[phase][1];
$('round').textContent=String(phase+1).padStart(2,'0')+' / '+String(stages.length).padStart(2,'0');
$('area').textContent=phase>=7?'YEŞİL ALAN: 0 m²':phase>=3?'YEŞİL ALAN: 1 AĞAÇ':'YEŞİL ALAN: 2 AĞAÇ';
$('promise').textContent=phase>=5?'BİTİŞ: 2 HAFTAYA':phase>=1?'BİTİŞ: YAKINDA':'BİTİŞ: BELLİ DEĞİL';
$('count').textContent=complaints+' şikâyet · 0 sonuç';
$('controls').classList.toggle('done',final);
$('sceneScaffold').classList.toggle('visible',final);
next.textContent=final?'Bir daha aç':'Biraz bekle';
complain.textContent=final?'Paylaş ↗':'Şikâyet et';
notice.textContent=final?'Çıkış için de çalışma var.':phase>=5?'Geçici.':'Burası böyle kalsın istiyorsun.';
$('track').innerHTML=stages.map((_,i)=>'<i class="'+(i<=phase?'on':'')+'"></i>').join('');
}
function toast(text){
const x=$('toast');x.textContent=text;x.classList.add('show');
clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),1750);
}
function advance(isComplaint=false){
if(phase===stages.length-1){if(isComplaint){share();return}phase=0;complaints=0;started=performance.now();render();return}
if(isComplaint){toast(replies[complaints%replies.length]);complaints++}
phase=Math.min(stages.length-1,phase+1);
render();
}
function share(){
const text=complaints+' şikâyet. 0 m² yeşil alan. Burası da mı?';
const url=location.origin+'/burasidami.html';
if(navigator.share){navigator.share({title:'Burası da mı? — aynen.fun',text,url}).catch(()=>{});return}
if(navigator.clipboard){navigator.clipboard.writeText(text+' '+url).then(()=>toast('Kopyalandı.')).catch(()=>toast('Kopyalanamadı.'));return}
window.prompt('Paylaş:',text+' '+url);
}
next.addEventListener('click',()=>advance(false));
complain.addEventListener('click',()=>advance(true));
render();
})();
</script>
