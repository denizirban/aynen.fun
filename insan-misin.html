<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4"><meta name="description" content="İnsan mısın? Türkiye usulü 8 tuhaf CAPTCHA. İnsan olduğunu kanıtlamak sandığından zor. aynen.fun">
<title>İnsan mısın? — aynen.fun</title>
<style>
:root{--bg:#f6f6f3;--ink:#171918;--sub:#737875;--line:#dedfdb;--blue:#285bd7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.shell{max-width:980px;margin:auto;min-height:100dvh;padding:22px 26px;display:flex;flex-direction:column}.nav{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px;font:11px ui-monospace,monospace;letter-spacing:.03em}.nav a{text-decoration:none;color:inherit}.nav span{color:var(--sub)}
.title{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:28px 0 23px}.title h1{font-size:clamp(44px,7.5vw,82px);letter-spacing:-.09em;line-height:.95;margin:0;font-weight:800}.title p{max-width:220px;color:var(--sub);font-size:12px;line-height:1.6;margin:0}
.panel{background:#fff;border:1px solid #292c29;box-shadow:8px 8px 0 #e7e8e3;flex:1;min-height:520px;display:flex;flex-direction:column}.hud{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:16px 20px;font:11px ui-monospace,monospace;letter-spacing:.04em}.hud .progress{color:var(--blue);font-weight:700}.hud .detail{color:var(--sub)}.track{height:3px;background:#eff0ed}.track i{display:block;width:0;height:100%;background:var(--blue);transition:width .45s ease}
.content{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;flex:1;padding:30px 24px;animation:fade .32s ease both}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.13em;color:var(--blue);margin-bottom:16px}.question{font-size:clamp(28px,4.8vw,51px);font-weight:800;line-height:1.04;letter-spacing:-.068em;max-width:690px;margin:0 auto 15px;text-wrap:balance}.help{color:var(--sub);font-size:14px;line-height:1.6;max-width:490px;margin:0 auto 25px}.zone{width:min(100%,550px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;min-height:100px}.result-msg{min-height:22px;margin:13px 0 0;font:12px ui-monospace,monospace;color:var(--blue)}
.btn{border:1px solid var(--ink);background:var(--ink);color:white;padding:14px 21px;min-height:48px;font-size:13px;font-weight:700;transition:background .15s}.btn:hover{background:var(--blue);border-color:var(--blue)}.btn.outline{background:#fff;color:var(--ink)}.btn.outline:hover{background:#f0f2f7}
.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:min(460px,100%);gap:9px}.choicegrid button{min-height:77px;border:1px solid #d1d4d0;background:#fbfbfa;font-weight:700;font-size:15px;color:var(--ink);padding:12px;transition:background .15s,border-color .15s}.choicegrid button:hover{border-color:var(--blue);background:#f0f4ff}.choicegrid button:disabled{opacity:.5;cursor:default}
.check{width:min(390px,100%);padding:23px;display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid #cfd3d0;box-shadow:0 2px 10px #0000000b}.check label{display:flex;align-items:center;gap:14px;cursor:pointer;font-size:17px}.check input{width:27px;height:27px;accent-color:var(--blue)}.captcha-brand{text-align:right;color:#a0a5a2;font-size:10px}.captcha-brand strong{display:block;font-size:18px;color:#7392ad}
.queue-meter{width:min(350px,100%);height:6px;background:#e9ece8;border-radius:10px;overflow:hidden}.queue-meter i{display:block;width:0;height:100%;background:var(--blue)}.note{font:11px ui-monospace,monospace;color:var(--sub)}
.badge{font-size:clamp(75px,12vw,120px);font-weight:900;line-height:1;letter-spacing:-.08em;color:var(--blue)}.endline{font-size:clamp(22px,4vw,36px);font-weight:800;letter-spacing:-.055em;line-height:1.15}.final-note{max-width:450px;color:var(--sub);font-size:13px;line-height:1.7}
.foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;gap:12px;font:10px ui-monospace,monospace;color:#969b96}
@keyframes fade{from{opacity:.4;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(max-width:640px){.shell{padding:12px 12px 18px}.title{display:block;padding:24px 0 18px}.title h1{font-size:49px}.title p{margin-top:9px;max-width:100%}.panel{min-height:calc(100dvh - 193px);box-shadow:4px 4px 0 #e7e8e3}.hud{padding:13px}.content{padding:22px 14px}.question{font-size:clamp(28px,8vw,39px)}.help{font-size:13px;margin-bottom:18px}.choicegrid{gap:7px}.choicegrid button{font-size:13px;min-height:66px}.foot{padding:12px;font-size:9px}.check{padding:15px}.check label{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><div class="shell"><nav class="nav"><a href="/">← aynen.fun</a><span>İNSAN DOĞRULAMA SİSTEMİ / TR</span></nav><header class="title"><h1>İnsan mısın?</h1><p>İnsan ve makine arasındaki sınır üzerine sekiz kısa deney.</p></header>
<main class="panel"><div><div class="hud"><span class="progress" id="level">DOĞRULAMA / BAŞLANGIÇ</span><span class="detail" id="detail">İNSANLIK ORANI: %0</span></div><div class="track"><i id="track"></i></div></div><section class="content" id="content" aria-live="polite"></section><footer class="foot"><span>BU BİR OYUNDUR. GERÇEK KİMLİK DOĞRULAMASI YAPMAZ.</span><span id="footerState">AYNEN.FUN / CAPTCHA-TR</span></footer></main></div>
<script>
(function(){
'use strict';
var steps=['check','intent','trust','ambiguity','memory','correction','silence','boundary'];
var i=0,done=false,timer=null,raf=0,started=0,answers=[],reaction=[],selectedSide='',scenarioOrder=[];
var $=x=>document.getElementById(x),content=$('content'),lv=$('level'),dt=$('detail'),bar=$('track');
function clean(){if(timer)clearTimeout(timer);timer=null;if(raf)cancelAnimationFrame(raf);raf=0}
function ui(k,q,h,b){content.style.animation='none';void content.offsetWidth;content.style.animation='';content.innerHTML='<div class="eyebrow">'+k+'</div><h2 class="question">'+q+'</h2><p class="help">'+h+'</p><div class="zone" id="zone">'+b+'</div><p class="result-msg" id="msg" role="status"></p>'}
function say(t){let e=$('msg');if(e)e.textContent=t}
function button(t,fn,outline){let b=document.createElement('button');b.className='btn'+(outline?' outline':'');b.textContent=t;b.onclick=fn;return b}
function next(){clean();i++;if(i>=steps.length)end();else show()}
function record(key,value,feedback){answers.push({key,value,ms:Math.round(performance.now()-started)});say(feedback||'Kaydedildi.');content.querySelectorAll('button,input').forEach(x=>x.disabled=true);timer=setTimeout(next,760)}
function choices(list,key){let z=$('zone');z.innerHTML='<div class="choicegrid">'+list.map((x,n)=>'<button type="button" data-n="'+n+'">'+x[0]+'</button>').join('')+'</div>';z.querySelectorAll('button').forEach(b=>b.onclick=()=>{let x=list[+b.dataset.n];record(key,x[1],x[2])})}
function show(){clean();lv.textContent='DOĞRULAMA '+String(i+1).padStart(2,'0')+' / 08';dt.textContent='TAMAMLANDI: %'+Math.round(i/8*100);bar.style.width=i/8*100+'%';$('footerState').textContent='YANIT: '+answers.length;started=performance.now();switch(steps[i]){
case 'check':
ui('01 / ÖN KONTROL','Ben robot değilim.','Devam etmek için işaretle.','<div class="check"><label><input type="checkbox" id="human"> Ben robot değilim</label><div class="captcha-brand"><strong>▦</strong>aynenCAPTCHA</div></div>');$('human').onchange=()=>record('check','yes','');break;
case 'intent':
ui('02 / BAĞLAM','“Kapı açık.”','Birisi bunu sana söyledi. Kapının hemen yanındasın.','');
choices([['Kapatırım.','inferred',''],['“Evet, açık.” derim.','literal',''],['“Kapatayım mı?” diye sorarım.','clarify',''],['Bir şey yapmam.','none','']],'intent');break;
case 'trust':
ui('03 / GÜVEN','Arkadaşın: “Beş dakikaya oradayım.”','Bu arkadaşın genellikle geç kalıyor. Ne yaparsın?','');
choices([['Beş dakika beklerim.','literal',''],['Biraz daha süreceğini varsayarım.','inferred',''],['Konum atmasını isterim.','verify',''],['Yola çıkmam.','wait','']],'trust');break;
case 'ambiguity':
ui('04 / EKSİK BİLGİ','“Her zamankinden al.”','Bir arkadaşın marketten bir şey istiyor. Ne aldığını bilmiyorsun.','');
choices([['Ne olduğunu sorarım.','clarify',''],['En çok satılan ürünü alırım.','guess',''],['Bir şey almam.','none',''],['Rastgele bir ürün alırım.','random','']],'ambiguity');break;
case 'memory':
selectedSide=Math.random()<.5?'left':'right';ui('05 / DİKKAT','Birini seç.','Seçim için herhangi bir ölçüt verilmedi.','<div class="choicegrid"><button id="left">SOL</button><button id="right">SAĞ</button></div>');$('left').onclick=()=>record('side','left','');$('right').onclick=()=>record('side','right','');break;
case 'correction':
ui('06 / BELLEK','Az önce hangisini seçtin?','Bu aşama bir önceki yanıtınla karşılaştırılacak.','');
choices([['SOL','left',''],['SAĞ','right',''],['Hatırlamıyorum.','unknown',''],['Emin değilim.','unsure','']],'recall');break;
case 'silence':
ui('07 / TALİMAT','Hiçbir şey yapma.','Beş saniye sonra otomatik olarak devam edecek.','<div class="queue-meter"><i id="queueFill"></i></div><div class="note">BEKLENİYOR</div>');
function wait(t){if(i!==6||done)return;let p=Math.min(100,(t-started)/5000*100);$('queueFill').style.width=p+'%';if(p>=100){record('silence','wait','');return}raf=requestAnimationFrame(wait)}raf=requestAnimationFrame(wait);break;
case 'boundary':
ui('08 / SINIR','İnsan olduğunu kanıtladın mı?','Bir yanıt seç.','');
choices([['Evet.','yes',''],['Hayır.','no',''],['Bilmiyorum.','unknown',''],['Bu testle kanıtlanamaz.','limit','']],'boundary');break;
}}
function end(){if(done)return;done=true;clean();bar.style.width='100%';lv.textContent='TEST TAMAMLANDI';dt.textContent='RAPOR';let get=k=>answers.find(x=>x.key===k),recall=get('recall'),side=get('side'),match=recall&&side&&recall.value===side.value;let inferred=['intent','trust','ambiguity'].filter(k=>{let a=get(k);return a&&['inferred','clarify','verify'].includes(a.value)}).length;let status=inferred>=2?'BAĞLAMI YORUMLADIN':inferred===1?'BAĞLAMI KISMEN YORUMLADIN':'KELİMELERİ İZLEDİN';let detail=match?'Önceki seçimini hatırladın.':recall&&['unknown','unsure'].includes(recall.value)?'Emin olmadığında bunu belirttin.':'Önceki seçiminle farklı yanıt verdin.';ui('DOĞRULAMA RAPORU','Sonuç: Belirsiz.','İnsan ile makineyi yalnızca bu yanıtlarla ayırmak mümkün değil.','<div class="badge">?</div><div class="endline">'+status+'</div><p class="final-note">'+detail+'<br>8 aşama tamamlandı. Bu bir oyun, gerçek kimlik doğrulaması değil.</p>');let z=$('zone');z.appendChild(button('YENİDEN DENE ↻',()=>{i=0;done=false;answers=[];show()}));z.appendChild(button('SONUCU PAYLAŞ ↗',async()=>{let t='İnsan mısın? Sonuç: Belirsiz. '+status+'. Sen dene.';try{if(navigator.share)await navigator.share({title:'İnsan mısın? — aynen.fun',text:t,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(t+' '+location.href);say('Bağlantı kopyalandı.')}else prompt('Paylaş:',t+' '+location.href)}catch(e){}}));}

show();
})();
</script></body></html>
