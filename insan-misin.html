<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4"><meta name="description" content="İnsan mısın? Davranışlarını analiz eden adaptif bir ters CAPTCHA. İnsan davranışı şüpheli sayılıyor. aynen.fun">
<title>İnsan mısın? — aynen.fun</title>
<style>
:root{--bg:#f6f6f3;--ink:#171918;--sub:#737875;--line:#dedfdb;--blue:#285bd7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.shell{max-width:980px;margin:auto;min-height:100dvh;padding:22px 26px;display:flex;flex-direction:column}.nav{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px;font:11px ui-monospace,monospace;letter-spacing:.03em}.nav a{text-decoration:none;color:inherit}.nav span{color:var(--sub)}
.title{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:28px 0 23px}.title h1{font-size:clamp(44px,7.5vw,82px);letter-spacing:-.09em;line-height:.95;margin:0;font-weight:800}.title p{max-width:220px;color:var(--sub);font-size:12px;line-height:1.6;margin:0}
.panel{background:#fff;border:1px solid #292c29;box-shadow:8px 8px 0 #e7e8e3;flex:1;min-height:520px;display:flex;flex-direction:column}.hud{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:16px 20px;font:11px ui-monospace,monospace;letter-spacing:.04em}.hud .progress{color:var(--blue);font-weight:700}.hud .detail{color:var(--sub)}.track{height:3px;background:#eff0ed}.track i{display:block;width:0;height:100%;background:var(--blue);transition:width .45s ease}
.content{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;flex:1;padding:30px 24px;animation:fade .32s ease both}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.13em;color:var(--blue);margin-bottom:16px}.question{font-size:clamp(28px,4.8vw,51px);font-weight:800;line-height:1.04;letter-spacing:-.068em;max-width:690px;margin:0 auto 15px;text-wrap:balance}.help{color:var(--sub);font-size:14px;line-height:1.6;max-width:490px;margin:0 auto 25px}.zone{width:min(100%,550px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;min-height:100px}.result-msg{min-height:22px;margin:13px 0 0;font:12px ui-monospace,monospace;color:var(--blue)}
.btn{border:1px solid var(--ink);background:var(--ink);color:white;padding:14px 21px;min-height:48px;font-size:13px;font-weight:700;transition:background .15s}.btn:hover{background:var(--blue);border-color:var(--blue)}.btn.outline{background:#fff;color:var(--ink)}.btn.outline:hover{background:#f0f2f7}
.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:min(460px,100%);gap:9px}.choicegrid button{min-height:77px;border:1px solid #d1d4d0;background:#fbfbfa;font-weight:700;font-size:15px;color:var(--ink);padding:12px;transition:background .15s,border-color .15s}.choicegrid button:hover{border-color:var(--blue);background:#f0f4ff}.choicegrid button:disabled{opacity:.5;cursor:default}
.check{width:min(390px,100%);padding:23px;display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid #cfd3d0;box-shadow:0 2px 10px #0000000b}.check label{display:flex;align-items:center;gap:14px;cursor:pointer;font-size:17px}.check input{width:27px;height:27px;accent-color:var(--blue)}.captcha-brand{text-align:right;color:#a0a5a2;font-size:10px}.captcha-brand strong{display:block;font-size:18px;color:#7392ad}
.queue-meter{width:min(350px,100%);height:6px;background:#e9ece8;border-radius:10px;overflow:hidden}.queue-meter i{display:block;width:0;height:100%;background:var(--blue)}.note{font:11px ui-monospace,monospace;color:var(--sub)}
.badge{font-size:clamp(75px,12vw,120px);font-weight:900;line-height:1;letter-spacing:-.08em;color:var(--blue)}.endline{font-size:clamp(22px,4vw,36px);font-weight:800;letter-spacing:-.055em;line-height:1.15}.final-note{max-width:450px;color:var(--sub);font-size:13px;line-height:1.7}
.foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;gap:12px;font:10px ui-monospace,monospace;color:#969b96}
@keyframes fade{from{opacity:.4;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(max-width:640px){.shell{padding:12px 12px 18px}.title{display:block;padding:24px 0 18px}.title h1{font-size:49px}.title p{margin-top:9px;max-width:100%}.panel{min-height:calc(100dvh - 193px);box-shadow:4px 4px 0 #e7e8e3}.hud{padding:13px}.content{padding:22px 14px}.question{font-size:clamp(28px,8vw,39px)}.help{font-size:13px;margin-bottom:18px}.choicegrid{gap:7px}.choicegrid button{font-size:13px;min-height:66px}.foot{padding:12px;font-size:9px}.check{padding:15px}.check label{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ROBOT-FIRST GAME */
.title h1{letter-spacing:-.085em}
.panel{min-height:480px}
.content{padding:26px 24px}
.zone{gap:15px}
.choicegrid{width:min(520px,100%)}
.choicegrid button{text-align:left;font-weight:600;line-height:1.32;min-height:76px}
.choicegrid button:active{transform:translateY(1px)}
.tag{display:inline-flex;gap:8px;align-items:center;font:10px ui-monospace,monospace;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
.probe{width:min(500px,100%);border:1px solid #d3d8d4;padding:19px;background:#f8f9f7}
.probe .micro{font:10px ui-monospace,monospace;color:var(--sub);letter-spacing:.07em;margin-bottom:14px}
.probe-word{font-size:clamp(32px,6vw,54px);font-weight:800;letter-spacing:-.07em}
.probe-word.blue{color:#285bd7}
.hold{width:min(340px,100%);height:88px;touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid #171918;background:#171918;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.03em}
.hold:active,.hold.held{background:#285bd7;border-color:#285bd7}
.holdbar{height:5px;width:min(340px,100%);background:#e7e9e6;overflow:hidden}
.holdbar i{width:0;height:100%;display:block;background:#285bd7}
.monoread{font:12px ui-monospace,monospace;color:#444b48;line-height:1.5}
.captcha-card{width:min(410px,100%);border:1px solid #cfd3d0;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 20px;text-align:left}
.captcha-card .check-text{font-size:15px;font-weight:600}
.captcha-card button{background:#fff;border:1px solid #b6bbb7;padding:14px 16px;min-height:54px;font-size:13px;font-weight:700;text-align:left}
.captcha-card button:hover{border-color:var(--blue);background:#f2f5fc}
.captcha-brand{text-align:center;min-width:60px}
.captcha-brand strong{font-size:26px}
.formbox{width:min(500px,100%);display:flex;gap:8px}
.formbox input{border:1px solid #c5cac6;background:#fff;min-width:0;flex:1;min-height:49px;padding:12px;font-size:15px;border-radius:0}
.formbox .btn{white-space:nowrap}
.report{width:min(500px,100%);text-align:left;border-top:1px solid var(--line);padding-top:15px;margin-top:4px}
.report-item{display:flex;gap:12px;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0;font-size:12px;line-height:1.4}
.report-item span:first-child{color:#747a76}
.report-item span:last-child{text-align:right;max-width:65%;font-weight:700}
.results{display:flex;align-items:center;flex-direction:column;gap:12px;width:100%}
.result-code{font:700 clamp(65px,12vw,115px) Arial,sans-serif;letter-spacing:-.11em;line-height:1;color:#285bd7}
.result-code.ok{color:#171918}
.result-label{font-weight:800;font-size:clamp(20px,3.4vw,29px);letter-spacing:-.06em}
.result-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.result-msg{line-height:1.5;max-width:550px}
.eyebrow{margin-bottom:12px}
@media(max-width:640px){.panel{min-height:calc(100dvh - 193px)}.content{padding:19px 15px}.choicegrid button{min-height:70px}.captcha-card{padding:13px;gap:9px}.captcha-card .check-text{font-size:13px}.formbox{flex-direction:column}.title h1{font-size:clamp(45px,11vw,57px)}.question{font-size:clamp(26px,7.5vw,38px)}}


/* ADAPTIVE CAPTCHA V3 */
.panel{min-height:520px}.content{padding:24px 23px}.zone{min-height:128px;gap:13px}.question{max-width:750px}
.choicegrid{width:min(520px,100%);gap:9px}.choicegrid button{text-align:left;line-height:1.35;font-size:14px;padding:15px;min-height:74px;font-weight:600}
.choicegrid button:hover{transform:translateY(-1px)}
.statusline{font:11px ui-monospace,monospace;color:var(--sub);letter-spacing:.045em}
.scanner{width:min(510px,100%);border:1px solid #d4d8d4;background:#fbfcfa;padding:17px}
.scanner canvas{display:block;width:100%;height:auto;aspect-ratio:520 / 210;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.probe-note{font:11px ui-monospace,monospace;color:#626b65;line-height:1.55}
.scanner-status{min-height:16px;margin-top:9px;color:#4a534e;font:11px ui-monospace,monospace}
.strong-word{font:800 clamp(30px,5.5vw,50px) Arial,sans-serif;letter-spacing:-.055em}
.hold-v3{width:min(360px,100%);min-height:90px;border:1px solid #191b19;background:#191b19;color:white;font-weight:800;font-size:17px;touch-action:none;user-select:none;-webkit-user-select:none}
.hold-v3.held{background:var(--blue);border-color:var(--blue)}
.holdtrack{width:min(360px,100%);height:6px;background:#e9eae8;overflow:hidden}.holdtrack i{display:block;height:100%;width:0;background:var(--blue)}
.memcard{border:1px solid #cdd2ce;background:#fbfcfa;padding:24px 14px;min-width:min(100%,360px);text-align:center}
.memcard strong{font:700 clamp(24px,4.6vw,34px) ui-monospace,monospace;letter-spacing:.08em}
.modehint{font:10px ui-monospace,monospace;color:#777f79;letter-spacing:.08em}
.taskbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;width:100%}
.formbox{display:flex;width:min(490px,100%);gap:9px}.formbox input{flex:1;min-width:0;background:#fff;border:1px solid #c5cbc7;border-radius:0;padding:12px;font-size:13px;font-family:ui-monospace,monospace;min-height:50px}
.probe{width:min(500px,100%);padding:18px;border:1px solid #cfd4d0;background:#fafbfa}
.probe .micro{color:#747c76;font:10px ui-monospace,monospace;margin-bottom:14px;letter-spacing:.08em}
.end-results{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:550px}
.end-code{font:800 clamp(70px,14vw,110px) Arial,sans-serif;line-height:.95;letter-spacing:-.1em;color:var(--blue)}
.end-title{font-size:clamp(20px,3.5vw,28px);line-height:1.15;font-weight:800;letter-spacing:-.045em}
.end-sub{font-size:13px;max-width:460px;line-height:1.55;color:#717b73}
.report{width:100%;margin-top:10px;border-top:1px solid #dfe2de;padding-top:5px;text-align:left}
.report-row{padding:10px 2px;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;border-bottom:1px solid #e8eae7;font-size:12px;line-height:1.4}
.report-row span:first-child{color:#777e78;white-space:nowrap}
.report-row span:last-child{text-align:right;font-weight:600}
.btn.alt{background:#fff;color:#171918}.btn.alt:hover{background:#f0f4ff}
.final-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:13px}
.result-msg{max-width:580px;line-height:1.45;min-height:22px}
@media(max-width:640px){.content{padding:20px 14px}.choicegrid button{min-height:70px;font-size:13px;padding:11px}.scanner{padding:10px}.memcard{min-width:0;width:min(100%,350px)}.formbox{flex-direction:column}.formbox .btn{width:100%}.title h1{font-size:clamp(46px,11vw,59px)}.report-row{font-size:11px}.end-code{font-size:76px}}
