<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>İnsan mısın? — aynen.fun</title>
<style>
:root{--bg:#f6f6f3;--ink:#171918;--sub:#737875;--line:#dedfdb;--blue:#285bd7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.shell{max-width:980px;margin:auto;min-height:100dvh;padding:22px 26px;display:flex;flex-direction:column}.nav{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px;font:11px ui-monospace,monospace;letter-spacing:.03em}.nav a{text-decoration:none;color:inherit}.nav span{color:var(--sub)}
.title{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:28px 0 23px}.title h1{font-size:clamp(44px,7.5vw,82px);letter-spacing:-.09em;line-height:.95;margin:0;font-weight:800}.title p{max-width:220px;color:var(--sub);font-size:12px;line-height:1.6;margin:0}
.panel{background:#fff;border:1px solid #292c29;box-shadow:8px 8px 0 #e7e8e3;flex:1;min-height:520px;display:flex;flex-direction:column}.hud{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:16px 20px;font:11px ui-monospace,monospace;letter-spacing:.04em}.hud .progress{color:var(--blue);font-weight:700}.hud .detail{color:var(--sub)}.track{height:3px;background:#eff0ed}.track i{display:block;width:0;height:100%;background:var(--blue);transition:width .45s ease}
.content{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;flex:1;padding:30px 24px;animation:fade .32s ease both}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.13em;color:var(--blue);margin-bottom:16px}.question{font-size:clamp(28px,4.8vw,51px);font-weight:800;line-height:1.04;letter-spacing:-.068em;max-width:690px;margin:0 auto 15px;text-wrap:balance}.help{color:var(--sub);font-size:14px;line-height:1.6;max-width:490px;margin:0 auto 25px}.zone{width:min(100%,550px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;min-height:100px}.result-msg{min-height:22px;margin:13px 0 0;font:12px ui-monospace,monospace;color:var(--blue)}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ROBOT-FIRST GAME */
.title h1{letter-spacing:-.085em}
.panel{min-height:480px}
.content{padding:26px 24px}
.zone{gap:15px}
.choicegrid{width:min(520px,100%)}
.choicegrid button{text-align:left;font-weight:600;line-height:1.32;min-height:76px}

.tag{display:inline-flex;gap:8px;align-items:center;font:10px ui-monospace,monospace;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
.probe{width:min(500px,100%);border:1px solid #d3d8d4;padding:19px;background:#f8f9f7}

.hold:active,.hold.held{background:#285bd7;border-color:#285bd7}
.holdbar{height:5px;width:min(340px,100%);background:#e7e9e6;overflow:hidden}

.captcha-card button:hover{border-color:var(--blue);background:#f2f5fc}
.captcha-brand{text-align:center;min-width:60px}
.captcha-brand strong{font-size:26px}
.formbox{width:min(500px,100%);display:flex;gap:8px}
.formbox input{border:1px solid #c5cac6;background:#fff;min-width:0;flex:1;min-height:49px;padding:12px;font-size:15px;border-radius:0}
.formbox .btn{white-space:nowrap}
.report{width:min(500px,100%);text-align:left;border-top:1px solid var(--line);padding-top:15px;margin-top:4px}
.report-item{display:flex;gap:12px;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0;font-size:12px;line-height:1.4}
.report-item span:first-child{color:#747a76}
.report-item span:last-child{text-align:right;max-width:65%;font-weight:700}
.results{display:flex;align-items:center;flex-direction:column;gap:12px;width:100%}
.result-code{font:700 clamp(65px,12vw,115px) Arial,sans-serif;letter-spacing:-.11em;line-height:1;color:#285bd7}
.result-code.ok{color:#171918}
.result-label{font-weight:800;font-size:clamp(20px,3.4vw,29px);letter-spacing:-.06em}
.result-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.result-msg{line-height:1.5;max-width:550px}
.eyebrow{margin-bottom:12px}
@media(max-width:640px){.panel{min-height:calc(100dvh - 193px)}.content{padding:19px 15px}.choicegrid button{min-height:70px}.captcha-card{padding:13px;gap:9px}.captcha-card .check-text{font-size:13px}.formbox{flex-direction:column}.title h1{font-size:clamp(45px,11vw,57px)}.question{font-size:clamp(26px,7.5vw,38px)}}


/* ADAPTIVE CAPTCHA V3 */
.panel{min-height:520px}.content{padding:24px 23px}.zone{min-height:128px;gap:13px}.question{max-width:750px}
.choicegrid{width:min(520px,100%);gap:9px}.choicegrid button{text-align:left;line-height:1.35;font-size:14px;padding:15px;min-height:74px;font-weight:600}

.statusline{font:11px ui-monospace,monospace;color:var(--sub);letter-spacing:.045em}

.probe-note{font:11px ui-monospace,monospace;color:#626b65;line-height:1.55}
.scanner-status{min-height:16px;margin-top:9px;color:#4a534e;font:11px ui-monospace,monospace}
.strong-word{font:800 clamp(30px,5.5vw,50px) Arial,sans-serif;letter-spacing:-.055em}
.hold-v3{width:min(360px,100%);min-height:90px;border:1px solid #191b19;background:#191b19;color:white;font-weight:800;font-size:17px;touch-action:none;user-select:none;-webkit-user-select:none}
.hold-v3.held{background:var(--blue);border-color:var(--blue)}
.holdtrack{width:min(360px,100%);height:6px;background:#e9eae8;overflow:hidden}.holdtrack i{display:block;height:100%;width:0;background:var(--blue)}
.memcard{border:1px solid #cdd2ce;background:#fbfcfa;padding:24px 14px;min-width:min(100%,360px);text-align:center}
.memcard strong{font:700 clamp(24px,4.6vw,34px) ui-monospace,monospace;letter-spacing:.08em}
.modehint{font:10px ui-monospace,monospace;color:#777f79;letter-spacing:.08em}
.taskbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;width:100%}
.formbox{display:flex;width:min(490px,100%);gap:9px}.formbox input{flex:1;min-width:0;background:#fff;border:1px solid #c5cbc7;border-radius:0;padding:12px;font-size:13px;font-family:ui-monospace,monospace;min-height:50px}
.probe{width:min(500px,100%);padding:18px;border:1px solid #cfd4d0;background:#fafbfa}
.probe .micro{color:#747c76;font:10px ui-monospace,monospace;margin-bottom:14px;letter-spacing:.08em}
.end-results{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:550px}
.end-code{font:800 clamp(70px,14vw,110px) Arial,sans-serif;line-height:.95;letter-spacing:-.1em;color:var(--blue)}

.end-sub{font-size:13px;max-width:460px;line-height:1.55;color:#717b73}
.report{width:100%;margin-top:10px;border-top:1px solid #dfe2de;padding-top:5px;text-align:left}
.report-row{padding:10px 2px;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;border-bottom:1px solid #e8eae7;font-size:12px;line-height:1.4}

.report-row span:last-child{text-align:right;font-weight:600}
.btn.alt{background:#fff;color:#171918}.btn.alt:hover{background:#f0f4ff}
.final-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:13px}
.result-msg{max-width:580px;line-height:1.45;min-height:22px}
@media(max-width:640px){.content{padding:20px 14px}.choicegrid button{min-height:70px;font-size:13px;padding:11px}.scanner{padding:10px}.memcard{min-width:0;width:min(100%,350px)}.formbox{flex-direction:column}.formbox .btn{width:100%}.title h1{font-size:clamp(46px,11vw,59px)}.report-row{font-size:11px}.end-code{font-size:76px}}

<body><div class="shell"><nav class="nav"><a href="/">← aynen.fun</a><span>ROBOT GİRİŞ SİSTEMİ / TR</span></nav><header class="title"><h1>İnsan mısın?</h1><p>Robotlar için bir giriş sistemi. İnsan davranışı şüpheli sayılır.</p></header>
<main class="panel"><div><div class="hud"><span class="progress" id="level">DOĞRULAMA / BAŞLANGIÇ</span><span class="detail" id="detail">İNSANLIK ORANI: %0</span></div><div class="track"><i id="track"></i></div></div><section class="content" id="content" aria-live="polite"></section><footer class="foot"><span>BU BİR OYUNDUR. GERÇEK KİMLİK DOĞRULAMASI YAPMAZ.</span><span id="footerState">AYNEN.FUN / CAPTCHA-TR</span></footer></main></div>
<script>

(function(){
'use strict';
var $=id=>document.getElementById(id);
var content=$('content'),level=$('level'),detail=$('detail'),track=$('track');
var state={step:0,mode:'normal',round:0,robot:0,human:0,claim:'',records:[],memory:null,task:null,started:0,ended:false,seed:Math.floor(Math.random()*100000),retries:0};
var timeout=null,animation=null;
function resetAsync(){if(timeout!==null){clearTimeout(timeout);timeout=null}if(animation!==null){cancelAnimationFrame(animation);animation=null}}
function indexFor(n,salt){return Math.abs((state.seed+state.round*7+state.robot*3+state.human*5+salt*11)%n)}
function take(items,salt){return items[indexFor(items.length,salt)]}
function header(){level.textContent='DOĞRULAMA '+String(state.step+1).padStart(2,'0')+' / 08';detail.textContent='TAMAMLANDI: %'+Math.round(state.step/8*100);track.style.width=(state.step/8*100)+'%';$('footerState').textContent=state.mode==='imitation'?'MOD: ROBOT TAKLİDİ':'ROBOT AĞI / TARAMA';}
function screen(tag,question,help,markup){
 content.style.animation='none';void content.offsetWidth;content.style.animation='';
 content.innerHTML='<div class="eyebrow">'+tag+'</div><h2 class="question">'+question+'</h2><p class="help">'+help+'</p><div class="zone" id="zone">'+markup+'</div><p class="result-msg" role="status" id="msg" aria-live="polite"></p>';
 state.started=performance.now();
}
function message(s){var x=$('msg');if(x)x.textContent=s}
function action(label,handler,alt){var x=document.createElement('button');x.type='button';x.className='btn'+(alt?' alt':'');x.textContent=label;x.addEventListener('click',handler);return x}
function choice(options,handler){
 var wrap=document.createElement('div');wrap.className='choicegrid';
 options.forEach(function(item){var b=document.createElement('button');b.type='button';b.textContent=item[0];b.addEventListener('click',function(){handler(item[1],item[0])});wrap.appendChild(b)});
 $('zone').appendChild(wrap);
}
function record(id,answer,robot,human,detailText,report,extra){
 if(state.ended||state.records.some(function(x){return x.id===id}))return;
 var item={id:id,answer:answer,robot:robot,human:human,report:report||'',detail:detailText||'',extra:extra||'',elapsed:Math.round(performance.now()-state.started)};
 state.records.push(item);state.robot+=robot;state.human+=human;
 resetAsync();
 content.querySelectorAll('button,input').forEach(function(el){el.disabled=true});
 message(human>=2?'SAPMA KAYDEDİLDİ. Üst protokole iletiliyor.':'YANIT KAYDEDİLDİ. Doğrulama sürüyor.');
 timeout=setTimeout(function(){state.step++;show()},950);
}
function optionsFor(scene,category){
 choice(scene.options,function(answer,label){
  var r=0,h=0,report='';
  if(answer==='literal'||answer==='reject'){r=2;report=category==='context'?'Bağlam yerine sözcük düzeyi tercih edildi.':'Eksik komut sistem hatası olarak döndürüldü.'}
  else if(answer==='infer'||answer==='clarify'||answer==='care'){h=3;report=category==='social'?'Sözlü ifadeyle örtüşmeyen sosyal sinyal yorumlandı.':category==='context'?'Söylenmeyen niyet yorumlandı.':'Eksik bilgi için karşılıklı iletişim başlatıldı.'}
  else{h=1;r=0;report='Kesin protokol yanıtı yerine alternatif değerlendirildi.'}
  record(category,answer,r,h,label,report);
 });
}
var contexts=[
{q:'“Harika. Yine elektrik kesildi.”',h:'Çalışması yarım kalmış biri bunu karanlık odada söylüyor.',options:[['Olumlu görüş bildirildi.','literal'],['Bu bir şikâyet; muhtemelen ironi.','infer'],['Kesin bir duygu atayamam.','unsure']]},
{q:'“Tam da ihtiyacım olan şeydi.”',h:'Yağmurda kalan birinin şemsiyesi kırılmış.',options:[['Memnuniyet kaydedildi.','literal'],['Memnun değil; tersini söylüyor.','infer'],['Ek bağlam istiyorum.','unsure']]},
{q:'“Bir tek bu eksikti.”',h:'Arkadaşının telefonu yere düşüp ekranı çatlamış.',options:[['Eksik öğe eklendi.','literal'],['Yeni bir talihsizlikten yakınıyor.','infer'],['Yorumu askıya alırım.','unsure']]},
{q:'“Üşüdüm biraz.”',h:'Pencere açık. Karşındaki kişi pencereye bakıyor.',options:[['Sıcaklık bildirimi kaydedildi.','literal'],['Pencereyi kapatmayı teklif ederim.','infer'],['Ek talimat beklerim.','unsure']]},
{q:'“Burada biraz ses var.”',h:'Arkadaşın telefonla konuşuyor; yanından matkap sesi geliyor.',options:[['Ses seviyesi bildirimi kaydedildi.','literal'],['Daha sessiz yere geçmesini teklif ederim.','infer'],['Yeni komut beklerim.','unsure']]},
{q:'“Burası biraz karanlık.”',h:'Birisi elindeki kitabı okumaya çalışıyor.',options:[['Aydınlık seviyesi düşük.','literal'],['Işığı açmayı teklif ederim.','infer'],['Bir ölçüm isterim.','unsure']]},
{q:'“Toplantı çok kısa sürdü.”',h:'Konuşmacı bitince herkes aynı anda uzun uzun iç çekiyor.',options:[['Süre beklentiden azdı.','literal'],['Söylediğinin ironik olabileceğini düşünürüm.','infer'],['Süreyi sorarım.','unsure']]},
{q:'“Gerçekten mükemmel zamanlama.”',h:'Biri aceleyle çıkarken otobüsü gözünün önünde kaçırmış.',options:[['Olumlu performans kaydı.','literal'],['Hayal kırıklığını ironiyle belirtiyor.','infer'],['Kesin yargı vermem.','unsure']]},
{q:'“Misafir geliyor.”',h:'Bir kişi kapıya bakıp sonra dağınık masaya bakıyor.',options:[['Ziyaret bilgisi kaydedildi.','literal'],['Masayı toplamak isteyebilir, yardım teklif ederim.','infer'],['Herhangi bir görev üstlenmem.','unsure']]}
];
var uncertainties=[
{q:'“Dün konuştuğumuz dosyayı gönder.”',h:'Bu kişiyle daha önce hiçbir dosya konuşmadın.',options:[['Hata: DOSYA_KİMLİĞİ_YOK.','reject'],['Hangi dosya olduğunu sorarım.','clarify'],['En son dosyayı gönderirim.','guess']]},
{q:'“Aynısından iki tane daha.”',h:'Önceden sipariş edilen nesne bilinmiyor.',options:[['Hata: REFERANS_TANIMSIZ.','reject'],['Neyin aynısı olduğunu sorarım.','clarify'],['Muhtemel bir ürün seçerim.','guess']]},
{q:'“Her zamanki yere bırak.”',h:'Bu kişinin önceki teslimat adresi mevcut değil.',options:[['Hata: ADRES_BULUNAMADI.','reject'],['Nereyi kastettiğini sorarım.','clarify'],['Yakın bir teslimat noktası seçerim.','guess']]},
{q:'“Ona haber ver.”',h:'Cümleden önce başka bir kişi tanımlanmadı.',options:[['Hata: ALICI_TANIMSIZ.','reject'],['Kime haber vereceğimi sorarım.','clarify'],['En son görüştüğüm kişiye yazarım.','guess']]},
{q:'“Biraz daha büyüt.”',h:'Ekranda hangi nesneden bahsedildiği belli değil.',options:[['Hata: HEDEF_YOK.','reject'],['Neyi büyüteceğimi sorarım.','clarify'],['En büyük öğeyi seçerim.','guess']]},
{q:'“Eskisi gibi yap.”',h:'Bu işlem için kayıtlı bir önceki sürüm yok.',options:[['Hata: SÜRÜM_YOK.','reject'],['Hangi sürümü istediğini sorarım.','clarify'],['Varsayılan ayarlara dönerim.','guess']]},
{q:'“Yarın aynı saatte gel.”',h:'Daha önce bir saat belirlenmedi.',options:[['Hata: SAAT_BELİRSİZ.','reject'],['Saati netleştirmesini isterim.','clarify'],['Öğle saatini varsayarım.','guess']]},
{q:'“Onu da ekle.”',h:'Liste boş, “o” nesnesi tanımlanmamış.',options:[['Hata: NESNE_BULUNAMADI.','reject'],['Neyi eklememi istediğini sorarım.','clarify'],['Rastgele bir öğe eklerim.','guess']]},
{q:'“Bir öncekini seç.”',h:'Henüz hiçbir seçim yapılmadı.',options:[['Hata: ÖNCEKİ_SEÇİM_YOK.','reject'],['Hangi seçenekten söz ettiğini sorarım.','clarify'],['İlk seçeneği işaretlerim.','guess']]}
];
var socials=[
{q:'“İyiyim.”',h:'Yakın arkadaşının sesi titriyor ve gözlerini kaçırıyor.',options:[['Durum: İYİ. Kaydet.','literal'],['Gerçekten iyi olup olmadığını sorarım.','care'],['Söylediğiyle yetinirim ama beklerim.','wait']]},
{q:'“Önemli değil.”',h:'Karşındaki kişi gözle görülür biçimde üzgün.',options:[['Önem derecesi: sıfır.','literal'],['Konuşmak isteyip istemediğini sorarım.','care'],['Konuyu kapatırım.','wait']]},
{q:'“Sorun yok.”',h:'Birinin eşyasını kırmışsın; gülümsemesi zoraki.',options:[['Sorun kaydı kapatıldı.','literal'],['Zararını telafi etmeyi teklif ederim.','care'],['Yanıtını değiştirmesini beklerim.','wait']]},
{q:'“Biraz yalnız kalayım.”',h:'Arkadaşın zor bir gün geçirdiğini yeni anlattı.',options:[['İletişim tamamen kesildi.','literal'],['Alan tanır, sonra nasıl olduğunu sorarım.','care'],['Yanıt gelene kadar aynı soruyu tekrarlarım.','wait']]},
{q:'“Gerek yok.”',h:'Koliler taşıyan biri zorlandığı hâlde yardım teklifini reddediyor.',options:[['Yardım protokolü iptal.','literal'],['Israr etmeden, fikri değişirse burada olduğumu söylerim.','care'],['Yardım etmekte ısrar ederim.','wait']]},
{q:'“Pek önemli değil.”',h:'Arkadaşın bu haberden önce günlerce heyecanla söz ediyordu.',options:[['Önem katsayısı sıfırlandı.','literal'],['Neden fikrinin değiştiğini merak ederim.','care'],['Yanıt vermem.','wait']]},
{q:'“Hiç yorulmadım.”',h:'Kişi çok uzun bir yürüyüşten sonra nefes nefese.',options:[['Yorgunluk yok: kaydet.','literal'],['Dinlenmek isteyebileceğini düşünürüm.','care'],['Aynı tempoda devam ederim.','wait']]},
{q:'“Ben hallederim.”',h:'Arkadaşın aynı anda üç ağır çanta taşımaya çalışıyor.',options:[['Görev ataması tamamlandı.','literal'],['Bir çantayı taşımayı teklif ederim.','care'],['Uzaklaşırım.','wait']]},
{q:'“İstediğin gibi yap.”',h:'Bir tartışmanın sonunda, belirgin şekilde kırgın söylendi.',options:[['Sınırsız işlem yetkisi verildi.','literal'],['Önce neye kırıldığını anlamaya çalışırım.','care'],['Hiçbir şey yapmam.','wait']]}
];
var memorySequences=[
['Q7','M2','K9'],['P4','V8','R1'],['D6','T3','W5'],
['N8','G1','C7'],['B2','J9','F4'],['L5','S7','H3']
];
function show(){
 resetAsync();
 if(state.step>=8){finish();return}
 header();
 if(state.step===0){
  screen('01 / GİRİŞ İZNİ', 'İnsan mısın?',state.mode==='imitation'?'İkinci deneme: sistem yalnızca robotlara giriş veriyor. Bu kez robot gibi davranmayı dene.':'Bu sistem yalnızca robotlar için tasarlanmıştır. Türünü beyan et.','<div class="check"><div class="statusline">AYNENCAPTCHA / YALNIZCA OTOMATİK İŞLEMLER</div><div class="captcha-brand"><strong>▦</strong>GATE 01</div></div>');
  $('zone').appendChild(action('EVET, İNSANIM',function(){state.claim='human';record('claim','human',0,4,'İnsan beyanı','Kendini insan olarak tanımladın.')} ,true));
  $('zone').appendChild(action('HAYIR, ROBOTUM',function(){state.claim='robot';record('claim','robot',1,0,'Robot beyanı','Robot olduğuna dair beyan verdin.')} ));
 }else if(state.step===1){
  motor();
 }else if(state.step===2){
  var contextPool=(state.claim==='human'||state.human>=2)?contexts.slice(0,3):(state.robot>=3?contexts.slice(3,6):contexts.slice(6,9));
  var c=take(contextPool,3);
  screen('03 / BAĞLAM MODELLERİ',c.q,c.h,'<div class="modehint">KELİME ANLAMI / NİYET ÇIKARIMI</div>');
  optionsFor(c,'context');
 }else if(state.step===3){
  timing();
 }else if(state.step===4){
  memory();
 }else if(state.step===5){
  var slice=state.human>state.robot?uncertainties.slice(0,3):state.robot>=6?uncertainties.slice(3,6):uncertainties.slice(6,9);
  var uncertain=take(slice,6);
  screen('06 / EKSİK GİRDİ',uncertain.q,uncertain.h,'<div class="modehint">GİRİŞ VERİSİ EKSİK / EYLEM BEKLENİYOR</div>');
  optionsFor(uncertain,'ambiguity');
 }else if(state.step===6){
  var pick=state.human>=6?socials.slice(0,3):state.robot>state.human?socials.slice(3,6):socials.slice(6,9);
  var c=take(pick,9);
  screen('07 / SOSYAL SİNYAL',c.q,c.h,'<div class="modehint">SÖZLÜ BEYAN / SÖZLÜ OLMAYAN İPUÇLARI</div>');
  optionsFor(c,'social');
 }else if(state.step===7){
  protocol();
 }
}
function motor(){
 var variants=[
 {start:[60,53],end:[460,156]},
 {start:[60,162],end:[460,52]},
 {start:[60,110],end:[460,110]}
 ];
 var route=take(variants,2),start=route.start,end=route.end;
 screen('02 / HAREKET ANALİZİ','Hedefe sürükle.','Daireyi soldan sağdaki hedefe sürükle. Sistem hareket yolunu ve düzeltmeleri kaydediyor.','<div class="scanner"><canvas id="motionCanvas" width="520" height="210" aria-label="Daireyi başlangıç noktasından hedefe sürükleme alanı"></canvas><div class="scanner-status" id="motionStatus">KAYNAK: SOLDaki DAİRE / HEDEF: SAĞDAKİ HALKA</div></div><div class="probe-note">Fare veya dokunmatik ekranla çalışır. Klavye alternatifi nötr değerlendirilir.</div>');
 var canvas=$('motionCanvas'),ctx=canvas.getContext('2d'),active=false,points=[],retries=0;
 var pos=function(evt){var rect=canvas.getBoundingClientRect();return {x:(evt.clientX-rect.left)*520/rect.width,y:(evt.clientY-rect.top)*210/rect.height,t:performance.now()}};
 function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
 function draw(){
  ctx.clearRect(0,0,520,210);ctx.fillStyle='#fbfcfa';ctx.fillRect(0,0,520,210);
  ctx.strokeStyle='#dce2dc';ctx.lineWidth=2;ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(start[0],start[1]);ctx.lineTo(end[0],end[1]);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#285bd7';ctx.lineWidth=2;ctx.beginPath();ctx.arc(end[0],end[1],25,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#285bd7';ctx.font='11px ui-monospace,monospace';ctx.fillText('HEDEF',end[0]-17,end[1]+39);
  if(points.length>1){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);points.slice(1).forEach(function(p){ctx.lineTo(p.x,p.y)});ctx.strokeStyle='#1b1f1c';ctx.lineWidth=2.5;ctx.stroke()}
  var tail=points.length?points[points.length-1]:{x:start[0],y:start[1]};
  ctx.beginPath();ctx.arc(tail.x,tail.y,15,0,Math.PI*2);ctx.fillStyle=active?'#285bd7':'#171918';ctx.fill();
  ctx.fillStyle='#fff';ctx.font='10px ui-monospace,monospace';ctx.fillText(active?'→':'●',tail.x-5,tail.y+3);
 }
 function down(ev){
  if(ev.pointerType==='mouse'&&ev.button!==0)return;
  var p=pos(ev);
  if(dist(p,{x:start[0],y:start[1]})>38)return;
  active=true;points=[p];try{canvas.setPointerCapture(ev.pointerId)}catch(e){}
  $('motionStatus').textContent='HAREKET İZİ ALINIYOR';draw();
 }
 function move(ev){if(!active)return;points.push(pos(ev));draw()}
 function endDrag(ev){
  if(!active)return;active=false;points.push(pos(ev));draw();
  var tail=points[points.length-1];
  if(dist(tail,{x:end[0],y:end[1]})>33){retries++;points=[];$('motionStatus').textContent='HEDEFE ULAŞILMADI. TEKRAR DENE ('+retries+')';draw();return}
  var total=0,turns=0;
  for(var j=1;j<points.length;j++){total+=dist(points[j-1],points[j]);if(j>1){var ax=points[j-1].x-points[j-2].x,ay=points[j-1].y-points[j-2].y,bx=points[j].x-points[j-1].x,by=points[j].y-points[j-1].y;if(Math.hypot(ax,ay)>2&&Math.hypot(bx,by)>2&&(ax*bx+ay*by)<0)turns++}}
  var direct=Math.hypot(end[0]-start[0],end[1]-start[1]);
  var ratio=total/direct,duration=Math.max(0,Math.round(tail.t-points[0].t));
  var perfect=ratio<=1.08&&turns<=1&&retries===0&&duration>=180&&duration<=1150;
  var report='Hareket: '+duration+' ms / yol sapması: '+Math.round((ratio-1)*100)+'% / düzeltme: '+turns;
  $('motionStatus').textContent='KAYDEDİLDİ: '+duration+' ms · '+Math.round((ratio-1)*100)+'%';
  record('motor','drag',perfect?3:0,perfect?0:2,'İmleç hareketi',report,{ratio:ratio,turns:turns,duration:duration,retries:retries});
 }
 canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',endDrag);
 canvas.addEventListener('pointercancel',function(){active=false;points=[];draw();$('motionStatus').textContent='ÖLÇÜM İPTAL EDİLDİ. YENİDEN DENE'});
 draw();
 $('zone').appendChild(action('KLAVYEYLE DEVAM ET',function(){record('motor','keyboard',0,0,'Klavye alternatifi','Hareket verisi ölçülmedi (erişilebilir alternatif).')},true));
}
function timing(){
 var targets=[1050,1200,1350],target=take(targets,4),tolerance=60;
 screen('04 / ZAMANLAMA','Tam '+(target/1000).toFixed(2).replace('.',',')+' saniye.','Butonu basılı tut ve süre dolduğunda bırak. Tolerans ±'+tolerance+' milisaniye.','<button class="hold-v3" id="hold" type="button">BASILI TUT</button><div class="holdtrack"><i id="fill"></i></div><div class="probe-note" id="timingRead">HEDEF: '+target+' ms / TOLERANS: ±'+tolerance+' ms</div>');
 var hold=$('hold'),active=false,start=0;
 function paint(){if(!active)return;$('fill').style.width=Math.min(100,(performance.now()-start)/target*100)+'%';animation=requestAnimationFrame(paint)}
 function down(ev){
  if(active||hold.disabled)return;
  if(ev&&ev.type==='pointerdown'&&ev.pointerType==='mouse'&&ev.button!==0)return;
  if(ev&&ev.pointerId!==undefined){try{hold.setPointerCapture(ev.pointerId)}catch(e){}}
  active=true;start=performance.now();hold.classList.add('held');hold.textContent='BIRAK';paint();
 }
 function up(){
  if(!active)return;active=false;resetAsync();hold.classList.remove('held');
  var held=Math.round(performance.now()-start),error=Math.abs(target-held),accurate=error<=tolerance;
  $('timingRead').textContent='ÖLÇÜLEN: '+held+' ms / SAPMA: '+error+' ms';
  record('timing',''+held,accurate?3:0,accurate?0:2,'Zamanlama ölçümü','Hedef '+target+' ms; gerçek '+held+' ms; sapma '+error+' ms.',{target:target,held:held,error:error});
 }
 hold.addEventListener('pointerdown',down);hold.addEventListener('pointerup',up);
 hold.addEventListener('pointercancel',function(){active=false;resetAsync();hold.classList.remove('held');hold.textContent='YENİDEN DENE'});
 hold.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();down(e)}});
 hold.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();up()}});
 hold.addEventListener('contextmenu',function(e){e.preventDefault()});
}
function memory(){
 var sequence=take(memorySequences,5),textSeq=sequence.join(' · ');
 state.memory=textSeq;
 screen('05 / GEÇİCİ BELLEK','Diziyi aklında tut.','Dizi iki saniye sonra kaybolacak. Ardından aynı diziyi seç.','<div class="memcard" id="memoryCard"><strong>'+textSeq+'</strong></div><div class="probe-note">GÖSTERİM SÜRESİ: 2,0 SANİYE</div>');
 timeout=setTimeout(function(){
  $('zone').innerHTML='<div class="probe-note">ORİJİNAL DİZİ SİLİNDİ</div>';state.started=performance.now();
  var a=sequence,b=[a[0],a[2],a[1]],c=[a[1],a[0],a[2]],d=[a[2],a[1],a[0]];
  var variants=[[textSeq,'exact'],[b.join(' · '),'wrong'],[c.join(' · '),'wrong'],[d.join(' · '),'wrong']];
  variants.sort(function(x,y){return ((x[0].charCodeAt(0)+state.round*3)%17)-((y[0].charCodeAt(0)+state.round*3)%17)});
  choice(variants,function(v,label){
   var ms=Math.round(performance.now()-state.started),correct=v==='exact';
   record('memory',label,correct?2:0,correct?0:2,'Bellek deneyi',correct?'Dizi doğru hatırlandı ('+ms+' ms).':'Önceki diziyle farklı yanıt verildi ('+ms+' ms).',{responseMs:ms,correct:correct});
  });
 },2100);
}
function protocol(){
 var code=String(1000+indexFor(9000,16)),expected='AUTH|UNIT|'+code;
 screen('08 / AĞ PROTOKOLÜ','Erişim isteğini gönder.','Robot ağı yalnızca geçerli makine komutlarını kabul ediyor. Aşağıdaki biçimi kullan.','<div class="probe"><div class="micro">İSTEK BİÇİMİ / KOMUTU AYNEN YAZABİLİRSİN</div><div class="strong-word" style="font:700 clamp(17px,4.5vw,27px) ui-monospace,monospace;letter-spacing:-.03em">'+expected+'</div></div><form id="request" class="formbox" autocomplete="off"><input id="requestInput" aria-label="Makine komutu" maxlength="80" placeholder="AUTH|UNIT|####" spellcheck="false" autocapitalize="off" required><button class="btn" type="submit">GÖNDER</button></form><div class="probe-note">MAKİNE-MAKİNE İLETİŞİMİ / YALNIZCA KOMUT</div>');
 $('request').addEventListener('submit',function(ev){
  ev.preventDefault();var value=$('requestInput').value.trim();if(!value)return;
  var exact=value===expected;
  record('protocol',value,exact?3:0,exact?0:3,'Komut ayrıştırma',exact?'Giriş komutu, istenen protokolle birebir eşleşti.':'Serbest metin veya geçersiz komut algılandı.');
 });
}
function finish(){
 if(state.ended)return;state.ended=true;resetAsync();
 level.textContent='DOĞRULAMA 08 / 08';detail.textContent='TAMAMLANDI: %100';track.style.width='100%';
 var accepted=state.claim==='robot'&&state.robot>=13&&state.human<=3;
 var review=!accepted&&state.claim==='robot'&&state.robot>=10&&state.human<=6;
 var code=accepted?'200':review?'202':'403';
 var title=accepted?'ROBOT AĞINA HOŞ GELDİN':review?'MANUEL İNCELEME':'ERİŞİM REDDEDİLDİ';
 var sub=accepted?'Makine protokolüyle uyumlu görünen davranışlar kaydedildi.':review?'Robot beyanın alındı fakat sistem bazı insan benzeri sapmalar tespit etti.':'Bu sistem yalnızca robotları kabul ediyor. İnsan davranışı şüphesi nedeniyle giriş engellendi.';
 $('footerState').textContent='SONUÇ: '+code;
 var suspicion=Math.round(state.human/Math.max(1,state.human+state.robot)*100);
 screen('SONUÇ / '+code,accepted?'Doğrulama başarılı.':review?'İnceleme gerekiyor.':'İnsanlık şüphesi tespit edildi.',sub,'<div class="end-results"><div class="end-code">'+code+'</div><div class="end-title">'+title+'</div><div class="modehint">SİMÜLASYON · OYUN İÇİ ANOMALİ ENDEKSİ: %'+suspicion+'</div><div class="report" id="report"></div><div class="final-buttons" id="actions"></div><div class="probe-note">Oyun kurallarıyla üretilen rapordur. İnsan/robot olduğuna dair bilimsel veya gerçek bir doğrulama değildir.</div></div>');
 var report=$('report');
 var anomaly=state.records.filter(function(x){return x.human>0}).sort(function(a,b){return b.human-a.human});
 var chosen=anomaly.slice(0,3);
 if(chosen.length===0)chosen=state.records.filter(function(x){return x.robot>0}).slice(0,3);
 var labels={claim:'KİMLİK',motor:'HAREKET',context:'BAĞLAM',timing:'ZAMANLAMA',memory:'BELLEK',ambiguity:'BELİRSİZLİK',social:'SOSYAL SİNYAL',protocol:'PROTOKOL'};
 chosen.forEach(function(x){
  var row=document.createElement('div');row.className='report-row';
  var left=document.createElement('span');left.textContent=labels[x.id]||'SİNYAL';
  var right=document.createElement('span');right.textContent=x.report;
  row.append(left,right);report.appendChild(row);
 });
 var actions=$('actions');
 actions.appendChild(action('ROBOT TAKLİDİNİ DENE',function(){restart('imitation')}));
 actions.appendChild(action('YENİDEN OYNA',function(){restart('normal')},true));
 actions.appendChild(action('SONUCU PAYLAŞ ↗',async function(){
  var msg='İnsan mısın? — '+code+' '+title+'. Robot ağına girebildin mi? https://aynen.fun/insan-misin.html';
  try{if(navigator.share){await navigator.share({title:'İnsan mısın? — aynen.fun',text:msg,url:location.href})}
    else if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(msg);message('Paylaşım metni kopyalandı.')}
    else window.prompt('Paylaş:',msg);
  }catch(e){}
 },true));
}
function restart(mode){
 resetAsync();
 state={step:0,mode:mode,round:state.round+1,robot:0,human:0,claim:'',records:[],memory:null,task:null,started:0,ended:false,seed:Math.floor(Math.random()*100000),retries:0};
 show();window.scrollTo({top:0,behavior:'smooth'});
}
show();
})();
