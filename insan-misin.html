<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4"><meta name="description" content="İnsan mısın? Türkiye usulü 8 tuhaf CAPTCHA. İnsan olduğunu kanıtlamak sandığından zor. aynen.fun">
<title>İnsan mısın? — aynen.fun</title>
<style>
:root{--bg:#f7f7f4;--ink:#171817;--muted:#858985;--border:#d8dcd8;--blue:#2665dd;--green:#17664b;--red:#c83d38}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.shell{max-width:960px;min-height:100dvh;margin:auto;padding:18px 22px 24px;display:flex;flex-direction:column}
.nav{display:flex;justify-content:space-between;gap:12px;padding-bottom:15px;border-bottom:1px solid var(--border);font:11px ui-monospace,monospace}.nav a{text-decoration:none}.nav span{color:var(--muted)}
.title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:24px 0 19px}.title h1{font-size:clamp(40px,7vw,78px);margin:0;letter-spacing:-.09em;line-height:.96}.title p{margin:0;font-size:12px;line-height:1.55;color:#797d79;max-width:220px}
.panel{border:1px solid #2b302d;background:#fff;min-height:min(575px,calc(100dvh - 215px));display:flex;flex-direction:column;box-shadow:7px 7px 0 #e4e6e0}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding:14px 19px;font:11px ui-monospace,monospace}.hud .progress{color:var(--blue);font-weight:700}.hud .detail{color:var(--muted)}.track{height:3px;background:#e6e8e5}.track i{display:block;width:0%;height:100%;background:var(--blue);transition:width .3s}
.content{flex:1;display:flex;align-items:center;flex-direction:column;justify-content:center;text-align:center;padding:25px 22px;min-height:310px}
.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.08em;color:var(--blue);margin-bottom:13px}
.question{font-size:clamp(24px,4.7vw,45px);line-height:1.08;letter-spacing:-.066em;max-width:710px;margin:0 auto 13px;font-weight:800;text-wrap:balance}
.help{color:#77807b;font-size:13px;line-height:1.6;margin:0 auto 22px;max-width:500px}
.zone{width:min(100%,540px);min-height:95px;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:12px;position:relative}
.btn{background:#181d1a;color:#fff;border:1px solid #181d1a;min-height:50px;padding:13px 22px;font-weight:700;font-size:14px;letter-spacing:-.02em}.btn:hover{background:#2d51b3}.btn.outline{background:#fff;color:#171817}.btn.outline:hover{background:#f3f5fa}.btnrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.note{font:10px ui-monospace,monospace;color:#8f9690;margin-top:5px}.result-msg{min-height:25px;margin:13px 0 0;color:var(--red);font:12px ui-monospace,monospace}
.check{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:21px 23px;border:1px solid #c7cdcf;width:min(380px,100%);box-shadow:0 3px 9px #0000000d}.check label{display:flex;gap:14px;align-items:center;font-size:18px;font-weight:500;cursor:pointer}.check input{appearance:none;width:28px;height:28px;border:2px solid #7f8d8a;flex-shrink:0;cursor:pointer}.check input:checked{background:#2678dc;border-color:#2678dc}.check input:checked:after{content:'✓';color:#fff;font-size:22px;line-height:24px}.captcha-brand{text-align:right;color:#929c9d;font:10px Arial}.captcha-brand strong{display:block;font-size:16px;color:#6e8ca0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:min(340px,100%);margin:5px auto}.tile{aspect-ratio:1;min-height:67px;border:1px solid #bdc5c1;background:#f1f2ef;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:37px;position:relative}.tile span{font:11px ui-monospace,monospace;margin-top:5px}.tile.selected{box-shadow:inset 0 0 0 4px #246bdd;border-color:#246bdd;background:#eaf0fe}.tile.selected:after{content:'✓';position:absolute;right:4px;top:3px;color:#fff;background:#246bdd;font-size:11px;padding:2px 4px}
.tea{width:115px;height:94px;display:flex;align-items:end;justify-content:center;position:relative;margin:2px auto 7px}.tea:before{content:'';position:absolute;bottom:4px;width:69px;height:88px;border:5px solid #4e4e4b;border-top:0;border-radius:0 0 25px 25px;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}.tea:after{content:'';position:absolute;bottom:29px;left:91px;border:5px solid #4e4e4b;border-left:0;width:19px;height:29px;border-radius:0 14px 14px 0}
.tea .tea-liquid{position:absolute;bottom:8px;width:55px;height:0%;max-height:80px;background:linear-gradient(#cf6024,#913a18);border-radius:0 0 18px 18px;transition:height .03s linear}
.gauge{height:12px;background:#e7eae5;width:min(350px,100%);border-radius:14px;position:relative;overflow:hidden}.gauge i{display:block;background:var(--blue);height:100%;width:0%}.gauge:after{content:'';position:absolute;left:66%;width:16%;height:100%;top:0;background:#65b59190;border-inline:1px solid #267756}
.bell{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(420px,100%)}.bell button{height:74px;background:#eeeee9;border:2px solid #b1b6ae;display:flex;flex-direction:column;justify-content:center;gap:5px;align-items:center;font-weight:800;font-size:22px}.bell small{font:10px ui-monospace,monospace;color:#677169}.bell button:active{background:#dbe0dc}
.pos{height:130px;width:min(430px,100%);border:1px dashed #c4c9c3;position:relative;background:#fbfbf8;overflow:hidden}.pos button{position:absolute;left:var(--posx,40%);top:var(--posy,40%);transition:left .14s,top .14s;transform:translate(-50%,-50%);padding:10px 13px;border:1px solid #1b1e1a;border-radius:6px;background:#202825;color:white;font-weight:700;font-size:12px;white-space:nowrap}
.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:min(460px,100%)}.choicegrid button{padding:18px 11px;border:1px solid #c4cac4;background:#fafbf9;font-size:15px;font-weight:700}.choicegrid button:hover{background:#eaf0fe;border-color:#4680cf}
.queue{display:flex;justify-content:center;align-items:center;gap:6px;width:min(380px,100%)}.queue span{font-size:30px;opacity:.32;transition:opacity .2s}.queue span.current{opacity:1;transform:scale(1.16)}
.queue-meter{height:10px;background:#e9ebe6;border-radius:12px;position:relative;width:min(340px,100%);margin:auto}.queue-meter i{display:block;height:100%;background:#d99d46;width:0%;border-radius:12px}
.foot{padding:13px 19px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;color:#939a93;font:10px/1.5 ui-monospace,monospace}.foot a{text-decoration:underline;text-underline-offset:3px}
.badge{font-size:clamp(61px,12vw,108px);letter-spacing:-.09em;font-weight:900;line-height:1;color:var(--blue);margin:7px auto}.endline{font-size:clamp(21px,4vw,35px);font-weight:800;letter-spacing:-.055em;max-width:550px;line-height:1.12}.final-note{font-size:12px;line-height:1.7;color:#818881;max-width:430px}
@media(max-width:620px){.shell{padding:13px 11px 17px}.title{display:block;margin:21px 0 14px}.title h1{font-size:47px}.title p{margin-top:7px;max-width:none;font-size:11px}.panel{min-height:calc(100dvh - 197px);box-shadow:4px 4px 0 #e4e6e0}.hud{padding:12px 13px}.content{padding:23px 13px}.question{font-size:clamp(24px,7.5vw,34px)}.help{font-size:12px}.foot{padding:12px;font-size:9px}.tile{font-size:28px;min-height:60px}.tile span{font-size:9px}.pos{height:170px}.bell button{height:65px}}
@media(max-height:620px){.content{padding:16px}.title{margin:12px 0 8px}.panel{min-height:410px}.question{font-size:25px}.help{margin-bottom:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style></head>
<body><div class="shell"><nav class="nav"><a href="/">← aynen.fun</a><span>İNSAN DOĞRULAMA SİSTEMİ / TR</span></nav><header class="title"><h1>İnsan mısın?</h1><p>Sekiz sosyal refleks. Hiçbirinin doğru cevabı yok. Yine de değerlendiriliyorsun.</p></header>
<main class="panel"><div><div class="hud"><span class="progress" id="level">DOĞRULAMA / BAŞLANGIÇ</span><span class="detail" id="detail">İNSANLIK ORANI: %0</span></div><div class="track"><i id="track"></i></div></div><section class="content" id="content" aria-live="polite"></section><footer class="foot"><span>BU BİR OYUNDUR. GERÇEK KİMLİK DOĞRULAMASI YAPMAZ.</span><span id="footerState">AYNEN.FUN / CAPTCHA-TR</span></footer></main></div>
<script>
(function(){
'use strict';
var steps=['check','asansor','misafir','grup','pazar','ses','mesaj','son'];
var i=0,fail=0,done=false,timer=null,raf=0,started=0,score=0,traits={};
var $=x=>document.getElementById(x),content=$('content'),lv=$('level'),dt=$('detail'),bar=$('track');
function clean(){if(timer)clearTimeout(timer);timer=null;if(raf)cancelAnimationFrame(raf);raf=0}
function ui(k,q,h,b){content.innerHTML='<div class="eyebrow">'+k+'</div><h2 class="question">'+q+'</h2><p class="help">'+h+'</p><div class="zone" id="zone">'+b+'</div><p class="result-msg" id="msg" role="status"></p>'}
function say(t){let e=$('msg');if(e)e.textContent=t}
function button(t,fn,cls){let b=document.createElement('button');b.className='btn'+(cls?' outline':'');b.textContent=t;b.onclick=fn;return b}
function next(){clean();i++;if(i>=steps.length)end();else show()}
function bad(t){fail++;say(t);$('footerState').textContent='İNSANİ HATA: '+fail}
function pass(t,trait){if(trait)traits[trait]=(traits[trait]||0)+1;say(t);timer=setTimeout(next,950)}
function show(){clean();lv.textContent='İNSANLIK TESTİ '+String(i+1).padStart(2,'0')+' / 08';dt.textContent='DOĞRULAMA: %'+Math.round(i/8*100);bar.style.width=(i/8*100)+'%';$('footerState').textContent='İNSANİ HATA: '+fail;let z;
switch(steps[i]){
case 'check':
ui('01 / STANDART CAPTCHA','Robot değilim.','Sistemin tek normal sorusu. Tadını çıkar.','<div class="check"><label><input type="checkbox" id="human"> Ben robot değilim</label><div class="captcha-brand"><strong>▦</strong>aynenCAPTCHA</div></div>');
$('human').onchange=()=>pass('Şüpheli derecede kolaydı.','sabir');break;
case 'asansor':
ui('02 / SOSYAL MESAFE','Asansörde sadece ikiniz varsınız.','Komşun: “Kaçıncı kat?” Sen 3. kata çıkacaksın.','<div class="choicegrid"><button data-a="3">3. KAT</button><button data-a="siz">SİZ KAÇA?</button><button data-a="sus">SESSİZCE 3’E BAS</button><button data-a="mer">ÖNCE MERHABA DE</button></div>');
z=$('zone');z.querySelectorAll('button').forEach(b=>b.onclick=()=>pass(({3:'Doğrudan cevap. Fazla verimli.',siz:'Soruya soruyla cevap. Çok insani.',sus:'Sessizlik biraz uzun sürdü.',mer:'Nezaket doğrulandı. Kat hâlâ bilinmiyor.'})[b.dataset.a],b.dataset.a==='siz'?'sosyal':'sabir'));break;
case 'misafir':
ui('03 / SOSYAL PROTOKOL','Misafir: “Hiç zahmet etmeyin.”','Çay ikram edeceksin. Ne yaparsın?','<div class="choicegrid"><button data-a="getir">ÇAYI GETİR</button><button data-a="sor">BİR DAHA SOR</button><button data-a="su">SADECE SU GETİR</button><button data-a="yok">HİÇBİR ŞEY GETİRME</button></div>');
z=$('zone');z.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.a==='getir')pass('“Ay hiç gerek yoktu.” Çay içildi.','sosyal');else if(b.dataset.a==='sor')pass('“Yok gerçekten.” İkinci çay sorusu bekleniyor.','sosyal');else if(b.dataset.a==='su')pass('“Bir çay olsaydı aslında…”','sabir');else pass('Misafir 40 dakika sonra “Bir çay içseydik” dedi.','sabir')});break;
case 'grup':
ui('04 / GRUP DİNAMİĞİ','Aile grubuna “Günaydın” geldi.','Saat 06.12. Mesajı 23 kişi gördü. Sen ne yaparsın?','<div class="choicegrid"><button data-a="kalp">❤️ GÖNDER</button><button data-a="gun">GÜNAYDIN YAZ</button><button data-a="gor">GÖRÜLDÜ BIRAK</button><button data-a="sessiz">GRUBU SESSİZE AL</button></div>');
z=$('zone');z.querySelectorAll('button').forEach(b=>b.onclick=()=>pass(({kalp:'Kalp attın. Şimdi üç kişi daha günaydın yazdı.',gun:'Bir günaydın zincirini sen de uzattın.',gor:'“Mesajımı gördün mü?” özelden geldi.',sessiz:'Bildirim kapandı. Aile bağı devam ediyor.'})[b.dataset.a],b.dataset.a==='sessiz'?'sabir':'sosyal'));break;
case 'pazar':
ui('05 / PAZARLIK ALGORİTMASI','“Son ne olur?”','Etikette 500 TL yazıyor. Satıcı: “Sana 450 olur.” Pazarlık yap.','<div style="width:min(410px,100%);text-align:center"><div style="font-size:12px;color:#929892">ETİKET 500 TL → TEKLİF 450 TL</div><input id="offer" type="range" min="100" max="450" value="300" step="10" style="width:100%;margin:22px 0 8px;accent-color:#2665dd"><div id="offerlabel" style="font-size:42px;font-weight:900;letter-spacing:-.07em">300 TL</div></div>');
z=$('zone');z.appendChild(button('SON FİYATIM BU',()=>{let n=+$('offer').value;if(n<200)pass('Satıcı: “Sen de bedava al istersen.”','pazarlik');else if(n<350)pass('Satıcı: “Ben de zararına veriyorum zaten.”','pazarlik');else pass('Satıcı: “Tamam, senin güzel hatırın için.”','sosyal')}));
$('offer').oninput=()=>$('offerlabel').textContent=$('offer').value+' TL';break;
case 'ses':
ui('06 / GÜNDELİK SES TANIMA','Üst kattan bu ses geliyor: TAK TAK TAK.','Saat 08.03. Sence ne oluyor?','<div style="font-size:47px;letter-spacing:9px;margin:0 auto 7px">▰ ▰ ▰</div><div class="choicegrid"><button data-a="tadilat">TADİLAT</button><button data-a="topuk">TOPUKLU AYAKKABI</button><button data-a="ceviz">CEVİZ KIRIYORLAR</button><button data-a="belirsiz">BİLMEM MÜMKÜN DEĞİL</button></div>');
z=$('zone');z.querySelectorAll('button').forEach(b=>b.onclick=()=>pass(b.dataset.a==='belirsiz'?'Kesin bir şey söylemedin. Bilimsel yaklaşım.':'Muhtemelen haklısın. Üst kat yine açıklama yapmadı.',b.dataset.a==='belirsiz'?'sabir':'sosyal'));break;
case 'mesaj':
ui('07 / İLETİŞİM PROTOKOLÜ','“Bir şey sorucam.”','Mesaj geldi. 4 dakikadır ikinci mesaj yok. Ne yazarsın?','<div class="choicegrid"><button data-a="sor">SOR</button><button data-a="ne">NE OLDU?</button><button data-a="bekle">BEKLERİM</button><button data-a="kork">HAYIRDIR?</button></div>');
z=$('zone');z.querySelectorAll('button').forEach(b=>b.onclick=()=>pass(({sor:'“Yok ya boşver.”',ne:'“Müsait misin önce?”',bekle:'Bir saat sonra: “Hallettim.”',kork:'“Yok kötü bir şey değil.” Daha kötü oldu.'})[b.dataset.a],b.dataset.a==='bekle'?'sabir':'sosyal'));break;
case 'son':
ui('08 / SON DOĞRULAMA','Bu test ne zaman bitecek?','Sistem insan olduğundan emin olamadı. Son bir işlem gerekiyor.','<div style="border:1px solid #d7dbd5;padding:22px;width:min(380px,100%);font:12px ui-monospace,monospace">İNSANLIK DOĞRULAMASI<br><br><span id="status">LÜTFEN BEKLEYİN...</span><div class="queue-meter" style="margin-top:17px"><i id="queueFill"></i></div></div>');
z=$('zone');z.appendChild(button('YETER ARTIK',()=>{bad('Sabırsızlık tespit edildi. İnsan olma ihtimalin yükseldi.');finish()},true));started=performance.now();function wait(t){if(i!==7||done)return;let p=Math.min(100,(t-started)/4800*100);$('queueFill').style.width=p+'%';if(p>=100){$('status').textContent='TEBRİKLER. SİSTEM HÂLÂ ŞÜPHELİ.';timer=setTimeout(finish,750)}else raf=requestAnimationFrame(wait)}raf=requestAnimationFrame(wait);break;
}}
function finish(){clean();end()}
function end(){if(done)return;done=true;bar.style.width='100%';lv.textContent='DOĞRULAMA TAMAMLANDI';dt.textContent='İNSANLIK: %100';let type=fail>0?'SABIRSIZ İNSAN':(traits.sosyal||0)>=(traits.sabir||0)?'SOSYAL REFLEKS UZMANI':'SESSİZ GÖZLEMCİ';let punch=fail>0?'Robotlar henüz bu kadar çabuk sinirlenmiyor.':type==='SOSYAL REFLEKS UZMANI'?'Bir günaydın mesajıyla 14 bildirim üretebilirsin.':'Hiçbir şey demeyerek çok şey anlattın.';ui('RESMÎ OLMAYAN SONUÇ','İnsan olduğun düşünüldü.','Kesin kanıt yok. Ama yeterince uğraştırdık.','<div class="badge">✓</div><div class="endline">'+type+'</div><p class="final-note">'+punch+'<br>8 test · '+fail+' sabırsızlık kaydı</p>');let z=$('zone');z.appendChild(button('TEKRAR DENE ↻',()=>{i=0;fail=0;done=false;traits={};show()}));z.appendChild(button('SONUCUMU PAYLAŞ ↗',async()=>{let t='İnsan mısın? Sonucum: '+type+'. '+punch+' Seninki ne?';try{if(navigator.share)await navigator.share({title:'İnsan mısın? — aynen.fun',text:t,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(t+' '+location.href);say('Kopyalandı.')}else prompt('Paylaş:',t+' '+location.href)}catch(e){}}));}

show();
})();
</script></body></html>
