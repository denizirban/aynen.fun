<style>

.dot{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);width:var(--dot);height:var(--dot);background:#f2f4ee;border:0;border-radius:50%;box-shadow:0 0 0 5px #090a09;z-index:2;transition:transform .2s,background .2s}
.dot:hover{transform:translateX(-50%) scale(1.35)}.entry.selected .dot{background:#efd68f;transform:translateX(-50%) scale(1.25)}

@media(prefers-reduced-motion:reduce){.viewport{scroll-behavior:auto}.plate,.dot,.bird-image{transition:none}}
</style></head><body>

<script>
'use strict';
const BIRDS=[{"id":1,"name":"Arıkuşu","latin":"Merops apiaster","wiki":"European bee-eater","habitat":"Açık araziler","season":"Yaz konuğu","fact":"Havada yakaladığı arı ve diğer uçan böceklerle beslenir.","color":"#c2a56e","top":32,"height":199,"rotate":-3},{"id":2,"name":"İbibik","latin":"Upupa epops","wiki":"Eurasian hoopoe","habitat":"Bahçeler · bozkır","season":"Yaz konuğu","fact":"Tepesindeki yelpaze biçimli tüyleri ve üç heceli ötüşüyle tanınır.","color":"#ce9965","top":108,"height":173,"rotate":2},{"id":3,"name":"Yalıçapkını","latin":"Alcedo atthis","wiki":"Common kingfisher","habitat":"Dere · kıyı","season":"Yıl boyu görülebilir","fact":"Balık avlamak için suya hızla dalar; tiz bir uçuş çağrısı vardır.","color":"#4d8993","top":60,"height":183,"rotate":1},{"id":4,"name":"Gökkuzgun","latin":"Coracias garrulus","wiki":"European roller","habitat":"Açık orman · tarla","season":"Yaz konuğu","fact":"Parlak mavi kanatları en belirgin biçimde uçarken görülür.","color":"#6da7b0","top":17,"height":217,"rotate":-2},{"id":5,"name":"Bülbül","latin":"Luscinia megarhynchos","wiki":"Common nightingale","habitat":"Çalılık · koruluk","season":"Yaz konuğu","fact":"Geceleri de duyulabilen karmaşık ve güçlü şarkısıyla tanınır.","color":"#b59b80","top":98,"height":165,"rotate":4},{"id":6,"name":"Karatavuk","latin":"Turdus merula","wiki":"Common blackbird","habitat":"Park · bahçe","season":"Yıl boyu görülebilir","fact":"Erkeği siyah, gagası sarıdır; melodik ötüşüyle kentlerde de duyulur.","color":"#75716f","top":26,"height":208,"rotate":-1},{"id":7,"name":"Guguk","latin":"Cuculus canorus","wiki":"Common cuckoo","habitat":"Orman kenarı","season":"Yaz konuğu","fact":"Adını, tekrarlayan iki heceli ötüşünden alır.","color":"#9aa29a","top":138,"height":156,"rotate":-4},{"id":8,"name":"İshakkuşu","latin":"Otus scops","wiki":"Eurasian scops owl","habitat":"Koruluk · bahçe","season":"Çoğunlukla yaz konuğu","fact":"Gece boyunca tekrarlanan kısa, ıslığımsı çağrısı vardır.","color":"#a5a184","top":55,"height":180,"rotate":2},{"id":9,"name":"Kukumav","latin":"Athene noctua","wiki":"Little owl","habitat":"Kırsal · taşlık","season":"Yıl boyu görülebilir","fact":"Gündüzleri de görülebilen küçük bir baykuştur.","color":"#a7a29a","top":0,"height":212,"rotate":1},{"id":10,"name":"Alakarga","latin":"Garrulus glandarius","wiki":"Eurasian jay","habitat":"Meşe ormanı","season":"Yıl boyu görülebilir","fact":"Meşe palamutlarını saklayarak tohumların yayılmasına katkıda bulunur.","color":"#a98c78","top":78,"height":180,"rotate":-2},{"id":11,"name":"Saka","latin":"Carduelis carduelis","wiki":"European goldfinch","habitat":"Tarla · bahçe","season":"Yıl boyu görülebilir","fact":"Kırmızı yüzü ve sarı kanat şeridiyle tanınır.","color":"#c7b372","top":118,"height":155,"rotate":3},{"id":12,"name":"Florya","latin":"Chloris chloris","wiki":"European greenfinch","habitat":"Park · ağaçlık","season":"Yıl boyu görülebilir","fact":"İnce, cızırtılı sesleri kanarya benzeri melodilerle birleştirir.","color":"#919b68","top":15,"height":208,"rotate":1},{"id":13,"name":"Büyük Baştankara","latin":"Parus major","wiki":"Great tit","habitat":"Park · orman","season":"Yıl boyu görülebilir","fact":"Farklı ritimlerde, sıklıkla iki notalı tekrarlarla öter.","color":"#b1ac78","top":94,"height":163,"rotate":-2},{"id":14,"name":"Mavi Baştankara","latin":"Cyanistes caeruleus","wiki":"Eurasian blue tit","habitat":"Bahçe · koruluk","season":"Yıl boyu görülebilir","fact":"Küçük boyuna rağmen çevik, meraklı bir böcek avcısıdır.","color":"#6f9db2","top":47,"height":205,"rotate":2},{"id":15,"name":"Ak Kuyruksallayan","latin":"Motacilla alba","wiki":"White wagtail","habitat":"Su kenarı · kent","season":"Yıl boyu görülebilir","fact":"Yürürken uzun kuyruğunu sık sık yukarı aşağı sallar.","color":"#c4c2ba","top":122,"height":157,"rotate":-3},{"id":16,"name":"Saksağan","latin":"Pica pica","wiki":"Eurasian magpie","habitat":"Kent · tarla","season":"Yıl boyu görülebilir","fact":"Siyah-beyaz tüylerinin koyu bölgelerinde metalik renkler görülür.","color":"#8f96a4","top":28,"height":192,"rotate":-1},{"id":17,"name":"Leylek","latin":"Ciconia ciconia","wiki":"White stork","habitat":"Sulak alan · tarla","season":"Yaz konuğu","fact":"Güçlü ses tellerinden çok, gagasını takırdatarak iletişim kurar.","color":"#c4b9ae","top":70,"height":204,"rotate":2},{"id":18,"name":"Yeşil Ağaçkakan","latin":"Picus viridis","wiki":"European green woodpecker","habitat":"Açık orman · çayır","season":"Yıl boyu görülebilir","fact":"Karıncalarla beslenir; kahkahayı andıran çağrıları vardır.","color":"#92a777","top":15,"height":172,"rotate":-2},{"id":19,"name":"Kumru","latin":"Streptopelia decaocto","wiki":"Eurasian collared dove","habitat":"Kent · bahçe","season":"Yıl boyu görülebilir","fact":"Boynunun arkasındaki siyah yarım halka ayırt edicidir.","color":"#bab2a1","top":111,"height":179,"rotate":3},{"id":20,"name":"Çulhakuşu","latin":"Remiz pendulinus","wiki":"Eurasian penduline tit","habitat":"Söğütlük · sazlık","season":"Yerel ve göçmen popülasyonlar","fact":"Bitki liflerinden, giriş tünelli asılı bir yuva örer.","color":"#c9b793","top":42,"height":204,"rotate":-1}];
const $=id=>document.getElementById(id);
const track=$('track'),viewport=$('viewport'),player=$('player'),audio=$('audio');
const tuneCache=Object.create(null);
let current=null, activeIndex=-1, preloading=false;
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg='<svg viewBox="0 0 140 145" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M28 94c-16-7-23-25-17-37 13 11 24 15 35 12 9-21 37-29 58-12 9 7 13 14 17 22l17 2-17 9c-7 23-33 41-61 29l-22 18 6-27z" fill="#2c302a" opacity=".77"/><path d="M48 76c25-15 43-3 45 15-17 6-37 3-45-15Z" fill="#f5eed2" opacity=".55"/><circle cx="108" cy="69" r="3" fill="#f8f0d5"/><path d="M53 112l-2 20m15-19-1 20" stroke="#2c302a" stroke-width="2"/><path d="M20 134h92" stroke="#463f30" opacity=".3"/></svg>';
function createEntry(b,i){
 const el=document.createElement('div');el.className='entry';el.style.setProperty('--top',b.top);el.style.setProperty('--height',b.height);el.style.setProperty('--tilt',b.rotate+'deg');el.style.setProperty('--shift',((i*13)%36)-19);el.style.setProperty('--dot',(10+(i*7)%16)+'px');el.style.setProperty('--accent',b.color);
 el.innerHTML='<button type="button" class="plate" aria-label="'+escapeHTML(b.name)+' kuşunu dinle"><div class="sheet-top"><span>TR / AVES</span><span>'+String(i+1).padStart(2,'0')+'</span></div><div class="image-area"><img class="bird-image" alt="'+escapeHTML(b.name)+' fotoğrafı" loading="'+(i<5?'eager':'lazy')+'"><div class="bird-silhouette">'+svg+'</div></div><div class="sheet-bottom"><strong>'+escapeHTML(b.name)+'</strong><small>'+escapeHTML(b.latin)+'</small></div><div class="stamp">SES / '+String(i+1).padStart(2,'0')+'</div><span class="play-marker" aria-hidden="true">▶</span></button><div class="slip">'+escapeHTML(b.habitat.toUpperCase())+'</div><div class="stem" aria-hidden="true"></div><button class="dot" type="button" aria-label="'+escapeHTML(b.name)+' kuşunu seç"></button><span class="num">'+String(i+1).padStart(2,'0')+'</span>';
 el.querySelector('.plate').addEventListener('click',()=>choose(i,true));el.querySelector('.dot').addEventListener('click',()=>choose(i,true));track.appendChild(el);return el;
}
const entries=BIRDS.map(createEntry);
function showStatus(s){$('soundStatus').textContent=s}
function setButton(s,disabled){$('listen').textContent=s;$('listen').disabled=!!disabled}
function pause(){audio.pause();audio.removeAttribute('src');audio.load();setButton('▶ Sesi dinle',false)}
function choose(i,playWhenReady){
 const b=BIRDS[i];if(!b)return;
 const old=activeIndex;activeIndex=i;current=b;
 entries.forEach((el,j)=>el.classList.toggle('selected',j===i));
 if(old!==i)pause();
 player.classList.add('open');$('indicator').textContent='KUŞ / '+String(b.id).padStart(2,'0')+' — 20';
 $('birdName').textContent=b.name;$('birdLatin').textContent=b.latin;$('birdFact').textContent=b.fact;
 $('birdMeta').textContent=b.habitat+' · '+b.season;
 $('source').href='https://commons.wikimedia.org/w/index.php?search='+encodeURIComponent(b.latin+' filetype:audio')+'&title=Special:MediaSearch&type=audio';
 $('source').textContent='Ses kaynağı: Wikimedia Commons ↗';
 entries[i].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
 const cached=tuneCache[b.latin];
 if(cached&&cached.url){showStatus('Gerçek doğa kaydı · dinlemeye hazır');applySource(cached)}
 else{showStatus('Ses kaydı aranıyor…');setButton('… Ses aranıyor',true)}
 if(playWhenReady){if(cached&&cached.url){startAudio(cached)}else{
   // Safari'de kullanıcı etkileşimi dışında otomatik ses başlatılmaz: ses hazır olunca yeniden dokunulabilir.
   resolveSound(b).then(r=>{if(activeIndex!==i)return;if(r){showStatus('Kayıt hazır · oynatmak için ▶');setButton('▶ Sesi dinle',false);applySource(r)}else{showStatus('Bu tür için oynatılabilir kayıt bulunamadı');setButton('Kayda ulaşılamadı',true)}})
 }}
 else if(!cached)resolveSound(b).then(r=>{if(activeIndex===i){if(r){showStatus('Kayıt hazır');setButton('▶ Sesi dinle',false);applySource(r)}else{showStatus('Kayıt bulunamadı');setButton('Kayda ulaşılamadı',true)}}});
}
function applySource(r){
 if(!r)return;
 $('source').href=r.page||$('source').href;
 $('source').textContent='Ses: Wikimedia Commons'+(r.license?' · '+r.license:'')+' ↗';
}
function startAudio(r){
 if(!r||!r.url){showStatus('Ses kaydı bulunamadı');return}
 applySource(r);
 if(audio.src!==r.url){audio.src=r.url;audio.load()}
 const playing=audio.play();
 if(playing&&typeof playing.then==='function')playing.then(()=>{setButton('Ⅱ Durdur',false);showStatus('Şimdi dinliyorsun')}).catch(()=>{setButton('▶ Tekrar dene',false);showStatus('Tarayıcı oynatmayı engelledi; tekrar dokun')});
}
$('listen').addEventListener('click',()=>{
 if(!current)return;
 if(!audio.paused){audio.pause();setButton('▶ Sesi dinle',false);showStatus('Duraklatıldı');return}
 const r=tuneCache[current.latin];
 if(r&&r.url)startAudio(r);else{setButton('… Ses aranıyor',true);resolveSound(current).then(out=>{if(out){setButton('▶ Sesi dinle',false);showStatus('Kayıt hazır · tekrar dokun')}else{setButton('Kayda ulaşılamadı',true);showStatus('Kayıt bulunamadı')}})}
});
audio.addEventListener('ended',()=>{setButton('▶ Tekrar dinle',false);showStatus('Kayıt sona erdi')});
audio.addEventListener('error',()=>{if(!current)return;setButton('▶ Tekrar dene',false);showStatus('Ses kaynağı yüklenemedi · kaynak bağlantısını açabilirsin')});
$('dismiss').onclick=()=>{player.classList.remove('open');pause();entries.forEach(e=>e.classList.remove('selected'));activeIndex=-1;current=null};
$('random').onclick=()=>{let i=Math.floor(Math.random()*BIRDS.length);if(i===activeIndex)i=(i+1)%BIRDS.length;choose(i,true)};
$('prev').onclick=()=>viewport.scrollBy({left:-460,behavior:'smooth'});
$('next').onclick=()=>viewport.scrollBy({left:460,behavior:'smooth'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&current)$('dismiss').click();if(!current||e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'){e.preventDefault();choose(Math.min(activeIndex+1,19),false)}else if(e.key==='ArrowLeft'){e.preventDefault();choose(Math.max(activeIndex-1,0),false)}});
let dragging=false,startX=0,startScroll=0,moved=false;
viewport.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;dragging=true;moved=false;startX=e.clientX;startScroll=viewport.scrollLeft});
window.addEventListener('pointermove',e=>{if(!dragging)return;let dx=e.clientX-startX;if(Math.abs(dx)>5){moved=true;viewport.classList.add('dragging');viewport.scrollLeft=startScroll-dx}});
window.addEventListener('pointerup',()=>{dragging=false;viewport.classList.remove('dragging');setTimeout(()=>moved=false,30)});
viewport.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault()}},true);
const api='https://commons.wikimedia.org/w/api.php';
const getJSON=async(u,timeout=8500)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(u,{signal:c.signal,credentials:'omit'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}};
const params=o=>new URLSearchParams(Object.assign({action:'query',format:'json',origin:'*',formatversion:'2'},o)).toString();
function canUse(mime,url){if(mime==='audio/mpeg'||/\.mp3(?:\?|$)/i.test(url))return true;if(mime==='audio/wav'||mime==='audio/x-wav')return true;if(mime==='audio/ogg'||/\.ogg(?:\?|$)/i.test(url))return !!audio.canPlayType('audio/ogg; codecs="vorbis"')||!!audio.canPlayType('audio/ogg');if(mime==='audio/webm')return !!audio.canPlayType('audio/webm');return false}
async function soundSearch(latin,wide){
 const query=wide?latin:('"'+latin+'" filetype:audio');
 const url=api+'?'+params({generator:'search',gsrsearch:query,gsrnamespace:'6',gsrlimit:15,prop:'imageinfo',iiprop:'url|mime|size|extmetadata',iiextmetadatafilter:'LicenseShortName',iiurlwidth:480});
 const data=await getJSON(url);const pages=data.query&&data.query.pages||[];
 const candidates=pages.map(p=>({title:p.title,info:p.imageinfo&&p.imageinfo[0]})).filter(x=>x.info&&canUse(x.info.mime,x.info.url)&&x.title.toLowerCase().includes(latin.toLowerCase().split(' ')[0])).sort((a,b)=>{
  const aa=a.title.toLowerCase().includes(latin.toLowerCase())?0:1;const bb=b.title.toLowerCase().includes(latin.toLowerCase())?0:1;if(aa!==bb)return aa-bb;return (a.info.size||10000000)-(b.info.size||10000000);
 });
 const x=candidates[0];return x?{url:x.info.url,page:x.info.descriptionurl||'https://commons.wikimedia.org/wiki/'+encodeURIComponent(x.title.replace(' ','_')),license:x.info.extmetadata&&x.info.extmetadata.LicenseShortName&&x.info.extmetadata.LicenseShortName.value||''}:null;
}
function resolveSound(b){
 if(tuneCache[b.latin])return Promise.resolve(tuneCache[b.latin]);
 if(b.soundPromise)return b.soundPromise;
 b.soundPromise=(async()=>{try{let r=await soundSearch(b.latin,false);if(!r)r=await soundSearch(b.latin,true);tuneCache[b.latin]=r||{url:null};return r}catch(e){tuneCache[b.latin]={url:null};return null}})();
 return b.soundPromise;
}
async function loadPhotos(){
 try{
  const wikiTitles=BIRDS.map(b=>b.wiki).join('|');
  const url='https://en.wikipedia.org/w/api.php?'+params({prop:'pageimages',piprop:'thumbnail',pithumbsize:520,titles:wikiTitles,redirects:1});
  const data=await getJSON(url,11000);const pageMap={};const redirects={};
  (data.query&&data.query.redirects||[]).forEach(r=>redirects[r.from.toLowerCase()]=r.to.toLowerCase());
  (data.query&&data.query.pages||[]).forEach(p=>{if(p.thumbnail&&p.thumbnail.source)pageMap[p.title.toLowerCase()]=p.thumbnail.source});
  BIRDS.forEach((b,i)=>{const src=pageMap[redirects[b.wiki.toLowerCase()]||b.wiki.toLowerCase()];if(!src)return;const img=entries[i].querySelector('img');img.onload=()=>img.classList.add('loaded');img.onerror=()=>img.removeAttribute('src');img.src=src});
 }catch(e){/* placeholders stay visible offline */}
}
loadPhotos();
(async()=>{ // Arka planda yalnızca gerçek, lisansı görülebilen ses dosyalarını çöz.
 for(let i=0;i<BIRDS.length;i++){
  const b=BIRDS[i];try{await resolveSound(b);if(activeIndex===i&&tuneCache[b.latin]&&tuneCache[b.latin].url){showStatus('Kayıt hazır · oynatmak için ▶');setButton('▶ Sesi dinle',false);applySource(tuneCache[b.latin])}}catch(e){}
  await new Promise(r=>setTimeout(r,160));
 }
})();
