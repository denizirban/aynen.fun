<style>
:root{--ink:#171717;--grey:#777;--line:#e8e8e8;--pink:#fc8aaa;--lime:#d6f26e;--blue:#b9c7f9;--violet:#e6d7ff;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--white);color:var(--ink);font-family:'Space Grotesk',Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #906dff;outline-offset:4px}
.mono{font-family:'DM Mono','Courier New',monospace;letter-spacing:-.015em} .wrap{max-width:1150px;margin:0 auto;padding:0 32px}
.topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand-mini{font-weight:700;letter-spacing:-.08em;font-size:18px}.top-right{display:flex;gap:22px;align-items:center;font-size:10px;text-transform:uppercase}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9dd721;margin-right:8px}
.hero{min-height:530px;display:flex;align-items:center;flex-direction:column;justify-content:center;text-align:center;padding:60px 18px 57px;position:relative}
.logo-img{width:225px;max-width:70vw;aspect-ratio:230/198;object-fit:contain;object-position:center bottom;display:block;margin:0 auto -7px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.02))}
.hero h1{font-size:clamp(86px,12vw,160px);letter-spacing:-.12em;line-height:.86;margin:0 0 23px 0;font-weight:700;padding-right:.13em}
.hero-sub{font-size:13px;font-weight:600;letter-spacing:-.01em;margin:0 0 23px}.hero-sub span{background:var(--lime);box-shadow:4px 0 0 var(--lime),-4px 0 0 var(--lime)}
.hero-micro{font-size:10px;color:#8a8a8a;margin:0;text-transform:uppercase}.spark{position:absolute;font-weight:700;font-size:14px}.sp1{left:14%;top:37%;transform:rotate(-16deg)}.sp2{right:17%;top:35%;font-size:30px;transform:rotate(14deg)}
.section-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #222;padding-bottom:17px;margin:0 0 22px}.section-head h2{font-weight:700;font-size:24px;letter-spacing:-.07em;margin:0}.section-head small{font-size:10px;color:#666}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.game{border:1px solid #ddd;padding:10px;text-align:left;background:white;transition:transform .2s,box-shadow .2s;min-width:0;display:flex;flex-direction:column}.game:hover{transform:translateY(-6px);box-shadow:7px 7px 0 #181818}.game:active{transform:translateY(-1px)}.game-art{height:230px;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden}.art-pink{background:#f6b2ca}.art-lime{background:#d8ef8f}.art-blue{background:#c8d1f5}.art-violet{background:#e8d9fa}.art-yellow{background:#f8de92}.art-cream{background:#f0e9df}
.sticker{position:absolute;left:13px;top:14px;font-size:10px;border:1px solid #1e1e1e;padding:6px 7px;background:white;transform:rotate(-5deg);font-family:'DM Mono',monospace}.art-center{font-weight:700;letter-spacing:-.06em}.nothing-circle{width:132px;height:132px;background:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:67px;transform:rotate(-16deg);box-shadow:8px 8px 0 rgba(0,0,0,.14)}.no-button{background:#fff;border:3px solid #151515;color:#151515;font-size:40px;padding:16px 28px;transform:rotate(-9deg);box-shadow:8px 8px 0 #151515}.paper{background:white;border:2px solid black;width:130px;height:160px;transform:rotate(11deg);box-shadow:8px 8px 0 rgba(0,0,0,.16);padding:23px 16px;display:flex;flex-direction:column;gap:13px}.paper i{height:7px;background:#111;width:100%}.paper i:nth-child(3){width:60%}.paper b{font-size:40px;text-align:center;line-height:1}.typing{background:white;border:2px solid #111;padding:19px 18px;transform:rotate(-7deg);font-size:23px;box-shadow:7px 7px 0 #111}.loading-ring{width:122px;height:122px;border:19px solid #151515;border-top-color:white;border-radius:50%;transform:rotate(30deg)}.rating{font-size:78px;font-weight:700;transform:rotate(-10deg);text-shadow:5px 5px 0 #fff}
.game-meta{display:flex;justify-content:space-between;font-size:10px;color:#777;padding:16px 4px 7px}.game h3{font-size:24px;letter-spacing:-.06em;margin:0 4px 7px;font-weight:700}.game p{font-size:12px;color:#666;line-height:1.5;margin:0 4px 19px;flex:1}.play-link{font-size:11px;font-weight:700;letter-spacing:-.03em;margin:0 4px 6px;display:flex;align-items:center;justify-content:space-between}.play-link span:last-child{font-size:20px}
.after{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin:75px 0 0;padding:20px 0 30px}.after p{font-size:12px;color:#777;margin:0}.after strong{font-weight:700}.footer-note{font-size:10px;color:#888}
.modal{position:fixed;inset:0;background:rgba(14,14,14,.64);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}.modal.on{display:flex}.panel{background:#fff;width:min(100%,550px);border:2px solid #111;box-shadow:12px 12px 0 rgba(0,0,0,.35);min-height:420px;padding:22px;display:flex;flex-direction:column}.modal-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:16px;font-size:10px}.close{border:1px solid #222;width:34px;height:34px;background:#fff;font-size:22px;display:grid;place-items:center}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 10px;gap:18px;min-height:280px}.stage h2{font-size:clamp(28px,6vw,43px);line-height:1.05;letter-spacing:-.07em;margin:0}.stage p{font-size:13px;color:#666;margin:0;max-width:360px;line-height:1.6}.stage .big{font-size:64px;font-weight:700;letter-spacing:-.06em}.action{border:2px solid #111;padding:14px 22px;background:#d9f08b;font-size:15px;font-weight:700;box-shadow:4px 4px 0 #111;min-height:49px}.action:hover{background:#f4b6d1}.action-secondary{background:white}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.progress{width:100%;height:8px;background:#eee;margin-top:5px}.progress>i{display:block;height:100%;background:#111;transition:width .3s}.game-timer{font-size:48px;font-weight:700}.question{border:1px solid #ddd;padding:14px;background:#f5f5f5;font-size:12px}.move-no{position:relative}.result-kicker{background:#fa9bbd;padding:5px 9px;font-size:10px;transform:rotate(-5deg)}
@media(max-width:760px){.wrap{padding:0 20px}.topbar{height:52px}.top-right{gap:10px;font-size:9px}.hero{min-height:445px;padding:48px 10px}.logo-img{width:185px}.hero h1{font-size:clamp(76px,18vw,112px);margin-bottom:21px}.sp1{left:3%;top:33%}.sp2{right:7%;top:33%}.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game-art{height:175px}.game h3{font-size:19px}.game-meta{font-size:8px}.nothing-circle{width:103px;height:103px;font-size:51px}.no-button{font-size:30px;padding:12px 21px}.paper{transform:scale(.8) rotate(11deg)}.typing{font-size:16px}.after{margin-top:50px}}
@media(max-width:490px){.games{grid-template-columns:1fr}.game-art{height:205px}.game h3{font-size:23px}.section-head h2{font-size:22px}.hero h1{font-size:88px}.hero{min-height:420px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<section class="wrap" id="oyunlar"><div class="section-head"><h2>OYNANABİLİR ŞEYLER <span style="font-size:13px;vertical-align:top">↘</span></h2><small class="mono">01 — 06 / İYİ EĞLENCELER SANIRIZ</small></div>
<div class="games">
<button class="game" type="button" data-game="nothing"><div class="game-art art-pink"><span class="sticker">001 / HARD MODE</span><div class="nothing-circle art-center">0</div></div><div class="game-meta mono"><span>01 / REFLEKS</span><span>30 SN</span></div><h3>Hiçbir Şey Yapma</h3><p>Hayatında ilk kez bunun için ödüllendirilebilirsin.</p><div class="play-link mono"><span>OYNA</span><span>↗</span></div></button>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Oyun penceresi"><div class="panel"><div class="modal-top mono"><span id="modal-label">AYNEN. / OYUN</span><button class="close" id="close" aria-label="Oyunu kapat">×</button></div><div class="stage" id="stage"></div><div class="mono" style="font-size:10px;color:#999;text-align:right" id="round">AYNEN.FUN / BETA</div></div></div>
<script>
(()=>{
const modal=document.getElementById('modal'),stage=document.getElementById('stage'),label=document.getElementById('modal-label');let timers=[],current='',startedAt=0,score=0;
const clear=()=>{timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[]};const later=(fn,t)=>timers.push(setTimeout(fn,t));
const show=html=>{stage.innerHTML=html};
const btn=(text,fn,cls='action')=>{const b=document.createElement('button');b.className=cls;b.textContent=text;b.onclick=fn;return b};
const close=()=>{clear();modal.classList.remove('on');document.body.style.overflow=''};
document.getElementById('close').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
const result=(heading,desc,share)=>{clear();show(`<span class="mono result-kicker">OYUN BİTTİ</span><h2>${heading}</h2><p>${desc}</p><div class="actions" id="result-actions"></div>`);const row=document.getElementById('result-actions');row.append(btn('TEKRAR',()=>run(current),'action action-secondary'));row.append(btn('PAYLAŞ ↗',()=>{const url=location.origin+location.pathname+'?game='+current;const payload={title:'AYNEN.',text:share||heading,url};if(navigator.share)navigator.share(payload).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(`${payload.text} ${url}`).then(()=>{row.lastChild.textContent='KOPYALANDI ✓'}).catch(()=>{row.lastChild.textContent='LİNKİ KOPYALA'});else window.prompt('Paylaş:',url)}))};
function run(game){clear();current=game;score=0;label.textContent='AYNEN. / '+({nothing:'HİÇBİR ŞEY YAPMA',no:'HAYIR DİYEBİLİR MİSİN?',paper:'BİR EVRAK EKSİK',message:'BİR ŞEY SORACAĞIM',loading:'AZ KALDI',success:'BAŞARI SİMÜLATÖRÜ'}[game]||'OYUN');
if(game==='nothing'){show('<h2>Hiçbir şey yapma.</h2><p>15 saniye boyunca kırmızı butona basma. Başka bir şey yapabilirsin.</p>');stage.append(btn('BAŞLA',()=>{startedAt=Date.now();show('<div class="game-timer mono" id="count">15.0</div><h2>Dokunma.</h2><p>Gerçekten bu kadar basit.</p><div class="actions" id="tempt"></div>');const tempt=document.getElementById('tempt');tempt.append(btn('BASMA',()=>result('Dayanamadın.',`${((Date.now()-startedAt)/1000).toFixed(1)} saniye dayandın. Bu bir başarı değil.`, 'Hiçbir şey yapma oyununda dayanamadım.')));const t=setInterval(()=>{const left=Math.max(0,15-(Date.now()-startedAt)/1000);const c=document.getElementById('count');if(c)c.textContent=left.toFixed(1);if(left<=0)result('Hiçbir şey yaptın.','15 saniyede sıfır şey başardın. Seni tebrik etmek için bir neden bulamadık.','15 saniye hiçbir şey yapmadım.');},90);timers.push(t);later(()=>{const b=tempt.querySelector('button');if(b)b.textContent='LÜTFEN BAS';},4400);later(()=>{const b=tempt.querySelector('button');if(b)b.textContent='BAS. BİR ŞEY OLMAZ.';},8600)}))}
else if(game==='no'){let tries=0;const draw=()=>{show('<h2>Bir şey rica edebilir miyim?</h2><p>Hayır diyebileceğine emin misin?</p><div class="actions" id="choices" style="position:relative;min-height:90px;width:100%;align-items:center"></div>');const choices=document.getElementById('choices');choices.append(btn('EVET',()=>result('Yine kabul ettin.','Sınır koyma pratiği bir sonraki oyuna kaldı.','Yine hayır diyemedim.')));const no=btn('HAYIR',()=>{tries++;if(tries>=5)result('Hayır dedin.','Beş kez denedin. Tamam, bu sayılır.','Sonunda hayır diyebildim.');else {no.style.transform=`translate(${(tries%2===0?-1:1)*Math.min(tries*25,85)}px,${tries%2===0?20:-12}px)`;choices.firstChild.style.transform=`scale(${1+tries*.13})`;}} ,'action action-secondary');choices.append(no);no.addEventListener('pointerenter',()=>{if(tries<4)no.style.transform=`translate(${tries%2===0?52:-52}px,12px)`})};draw()}
else if(game==='paper'){const steps=[['T.C. kimlik fotokopisi','Belgenin aslı gerekli.'],['Belgenin aslı','Fotokopisini getiriniz.'],['Fotokopi','Islak imza eksik.'],['Islak imza','İmzanın fotokopisi gerekli.'],['İmzanın fotokopisi','Sistem bakımda.'],['Tekrar dene','İşleminiz başarıyla ertelendi.']];let n=0;const next=()=>{if(n===steps.length)return result('Bir evrak eksik.','İşlem tamamlanmadı. Aslında hiç başlamamıştı.','Bir evrak eksikti. Altı evrak sonra yine eksik.');let [a,b]=steps[n++];show(`<span class="mono" style="font-size:11px">DOSYA NO: 000${n}</span><h2>${n===1?'Başvurunuz alındı.':b}</h2><p>${n===1?'İşleminize devam etmek için lütfen gerekli belgeyi yükleyiniz.':'Lütfen aşağıdaki belgeyi sisteme iletiniz.'}</p><div class="progress"><i style="width:${Math.min(99,n*19)}%"></i></div>`);stage.append(btn(a+' ✓',next))};next()}
else if(game==='message'){show('<h2>bi şey sorucam</h2><p id="typing">yazıyor...</p><div class="mono" style="font-size:36px">•••</div>');later(()=>{let p=document.getElementById('typing');if(p)p.textContent='yazıyor...';},2000);later(()=>result('Yok ya boşver.','Soru sorulmadı. Sorunun cevabı da bilinmiyor.','Bana bir şey soracaklardı. Sormadılar.'),6500)}
else if(game==='loading'){startedAt=Date.now();show('<div class="game-timer mono" id="loadperc">99%</div><h2>Az kaldı.</h2><p id="loadmsg">Bir şeyin yüklenmesini bekliyorsun.</p><div class="progress"><i style="width:99%"></i></div>');later(()=>{let p=document.getElementById('loadmsg');if(p)p.textContent='Çok az kaldı.'},3000);later(()=>{let p=document.getElementById('loadmsg');if(p)p.textContent='Sabrın için teşekkürler.'},6000);later(()=>result('Yüklenemedi.','İnternet bağlantın iyi. Sorun bizde.','Yedi saniye bekledim. Hiçbir şey yüklenmedi.'),8000)}
else if(game==='success'){let n=0;const draw=()=>{show(`<span class="mono">BAŞARI RAPORU</span><div class="big mono">%${n*100}</div><h2>${n?'Biraz daha başarılı ol.':'Başarmaya hazır mısın?'}</h2><p>Ne konuda olduğunu sorma.</p>`);stage.append(btn(n?'DAHA BAŞARILI OL':'BAŞAR',()=>{n++;if(n===12)result('%1200 başarılısın.','Neyi başardığını bilmiyoruz. Bunun önemli olduğunu da düşünmüyoruz.','%1200 başarılıyım. Nedenini bilmiyorum.');else draw()}))};draw()}}
document.querySelectorAll('[data-game]').forEach(x=>x.onclick=()=>{modal.classList.add('on');document.body.style.overflow='hidden';run(x.dataset.game)});
let requested=new URLSearchParams(location.search).get('game');if(['nothing','no','paper','message','loading','success'].includes(requested)){modal.classList.add('on');document.body.style.overflow='hidden';run(requested)};
})();
</script>
</body></html>
